<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Live Caption</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}


/* =========================================================
   CONTROL BAR
   ========================================================= */

#controls {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 100;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px 12px;

    background: #181818;

    border-bottom: 1px solid #444;

    flex-wrap: wrap;
}


button,
select {

    font-family: Arial, Helvetica, sans-serif;

    font-size: 15px;

    padding: 9px 12px;

    border: 1px solid #666;

    border-radius: 6px;

    background: #292929;

    color: #fff;

    cursor: pointer;
}


button:hover,
select:hover {

    background: #383838;
}


button:disabled {

    opacity: 0.45;

    cursor: default;
}


label {

    display: flex;

    align-items: center;

    gap: 5px;

    font-size: 14px;
}


#status {

    margin-left: auto;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   CAPTION SCREEN
   ========================================================= */

#captionArea {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding:

        0
        6vw
        8vh
        6vw;

    pointer-events: none;
}


/* =========================================================
   CAPTION CONTAINER

   THIS IS THE IMPORTANT PART.

   The caption itself is only a small area near
   the bottom of the screen.

   It does NOT occupy the whole screen.
   ========================================================= */

#caption {

    width: 100%;

    max-width: 1600px;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;
}


/* =========================================================
   CAPTION TEXT

   Maximum TWO lines.
   ========================================================= */

#captionText {

    display: -webkit-box;

    -webkit-box-orient: vertical;

    -webkit-line-clamp: 2;

    overflow: hidden;

    width: 100%;

    max-width: 1600px;

    max-height: 2.35em;

    font-size: 90px;

    font-weight: 700;

    line-height: 1.12;

    text-align: center;

    overflow-wrap: normal;

    word-break: normal;

    white-space: normal;

    text-shadow:

        2px 2px 4px #000,

        -2px -2px 4px #000,

        2px -2px 4px #000,

        -2px 2px 4px #000;
}


#captionText.interim {

    opacity: 0.72;
}


#captionText.spelling {

    font-weight: 900;

    letter-spacing: 0.08em;

    text-transform: uppercase;
}


.hidden {

    visibility: hidden;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    #controls {

        padding: 8px;
    }

    button,
    select {

        font-size: 14px;

        padding: 8px 10px;
    }

    #status {

        width: 100%;

        margin-left: 0;
    }

    #captionArea {

        padding-left: 4vw;

        padding-right: 4vw;

        padding-bottom: 7vh;
    }

    #captionText {

        font-size: 55px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     CONTROLS
     ===================================================== -->

<div id="controls">

    <button id="startBtn">
        ▶ Start Listening
    </button>

    <button id="stopBtn" disabled>
        ■ Stop
    </button>

    <button id="clearBtn">
        Clear
    </button>

    <button id="fullscreenBtn">
        ⛶ Full Screen
    </button>

    <label>

        Size:

        <select id="sizeSelect">

            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90" selected>90</option>
            <option value="100">100</option>
            <option value="110">110</option>
            <option value="120">120</option>

        </select>

    </label>


    <label>

        Language:

        <select id="languageSelect">

            <option value="en-US">
                English
            </option>

            <option value="th-TH">
                Thai
            </option>

        </select>

    </label>


    <span id="status">
        Ready
    </span>

</div>


<!-- =====================================================
     CAPTION
     ===================================================== -->

<main id="captionArea">

    <div id="caption">

        <div
            id="captionText"
            class="hidden">
        </div>

    </div>

</main>


<script>

"use strict";


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================================================
   ELEMENTS
   ========================================================= */

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const clearBtn =
    document.getElementById("clearBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const sizeSelect =
    document.getElementById("sizeSelect");

const languageSelect =
    document.getElementById("languageSelect");

const status =
    document.getElementById("status");

const captionText =
    document.getElementById("captionText");


/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let listening = false;

let manuallyStopped = false;

let restarting = false;

let silenceTimer = null;

let finalSentence = "";

let interimSentence = "";

let spellingMode = false;

let waitingForSpellingWord = false;


const SILENCE_DELAY = 1800;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {

    status.textContent = text;
}


/* =========================================================
   SHOW / HIDE
   ========================================================= */

function showCaption() {

    captionText.classList.remove(
        "hidden"
    );
}


function hideCaption() {

    captionText.classList.add(
        "hidden"
    );
}


/* =========================================================
   CLEAR CAPTION
   ========================================================= */

function clearCaption() {

    cancelSilenceTimer();

    finalSentence = "";

    interimSentence = "";

    spellingMode = false;

    waitingForSpellingWord = false;

    captionText.textContent = "";

    captionText.classList.remove(
        "interim"
    );

    captionText.classList.remove(
        "spelling"
    );

    hideCaption();
}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilenceTimer() {

    if (silenceTimer !== null) {

        clearTimeout(
            silenceTimer
        );

        silenceTimer = null;
    }
}


function startSilenceTimer() {

    cancelSilenceTimer();

    silenceTimer = setTimeout(
        function () {

            /*
               When the teacher stops talking,
               remove the caption.

               This prevents old sentences from
               remaining on the screen.
            */

            finalSentence = "";

            interimSentence = "";

            captionText.textContent = "";

            captionText.classList.remove(
                "interim"
            );

            captionText.classList.remove(
                "spelling"
            );

            hideCaption();

            silenceTimer = null;

        },
        SILENCE_DELAY
    );
}


/* =========================================================
   FILLER WORDS
   ========================================================= */

function removeFillers(text) {

    return text

        .replace(
            /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
            ""
        )

        .replace(
            /\s{2,}/g,
            " "
        )

        .trim();
}


/* =========================================================
   REPEATED WORDS
   ========================================================= */

function removeImmediateRepeats(text) {

    const words =
        text.split(/\s+/);

    const result = [];


    for (
        const word of words
    ) {

        const clean =
            word
                .toLowerCase()
                .replace(
                    /[.,!?;:"'()[\]{}-]/g,
                    ""
                );


        const previous =
            result.length
                ? result[
                    result.length - 1
                ]
                    .toLowerCase()
                    .replace(
                        /[.,!?;:"'()[\]{}-]/g,
                        ""
                    )
                : "";


        if (
            clean &&
            clean === previous
        ) {

            continue;
        }


        result.push(word);
    }


    return result.join(" ");
}


/* =========================================================
   SPOKEN PUNCTUATION
   ========================================================= */

function convertSpokenPunctuation(text) {

    let t = text;


    const replacements = [

        [
            /\bnew paragraph\b/gi,
            "\n\n"
        ],

        [
            /\bnew line\b/gi,
            "\n"
        ],

        [
            /\bquestion mark\b/gi,
            "?"
        ],

        [
            /\bexclamation mark\b/gi,
            "!"
        ],

        [
            /\bexclamation point\b/gi,
            "!"
        ],

        [
            /\bcomma\b/gi,
            ","
        ],

        [
            /\bfull stop\b/gi,
            "."
        ],

        [
            /\bperiod\b/gi,
            "."
        ],

        [
            /\bcolon\b/gi,
            ":"
        ],

        [
            /\bsemicolon\b/gi,
            ";"
        ]
    ];


    for (
        const [
            pattern,
            replacement
        ]
        of replacements
    ) {

        t =
            t.replace(
                pattern,
                replacement
            );
    }


    return t;
}


/* =========================================================
   NUMBER CONVERSION
   ========================================================= */

const numberUnits = {

    zero: 0,
    one: 1,
    two: 2,
    three: 3,
    four: 4,
    five: 5,
    six: 6,
    seven: 7,
    eight: 8,
    nine: 9,
    ten: 10,
    eleven: 11,
    twelve: 12,
    thirteen: 13,
    fourteen: 14,
    fifteen: 15,
    sixteen: 16,
    seventeen: 17,
    eighteen: 18,
    nineteen: 19

};


const numberTens = {

    twenty: 20,
    thirty: 30,
    forty: 40,
    fifty: 50,
    sixty: 60,
    seventy: 70,
    eighty: 80,
    ninety: 90

};


function wordsToNumber(words) {

    let total = 0;

    let current = 0;

    let found = false;


    for (
        const word of words
    ) {

        if (
            numberUnits[word]
            !== undefined
        ) {

            current +=
                numberUnits[word];

            found = true;

        }

        else if (
            numberTens[word]
            !== undefined
        ) {

            current +=
                numberTens[word];

            found = true;

        }

        else if (
            word === "hundred"
        ) {

            if (
                current === 0
            ) {

                current = 1;
            }

            current *= 100;

            found = true;

        }

        else {

            return null;
        }
    }


    return found
        ? total + current
        : null;
}


function convertNumbers(text) {

    const tokens =
        text.split(/\s+/);

    const result = [];

    let i = 0;


    while (
        i < tokens.length
    ) {

        let value = null;

        let lengthFound = 0;


        const maximum =
            Math.min(
                6,
                tokens.length - i
            );


        for (
            let length = maximum;
            length >= 1;
            length--
        ) {

            const candidate =
                tokens
                    .slice(
                        i,
                        i + length
                    )
                    .map(
                        function (word) {

                            return word
                                .toLowerCase()
                                .replace(
                                    /[^a-z]/g,
                                    ""
                                );
                        }
                    );


            const number =
                wordsToNumber(
                    candidate
                );


            if (
                number !== null
            ) {

                value = number;

                lengthFound =
                    length;

                break;
            }
        }


        if (
            lengthFound > 0
        ) {

            result.push(
                String(value)
            );

            i += lengthFound;

        }

        else {

            result.push(
                tokens[i]
            );

            i++;
        }
    }


    return result.join(" ");
}


/* =========================================================
   SPELLING
   ========================================================= */

function spellWord(word) {

    const clean =
        word
            .replace(
                /[^A-Za-z]/g,
                ""
            )
            .toUpperCase();


    if (!clean) {

        return "";
    }


    return clean
        .split("")
        .join("-");
}


function processSpelling(text) {

    const cleaned =
        text
            .trim()
            .replace(
                /[.!?]+$/g,
                ""
            )
            .trim();


    const direct =
        cleaned.match(
            /^(?:please\s+)?spell(?:\s+the\s+word)?\s+([A-Za-z]+)$/i
        );


    if (direct) {

        spellingMode = false;

        waitingForSpellingWord = false;

        return spellWord(
            direct[1]
        );
    }


    if (
        /^(?:please\s+)?spell$/i
            .test(cleaned)
    ) {

        spellingMode = true;

        waitingForSpellingWord = true;

        return "";
    }


    if (
        spellingMode &&
        waitingForSpellingWord
    ) {

        if (
            /^[A-Za-z]+$/.test(
                cleaned
            )
        ) {

            spellingMode = false;

            waitingForSpellingWord =
                false;

            return spellWord(
                cleaned
            );
        }


        spellingMode = false;

        waitingForSpellingWord =
            false;
    }


    return null;
}


/* =========================================================
   PROCESS SPEECH
   ========================================================= */

function processSpeech(text) {

    let t = text.trim();


    t =
        removeFillers(t);


    t =
        removeImmediateRepeats(t);


    t =
        convertSpokenPunctuation(t);


    t =
        convertNumbers(t);


    t =
        t
            .replace(
                /\s+([,.!?;:)\]}])/g,
                "$1"
            )
            .replace(
                /([(\[])\s+/g,
                "$1"
            )
            .replace(
                /\s{2,}/g,
                " "
            )
            .trim();


    return t;
}


/* =========================================================
   CAPTION DISPLAY
   =========================================================

   IMPORTANT:

   This function NEVER allows the caption to become
   a giant paragraph.

   It keeps only the newest portion of the speech.
   ========================================================= */

function displayCaption(text, interim = false) {

    if (!text || !text.trim()) {

        hideCaption();

        return;
    }


    let display =
        text.trim();


    /*
       Maximum two visual lines.

       CSS line-clamp is used as a safety net.
    */

    captionText.textContent =
        display;


    captionText.classList.toggle(
        "interim",
        interim
    );


    showCaption();


    /*
       Dynamically reduce the font if the
       caption becomes too wide/tall.

       Start at the selected size.
    */

    fitCaption();
}


/* =========================================================
   FIT CAPTION
   ========================================================= */

function fitCaption() {

    if (
        !captionText.textContent.trim()
    ) {

        return;
    }


    let size =
        Number(
            sizeSelect.value
        );


    captionText.style.fontSize =
        size + "px";


    /*
       Maximum two lines.

       Reduce size until the text fits.
    */

    while (
        (
            captionText.scrollHeight >
            captionText.clientHeight
        )
        &&
        size > 32
    ) {

        size -= 2;


        captionText.style.fontSize =
            size + "px";
    }
}


/* =========================================================
   FINAL CAPTION
   ========================================================= */

function showFinalSpeech(text) {

    if (!text.trim()) {

        return;
    }


    /*
       Check spelling first.
    */

    const spelling =
        processSpelling(text);


    if (
        spelling !== null
    ) {

        if (
            spelling
        ) {

            captionText.classList.add(
                "spelling"
            );

            displayCaption(
                spelling,
                false
            );

        }

        return;
    }


    /*
       Normal speech.
    */

    const processed =
        processSpeech(text);


    if (
        !processed
    ) {

        return;
    }


    captionText.classList.remove(
        "spelling"
    );


    /*
       IMPORTANT:

       We replace the old caption.

       We DO NOT append it.

       This is what prevents the entire
       screen from filling with transcript.
    */

    finalSentence =
        processed;


    interimSentence =
        "";


    displayCaption(
        finalSentence,
        false
    );
}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

function createRecognition() {

    if (!SpeechRecognition) {

        startBtn.disabled = true;

        stopBtn.disabled = true;

        setStatus(
            "Use Google Chrome for speech recognition."
        );

        return null;
    }


    const r =
        new SpeechRecognition();


    r.continuous = true;

    r.interimResults = true;

    r.maxAlternatives = 1;

    r.lang =
        languageSelect.value;


    /* =====================================================
       START
       ===================================================== */

    r.onstart =
        function () {

            listening = true;

            restarting = false;

            startBtn.disabled =
                true;

            stopBtn.disabled =
                false;

            setStatus(
                "Listening..."
            );
        };


    /* =====================================================
       RESULT
       ===================================================== */

    r.onresult =
        function (event) {

            cancelSilenceTimer();


            let finalText = "";

            let interimText = "";


            for (
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ) {

                const result =
                    event.results[i];


                const transcript =
                    result[0]
                        .transcript
                        .trim();


                if (
                    !transcript
                ) {

                    continue;
                }


                if (
                    result.isFinal
                ) {

                    finalText +=
                        " " +
                        transcript;

                }

                else {

                    interimText +=
                        " " +
                        transcript;
                }
            }


            /*
               FINAL SPEECH

               Replace the caption with
               the latest sentence.
            */

            if (
                finalText.trim()
            ) {

                showFinalSpeech(
                    finalText.trim()
                );

                startSilenceTimer();
            }


            /*
               INTERIM SPEECH

               Display only the current
               speech fragment.

               It does NOT accumulate.
            */

            if (
                interimText.trim() &&
                !waitingForSpellingWord
            ) {

                interimSentence =
                    processSpeech(
                        interimText.trim()
                    );


                displayCaption(
                    interimSentence,
                    true
                );
            }
        };


    /* =====================================================
       ERROR
       ===================================================== */

    r.onerror =
        function (event) {

            if (
                event.error ===
                    "not-allowed" ||
                event.error ===
                    "service-not-allowed"
            ) {

                listening = false;

                manuallyStopped =
                    true;

                startBtn.disabled =
                    false;

                stopBtn.disabled =
                    true;

                setStatus(
                    "Microphone permission denied."
                );

                return;
            }


            if (
                event.error ===
                "audio-capture"
            ) {

                setStatus(
                    "Microphone not available."
                );

                return;
            }


            if (
                event.error ===
                "network"
            ) {

                setStatus(
                    "Speech recognition network error."
                );

                return;
            }


            if (
                event.error ===
                "no-speech"
            ) {

                return;
            }


            if (
                event.error ===
                "aborted"
            ) {

                return;
            }


            setStatus(
                "Speech error: " +
                event.error
            );
        };


    /* =====================================================
       END
       ===================================================== */

    r.onend =
        function () {

            restarting = false;


            if (
                listening &&
                !manuallyStopped
            ) {

                restartRecognition();

                return;
            }


            listening = false;

            startBtn.disabled =
                false;

            stopBtn.disabled =
                true;

            setStatus(
                "Stopped"
            );
        };


    return r;
}


/* =========================================================
   RESTART
   ========================================================= */

function restartRecognition() {

    if (
        !recognition ||
        !listening ||
        manuallyStopped ||
        restarting
    ) {

        return;
    }


    restarting = true;


    setTimeout(
        function () {

            if (
                !listening ||
                manuallyStopped
            ) {

                restarting = false;

                return;
            }


            try {

                recognition.lang =
                    languageSelect.value;

                recognition.start();

            }

            catch (error) {

                restarting = false;

                setTimeout(
                    restartRecognition,
                    500
                );
            }

        },
        350
    );
}


/* =========================================================
   CREATE RECOGNITION
   ========================================================= */

recognition =
    createRecognition();


/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener(
    "click",
    function () {

        if (
            !recognition
        ) {

            setStatus(
                "Speech recognition unavailable."
            );

            return;
        }


        if (
            listening
        ) {

            return;
        }


        manuallyStopped =
            false;

        restarting =
            false;


        clearCaption();


        recognition.lang =
            languageSelect.value;


        try {

            recognition.start();

        }

        catch (error) {

            setStatus(
                "Could not start microphone."
            );
        }
    }
);


/* =========================================================
   STOP
   ========================================================= */

stopBtn.addEventListener(
    "click",
    function () {

        manuallyStopped =
            true;

        listening =
            false;

        restarting =
            false;


        cancelSilenceTimer();


        interimSentence =
            "";


        if (
            recognition
        ) {

            try {

                recognition.stop();

            }

            catch (error) {}
        }


        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;


        setStatus(
            "Stopped"
        );
    }
);


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
    "click",
    function () {

        clearCaption();


        setStatus(
            listening
                ? "Listening..."
                : "Ready"
        );
    }
);


/* =========================================================
   FONT SIZE
   ========================================================= */

sizeSelect.addEventListener(
    "change",
    function () {

        fitCaption();
    }
);


/* =========================================================
   LANGUAGE
   ========================================================= */

languageSelect.addEventListener(
    "change",
    function () {

        if (
            !recognition
        ) {

            return;
        }


        const wasListening =
            listening;


        if (
            wasListening
        ) {

            manuallyStopped =
                true;

            listening =
                false;


            try {

                recognition.stop();

            }

            catch (error) {}
        }


        recognition.lang =
            languageSelect.value;


        if (
            wasListening
        ) {

            setTimeout(
                function () {

                    manuallyStopped =
                        false;

                    listening =
                        false;

                    try {

                        recognition.start();

                    }

                    catch (error) {

                        restartRecognition();
                    }

                },
                500
            );
        }
    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function () {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();
            }

        }

        catch (error) {

            setStatus(
                "Full screen unavailable."
            );
        }
    }
);


/* =========================================================
   FULLSCREEN CHANGE
   ========================================================= */

document.addEventListener(
    "fullscreenchange",
    function () {

        fitCaption();
    }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function () {

        fitCaption();
    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

captionText.style.fontSize =
    sizeSelect.value + "px";


hideCaption();


if (
    SpeechRecognition
) {

    setStatus(
        "Ready"
    );

}

else {

    setStatus(
        "Use Google Chrome for speech recognition."
    );
}
