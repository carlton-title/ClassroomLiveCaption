<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Classroom Live Transcription</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ============================================================
   CAPTION
   ============================================================ */

#caption {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 90vw;

    max-width: 1500px;

    max-height: 4em;

    overflow: hidden;

    text-align: center;

    color: white;

    font-size: 96px;

    font-weight: 600;

    line-height: 1.15;

    overflow-wrap: break-word;

    word-break: normal;

    opacity: 0;

    transition:
        opacity 0.1s ease;

    pointer-events: none;

    user-select: none;

}


#caption.visible {

    opacity: 1;

}


/* ============================================================
   TEACHER MENU
   ============================================================ */

#teacherMenu {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    background:
        rgba(25, 25, 25, 0.96);

    z-index: 1000;

}


#teacherMenu label {

    color: white;

    font-size: 14px;

    font-weight: 600;

}


#teacherMenu select,
#teacherMenu button {

    height: 32px;

    border: 1px solid #666;

    border-radius: 5px;

    background: #222;

    color: white;

    padding: 0 10px;

    font-size: 14px;

    cursor: pointer;

}


#teacherMenu button:hover,
#teacherMenu select:hover {

    background: #333;

}


:fullscreen #teacherMenu {

    display: none;

}


:-webkit-full-screen #teacherMenu {

    display: none;

}

</style>

</head>


<body>


<div id="teacherMenu">

    <label for="fontSize">
        Font
    </label>

    <select id="fontSize">

        <option value="48">
            48 px
        </option>

        <option value="64">
            64 px
        </option>

        <option value="80">
            80 px
        </option>

        <option value="96" selected>
            96 px
        </option>

        <option value="120">
            120 px
        </option>

        <option value="144">
            144 px
        </option>

    </select>


    <label for="language">
        Language
    </label>

    <select id="language">

        <option value="en">
            English
        </option>

        <option value="th" selected>
            Thai
        </option>

    </select>


    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>


<div id="caption"></div>


<script>


/* ============================================================
   ELEMENTS
   ============================================================ */

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ============================================================
   SETTINGS
   ============================================================ */

const CLEAR_DELAY = 2000;


/*
 * This is your WORKING Cloudflare Worker.
 * DO NOT CHANGE IT.
 */

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";


/*
 * How frequently we allow a new translation.
 *
 * 350 ms gives a much more real-time feeling
 * without sending a request for every single
 * recognition event.
 */

const TRANSLATION_DELAY = 350;


let clearTimer = null;

let recognition = null;

let restarting = false;

let currentLanguage = "th";


/*
 * Used to prevent an older translation from
 * overwriting newer speech.
 */

let translationNumber = 0;


/*
 * Prevents multiple translation timers
 * from running simultaneously.
 */

let translationTimer = null;


/*
 * The newest English speech recognized
 * by Chrome.
 */

let latestSpeech = "";


/* ============================================================
   FONT SIZE
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;


        translationNumber++;


        clearTimeout(
            translationTimer
        );


        latestSpeech = "";


        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   SHOW CAPTION
   ============================================================ */

function showCaption(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return;

    }


    clearTimeout(
        clearTimer
    );


    caption.textContent =
        text.trim();


    caption.classList.add(
        "visible"
    );

}


/* ============================================================
   CLEAR CAPTION
   ============================================================ */

function clearCaption() {

    clearTimeout(
        clearTimer
    );

    caption.textContent =
        "";

    caption.classList.remove(
        "visible"
    );

}


/* ============================================================
   CLEAN TEXT
   ============================================================ */

function cleanText(text) {

    return text

        .replace(
            /\s+([,.!?;:])/g,
            "$1"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* ============================================================
   TRANSLATE ENGLISH → THAI
   ============================================================ */

async function translateToThai(
    text,
    requestNumber
) {

    try {

        const url =
            TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Thai:",
            data.translation
        );


        /*
         * Ignore the result if newer speech
         * has already been recognized.
         */

        if (
            requestNumber !==
            translationNumber
        ) {

            return;

        }


        if (
            currentLanguage !== "th"
        ) {

            return;

        }


        if (
            data.translation
        ) {

            showCaption(
                data.translation
            );

        }

    }

    catch (error) {

        console.error(
            "Thai translation error:",
            error
        );

    }

}


/* ============================================================
   SCHEDULE THAI TRANSLATION
   ============================================================ */

function scheduleThaiTranslation() {

    clearTimeout(
        translationTimer
    );


    translationTimer =
        setTimeout(
            async function () {

                const text =
                    latestSpeech;


                if (
                    !text ||
                    currentLanguage !== "th"
                ) {

                    return;

                }


                const requestNumber =
                    ++translationNumber;


                await translateToThai(
                    text,
                    requestNumber
                );

            },
            TRANSLATION_DELAY
        );

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (
    !SpeechRecognition
) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

}

else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        /*
         * IMPORTANT:
         *
         * TRUE means Chrome gives us
         * unfinished/interim speech.
         *
         * This is what makes the system
         * much closer to real time.
         */

        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        /*
         * You speak English.
         *
         * Therefore Chrome must listen
         * for English.
         */

        recognition.lang =
            "en-US";


        /* ====================================================
           SPEECH RESULT
           ==================================================== */

        recognition.onresult =
            function(event) {


                let interimText =
                    "";

                let finalText =
                    "";


                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {


                    const result =
                        event.results[i];


                    const transcript =
                        result[0].transcript;


                    if (
                        result.isFinal
                    ) {

                        finalText +=
                            transcript;

                    }

                    else {

                        interimText +=
                            transcript;

                    }

                }


                /* =================================================
                   ENGLISH MODE
                   ================================================= */

                if (
                    currentLanguage === "en"
                ) {


                    const english =
                        cleanText(
                            interimText ||
                            finalText
                        );


                    if (
                        english
                    ) {

                        showCaption(
                            english
                        );

                    }


                    return;

                }


                /* =================================================
                   THAI MODE
                   ================================================= */

                if (
                    currentLanguage === "th"
                ) {


                    /*
                     * Combine the latest recognized
                     * speech.
                     *
                     * Chrome's interim result is
                     * normally the newest unfinished
                     * portion.
                     */

                    const speech =
                        cleanText(
                            interimText ||
                            finalText
                        );


                    if (
                        !speech
                    ) {

                        return;

                    }


                    /*
                     * Save the newest speech.
                     */

                    latestSpeech =
                        speech;


                    /*
                     * Do NOT display English.
                     *
                     * Instead, schedule Thai
                     * translation immediately.
                     */

                    scheduleThaiTranslation();

                }

            };


        /* ====================================================
           SPEECH START
           ==================================================== */

        recognition.onspeechstart =
            function () {

                clearTimeout(
                    clearTimer
                );

            };


        /* ====================================================
           SPEECH END
           ==================================================== */

        recognition.onspeechend =
            function () {

                /*
                 * Give the final phrase one last
                 * translation attempt.
                 */

                if (
                    currentLanguage === "th" &&
                    latestSpeech
                ) {

                    scheduleThaiTranslation();

                }


                clearTimeout(
                    clearTimer
                );


                clearTimer =
                    setTimeout(
                        function () {

                            clearCaption();

                        },
                        CLEAR_DELAY
                    );

            };


        /* ====================================================
           RECOGNITION END
           ==================================================== */

        recognition.onend =
            function () {

                if (
                    !restarting
                ) {

                    restarting =
                        true;


                    setTimeout(
                        function () {

                            restarting =
                                false;


                            try {

                                startRecognition();

                            }

                            catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ====================================================
           ERRORS
           ==================================================== */

        recognition.onerror =
            function (event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ====================================================
           START
           ==================================================== */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition restarting..."
            );

        }

    }


    /* ============================================================
       START WHEN PAGE LOADS
       ============================================================ */

    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>

</html>
