<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Captions</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font: inherit;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #252525;
  color: #fff;
  cursor: pointer;
}

button:hover,
select:hover {
  background: #333;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

#status {
  color: #bbb;
  font-size: 14px;
  margin-left: auto;
}

#captionArea {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5vh 6vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1800px;

  text-align: center;

  font-size: 72px;
  line-height: 1.18;
  font-weight: 800;

  overflow: hidden;
}

#captionText {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;

  overflow: hidden;

  word-break: normal;
  overflow-wrap: anywhere;

  transition: opacity 0.25s ease;
}

#captionText.interim {
  opacity: 0.7;
}

#controls.hidden {
  display: none;
}

.error {
  color: #ff8a8a !important;
}
</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">
    ▶ Start Listening
  </button>

  <button id="stopBtn" disabled>
    ■ Stop
  </button>

  <button id="clearBtn">
    Clear
  </button>

  <button id="fullscreenBtn">
    ⛶ Full Screen
  </button>

  <label>
    Size

    <select id="sizeSelect">
      <option value="48">48</option>
      <option value="60">60</option>
      <option value="72" selected>72</option>
      <option value="90">90</option>
      <option value="110">110</option>
      <option value="140">140</option>
      <option value="170">170</option>
    </select>

    px
  </label>

  <span id="status">
    Ready
  </span>

</div>


<main id="captionArea">

  <div id="caption">
    <div id="captionText"></div>
  </div>

</main>


<script>

(() => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  const captionText =
    document.getElementById("captionText");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const fullscreenBtn =
    document.getElementById("fullscreenBtn");

  const sizeSelect =
    document.getElementById("sizeSelect");

  const status =
    document.getElementById("status");


  let recognition = null;

  let listening = false;


  /*
    This is the important part.

    We keep only a small rolling
    collection of words.

    The app NEVER builds a
    permanent transcript.
  */

  let rollingWords = [];


  /*
    Approximately how many words
    we allow in the rolling window.

    CSS limits the actual display
    to two lines.

    This gives the words enough
    context to be understandable.
  */

  const MAX_WORDS = 18;


  function setStatus(text, error = false) {

    status.textContent = text;

    status.className =
      error ? "error" : "";

  }


  function escapeHtml(text) {

    return text.replace(
      /[&<>"']/g,

      c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c])

    );

  }


  /*
    Display only the newest words.
  */

  function render(words, interim = false) {

    let allWords =
      [...rollingWords, ...words];


    /*
      Keep only the newest words.
    */

    if (allWords.length > MAX_WORDS) {

      allWords =
        allWords.slice(
          -MAX_WORDS
        );

    }


    captionText.textContent =
      allWords.join(" ");


    captionText.classList.toggle(
      "interim",
      interim
    );

  }


  /*
    Add finalized speech to
    the rolling window.
  */

  function addFinalSpeech(text) {

    const words =
      text
        .trim()
        .split(/\s+/)
        .filter(Boolean);


    if (!words.length) {
      return;
    }


    rollingWords =
      [
        ...rollingWords,
        ...words
      ];


    /*
      Immediately remove old words.
    */

    if (
      rollingWords.length >
      MAX_WORDS
    ) {

      rollingWords =
        rollingWords.slice(
          -MAX_WORDS
        );

    }


    render([]);

  }


  /*
    Clear captions.
  */

  clearBtn.addEventListener(
    "click",
    () => {

      rollingWords = [];

      captionText.textContent = "";

      captionText.classList.remove(
        "interim"
      );

      setStatus(
        listening
          ? "Listening…"
          : "Ready"
      );

    }
  );


  /*
    Font size.
  */

  sizeSelect.addEventListener(
    "change",
    () => {

      captionText.parentElement.style.fontSize =
        sizeSelect.value + "px";

    }
  );


  /*
    Full screen.
  */

  fullscreenBtn.addEventListener(
    "click",
    async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement
            .requestFullscreen();


          document
            .getElementById("controls")
            .classList
            .add("hidden");

        }

        else {

          await document.exitFullscreen();

        }

      }

      catch (error) {

        setStatus(
          "Full screen unavailable",
          true
        );

      }

    }
  );


  document.addEventListener(
    "fullscreenchange",
    () => {

      if (!document.fullscreenElement) {

        document
          .getElementById("controls")
          .classList
          .remove("hidden");

      }

    }
  );


  /*
    Check browser support.
  */

  if (!SpeechRecognition) {

    setStatus(
      "Use Chrome or Edge for speech recognition",
      true
    );

    startBtn.disabled = true;

    return;

  }


  /*
    Speech recognition setup.
  */

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  /*
    Started.
  */

  recognition.onstart =
    () => {

      listening = true;

      startBtn.disabled = true;

      stopBtn.disabled = false;

      setStatus(
        "Listening…"
      );

    };


  /*
    New speech.
  */

  recognition.onresult =
    (event) => {

      let interimWords = [];


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          addFinalSpeech(text);

        }

        else {

          interimWords =
            text
              .split(/\s+/)
              .filter(Boolean);

        }

      }


      /*
        Show currently spoken words
        immediately, without permanently
        adding them until Chrome finalizes
        the speech.
      */

      render(
        interimWords,
        interimWords.length > 0
      );

    };


  /*
    Errors.
  */

  recognition.onerror =
    (event) => {

      if (
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ) {

        listening = false;

        startBtn.disabled = false;

        stopBtn.disabled = true;


        setStatus(
          "Microphone permission denied",
          true
        );

      }

      else {

        setStatus(
          "Recognition: " +
          event.error,
          true
        );

      }

    };


  /*
    Chrome sometimes ends recognition.

    Restart automatically while
    the teacher is still listening.
  */

  recognition.onend =
    () => {

      if (listening) {

        try {

          recognition.start();

        }

        catch (error) {}

      }

      else {

        startBtn.disabled =
          false;

        stopBtn.disabled =
          true;

        setStatus(
          "Stopped"
        );

      }

    };


  /*
    Start.
  */

  startBtn.addEventListener(
    "click",
    () => {

      if (!listening) {

        try {

          recognition.start();

        }

        catch (error) {

          setStatus(
            "Could not start listening",
            true
          );

        }

      }

    }
  );


  /*
    Stop.
  */

  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      recognition.stop();

      captionText.classList.remove(
        "interim"
      );

      setStatus(
        "Stopped"
      );

    }
  );


  /*
    Initial size.
  */

  captionText.parentElement.style.fontSize =
    sizeSelect.value + "px";

})();

</script>

</body>
</html>
