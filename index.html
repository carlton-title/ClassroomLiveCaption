<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Live Captions</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font: inherit;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #252525;
  color: #fff;
  cursor: pointer;
}

button:hover,
select:hover {
  background: #333;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

#status {
  color: #bbb;
  font-size: 14px;
  margin-left: auto;
}

#captionArea {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 5vh 6vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1800px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  font-size: 72px;
  line-height: 1.18;
  font-weight: 800;
  letter-spacing: 0.01em;

  overflow-wrap: anywhere;
}

.line {
  margin: 0.12em 0;
  transition: opacity 0.5s ease;
}

.current {
  opacity: 1;
}

.previous {
  opacity: 0.55;
}

.interim {
  opacity: 0.65;
}

#caption:empty::before {
  content: "Press Start Listening";
  color: #777;
}

#controls.hidden {
  display: none;
}

.error {
  color: #ff8a8a !important;
}

</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">
    ▶ Start Listening
  </button>

  <button id="stopBtn" disabled>
    ■ Stop
  </button>

  <button id="clearBtn">
    Clear
  </button>

  <button id="fullscreenBtn">
    ⛶ Full Screen
  </button>

  <label>
    Size

    <select id="sizeSelect">
      <option value="48">48</option>
      <option value="60">60</option>
      <option value="72" selected>72</option>
      <option value="90">90</option>
      <option value="110">110</option>
      <option value="140">140</option>
      <option value="170">170</option>
    </select>

    px
  </label>

  <span id="status">
    Ready
  </span>

</div>


<main id="captionArea">

  <div id="caption" aria-live="polite"></div>

</main>


<script>

(() => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  const caption =
    document.getElementById("caption");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const fullscreenBtn =
    document.getElementById("fullscreenBtn");

  const sizeSelect =
    document.getElementById("sizeSelect");

  const status =
    document.getElementById("status");


  let recognition = null;

  let listening = false;

  let currentText = "";

  let previousText = "";

  let currentTimer = null;

  let previousTimer = null;


  /*
    HOW LONG CAPTIONS REMAIN VISIBLE

    Current sentence:
    about 5.2 seconds.

    Previous sentence:
    about 2.5 additional seconds.

    This gives students time to read
    without allowing the screen to
    become a transcript.
  */

  const CURRENT_HOLD = 5200;

  const PREVIOUS_HOLD = 2500;


  function setStatus(text, error = false) {

    status.textContent = text;

    status.className =
      error ? "error" : "";

  }


  function escapeHtml(text) {

    return text.replace(
      /[&<>"']/g,

      c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c])

    );

  }


  /*
    Draw the screen.

    There can NEVER be a long transcript here.

    At most:

    Previous phrase
    Current phrase
    Currently spoken words
  */

  function render(interimText = "") {

    caption.innerHTML = "";


    if (previousText) {

      const previous =
        document.createElement("div");

      previous.className =
        "line previous";

      previous.innerHTML =
        escapeHtml(previousText);

      caption.appendChild(previous);

    }


    if (currentText || interimText) {

      const current =
        document.createElement("div");

      current.className =
        "line current";


      current.innerHTML =
        escapeHtml(
          currentText +
          (
            interimText
              ? (currentText ? " " : "") +
                interimText
              : ""
          )
        );


      caption.appendChild(current);

    }

  }


  /*
    Display a newly completed phrase.
  */

  function showFinal(text) {

    text = text.trim();


    if (!text) {
      return;
    }


    if (currentTimer) {
      clearTimeout(currentTimer);
    }


    if (previousTimer) {
      clearTimeout(previousTimer);
    }


    /*
      Move the old current phrase
      into the previous position.
    */

    previousText =
      currentText;


    currentText =
      text;


    render();


    /*
      After about 5 seconds,
      remove the current phrase.
    */

    currentTimer =
      setTimeout(() => {

        if (currentText === text) {

          previousText =
            currentText;

          currentText =
            "";

          render();


          /*
            Give the previous phrase
            a little extra reading time.
          */

          previousTimer =
            setTimeout(() => {

              if (
                currentText === "" &&
                previousText === text
              ) {

                previousText =
                  "";

                render();

              }

            }, PREVIOUS_HOLD);

        }

      }, CURRENT_HOLD);

  }


  /*
    Font-size control
  */

  sizeSelect.addEventListener(
    "change",
    () => {

      caption.style.fontSize =
        sizeSelect.value + "px";

    }
  );


  /*
    Clear everything
  */

  clearBtn.addEventListener(
    "click",
    () => {

      currentText = "";

      previousText = "";


      if (currentTimer) {
        clearTimeout(currentTimer);
      }


      if (previousTimer) {
        clearTimeout(previousTimer);
      }


      render();


      setStatus(
        listening
          ? "Listening…"
          : "Ready"
      );

    }
  );


  /*
    Full screen
  */

  fullscreenBtn.addEventListener(
    "click",
    async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement
            .requestFullscreen();


          document
            .getElementById("controls")
            .classList
            .add("hidden");

        }

        else {

          await document.exitFullscreen();

        }

      }

      catch (e) {

        setStatus(
          "Full screen unavailable",
          true
        );

      }

    }
  );


  document.addEventListener(
    "fullscreenchange",
    () => {

      if (!document.fullscreenElement) {

        document
          .getElementById("controls")
          .classList
          .remove("hidden");

      }

    }
  );


  /*
    Browser compatibility
  */

  if (!SpeechRecognition) {

    setStatus(
      "Use Chrome or Edge for speech recognition",
      true
    );

    startBtn.disabled = true;

    return;

  }


  /*
    Speech recognition
  */

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;

      startBtn.disabled = true;

      stopBtn.disabled = false;

      setStatus(
        "Listening…"
      );

    };


  /*
    Speech detected
  */

  recognition.onresult =
    (event) => {

      let interim = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          showFinal(text);

        }

        else {

          interim +=
            (
              interim
                ? " "
                : ""
            ) +
            text;

        }

      }


      /*
        Words currently being spoken
        appear immediately.
      */

      render(interim);

    };


  /*
    Errors
  */

  recognition.onerror =
    (event) => {

      if (
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ) {

        listening = false;

        startBtn.disabled = false;

        stopBtn.disabled = true;


        setStatus(
          "Microphone permission denied",
          true
        );

      }

      else {

        setStatus(
          "Recognition: " +
          event.error,
          true
        );

      }

    };


  /*
    Automatically restart recognition
    if Chrome stops the recognition service.
  */

  recognition.onend =
    () => {

      if (listening) {

        try {

          recognition.start();

        }

        catch (e) {}

      }

      else {

        startBtn.disabled =
          false;

        stopBtn.disabled =
          true;

        setStatus(
          "Stopped"
        );

      }

    };


  /*
    Start
  */

  startBtn.addEventListener(
    "click",
    () => {

      if (!listening) {

        try {

          recognition.start();

        }

        catch (e) {

          setStatus(
            "Could not start listening",
            true
          );

        }

      }

    }
  );


  /*
    Stop
  */

  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      if (recognition) {
        recognition.stop();
      }

      render();

    }
  );


  /*
    Initial font size
  */

  caption.style.fontSize =
    sizeSelect.value + "px";

})();

</script>

</body>
</html>
