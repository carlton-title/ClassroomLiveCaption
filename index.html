<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Transcription</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.15;
    opacity: 0;
    transition: none;
    overflow-wrap: break-word;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25,25,25,.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

:fullscreen #teacherMenu {
    display: none;
}

</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en">English</option>
        <option value="th" selected>Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";

const DISPLAY_TIME = 500;

let currentLanguage = "th";

let recognition = null;

let restarting = false;

let displayTimer = null;

let translationController = null;

let translationID = 0;


/* ============================================================
   FONT
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        translationID++;

        if (translationController) {
            translationController.abort();
        }

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(error);

        }

    }
);


/* ============================================================
   DISPLAY ONE SPEECH UNIT
   ============================================================ */

function showSpeechUnit(text) {

    if (!text || !text.trim()) {
        return;
    }

    clearTimeout(displayTimer);

    /*
     * Remove the previous speech unit.
     */
    caption.textContent = "";

    caption.classList.remove("visible");

    /*
     * Display the new speech unit ONCE.
     * No animation.
     * No requestAnimationFrame.
     * No blinking.
     */
    caption.textContent = text.trim();

    caption.classList.add("visible");

    /*
     * Remove this speech unit automatically.
     */
    displayTimer =
        setTimeout(
            clearCaption,
            DISPLAY_TIME
        );
}


/* ============================================================
   CLEAR
   ============================================================ */

function clearCaption() {

    clearTimeout(displayTimer);

    caption.textContent = "";

    caption.classList.remove("visible");

}


/* ============================================================
   CLEAN
   ============================================================ */

function cleanText(text) {

    return text
        .replace(/\s+/g, " ")
        .replace(
            /\s+([,.!?;:])/g,
            "$1"
        )
        .trim();

}


/* ============================================================
   BREAK LONG FINAL RESULT INTO SMALL UNITS
   ============================================================ */

function splitSpeechUnit(text) {

    text = cleanText(text);

    if (!text) {
        return [];
    }

    const sentences =
        text.match(
            /[^.!?]+[.!?]?/g
        ) || [text];

    const units = [];

    for (const sentence of sentences) {

        const words =
            cleanText(sentence)
                .split(/\s+/)
                .filter(Boolean);

        if (words.length <= 4) {

            units.push(
                words.join(" ")
            );

            continue;
        }

        for (
            let i = 0;
            i < words.length;
            i += 4
        ) {

            units.push(
                words
                    .slice(i, i + 4)
                    .join(" ")
            );

        }

    }

    return units;
}


/* ============================================================
   TRANSLATE ENGLISH → THAI
   ============================================================ */

async function translateToThai(text) {

    if (!text) {
        return null;
    }

    if (translationController) {
        translationController.abort();
    }

    translationController =
        new AbortController();

    const controller =
        translationController;

    const requestID =
        ++translationID;

    try {

        const url =
            TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);

        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    signal: controller.signal
                }
            );

        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if (
            requestID !== translationID ||
            currentLanguage !== "th"
        ) {

            return null;
        }

        return (
            data.translation ||
            data.translatedText ||
            null
        );

    }

    catch (error) {

        if (
            error.name !== "AbortError"
        ) {

            console.error(
                "Translation error:",
                error
            );

        }

        return null;
    }
}


/* ============================================================
   PROCESS ONE FINAL SPEECH UNIT
   ============================================================ */

async function processSpeechUnit(text) {

    text = cleanText(text);

    if (!text) {
        return;
    }

    /*
     * ENGLISH
     */

    if (
        currentLanguage === "en"
    ) {

        showSpeechUnit(text);

        return;
    }


    /*
     * THAI
     */

    if (
        currentLanguage === "th"
    ) {

        const thai =
            await translateToThai(text);

        if (
            thai &&
            currentLanguage === "th"
        ) {

            showSpeechUnit(thai);

        }

    }

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

} else {

    function startRecognition() {

        recognition =
            new SpeechRecognition();

        recognition.continuous =
            true;

        /*
         * Interim recognition is enabled,
         * but interim text is NEVER displayed.
         */
        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;

        /*
         * Teacher speaks English.
         */
        recognition.lang =
            "en-US";


        /* ====================================================
           FINAL SPEECH RESULT
           ==================================================== */

        recognition.onresult =
            async function(event) {

                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    const result =
                        event.results[i];

                    /*
                     * Ignore interim results.
                     *
                     * This prevents the same words
                     * from blinking repeatedly.
                     */

                    if (
                        !result.isFinal
                    ) {

                        continue;
                    }

                    const transcript =
                        cleanText(
                            result[0].transcript
                        );

                    if (!transcript) {
                        continue;
                    }


                    /*
                     * Divide the finalized speech
                     * into independent display units.
                     */

                    const units =
                        splitSpeechUnit(
                            transcript
                        );


                    for (
                        const unit of units
                    ) {

                        /*
                         * Immediately remove whatever
                         * was previously displayed.
                         */

                        clearCaption();

                        /*
                         * Display only this unit.
                         */

                        await processSpeechUnit(
                            unit
                        );

                    }

                }

            };


        /* ====================================================
           ERROR
           ==================================================== */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ====================================================
           RESTART
           ==================================================== */

        recognition.onend =
            function() {

                if (!restarting) {

                    restarting =
                        true;

                    setTimeout(
                        function() {

                            restarting =
                                false;

                            try {

                                startRecognition();

                            } catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ====================================================
           START
           ==================================================== */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition already running."
            );

        }

    }


    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>
</html>
