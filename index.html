<script>

/* =========================================================
   CLASSROOM LIVE CAPTION
   SMART TRANSCRIPTION + EXPLICIT SPELLING
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const sizeSelect =
  document.getElementById("sizeSelect");

const languageMode =
  document.getElementById("languageMode");

const status =
  document.getElementById("status");

const caption =
  document.getElementById("caption");

const captionText =
  document.getElementById("captionText");


/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let listening = false;

let currentCaption = "";

let currentInterim = "";

let silenceTimer = null;

/*
   SPELLING MODE

   This is activated ONLY when the user says:

   "spell"

   or:

   "spell specific"

   or:

   "spell the word specific"
*/

let spellingMode = false;


/*
   When the user says only:

   "spell"

   we wait for the next word.
*/

let waitingForSpellingWord = false;


/*
   Prevent duplicate finalized results.
*/

let lastFinalText = "";


const SILENCE_DELAY = 500;

const MIN_FONT_SIZE = 40;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {

  status.textContent = text;

}


/* =========================================================
   CLEAR CAPTION
   ========================================================= */

function clearCaption() {

  currentCaption = "";

  currentInterim = "";

  captionText.textContent = "";

  captionText.classList.remove("interim");

  captionText.classList.add("hidden");

}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilenceTimer() {

  if (silenceTimer !== null) {

    clearTimeout(silenceTimer);

    silenceTimer = null;

  }

}


function restartSilenceTimer() {

  cancelSilenceTimer();

  silenceTimer = setTimeout(() => {

    currentCaption = "";

    currentInterim = "";

    captionText.textContent = "";

    captionText.classList.remove("interim");

    captionText.classList.add("hidden");

    lastFinalText = "";

    spellingMode = false;

    waitingForSpellingWord = false;

    silenceTimer = null;

  }, SILENCE_DELAY);

}


/* =========================================================
   FILLERS
   ========================================================= */

function removeFillers(text) {

  return text

    .replace(
      /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
      ""
    )

    .replace(/\s{2,}/g, " ")

    .trim();

}


/* =========================================================
   ACCIDENTAL REPETITIONS
   ========================================================= */

function removeImmediateRepeats(text) {

  const words =
    text.split(/\s+/);

  const result = [];

  for (const word of words) {

    const previous =
      result[result.length - 1];

    if (
      previous &&
      word
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "") ===
      previous
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "")
    ) {

      continue;

    }

    result.push(word);

  }

  return result.join(" ");

}


/* =========================================================
   PUNCTUATION
   ========================================================= */

function convertPunctuation(text) {

  let t = text;

  const replacements = [

    [
      /\bquestion mark\b/gi,
      "?"
    ],

    [
      /\bquestionmark\b/gi,
      "?"
    ],

    [
      /\bexclamation mark\b/gi,
      "!"
    ],

    [
      /\bexclamation point\b/gi,
      "!"
    ],

    [
      /\bcomma\b/gi,
      ","
    ],

    [
      /\bperiod\b/gi,
      "."
    ],

    [
      /\bfull stop\b/gi,
      "."
    ],

    [
      /\bcolon\b/gi,
      ":"
    ],

    [
      /\bsemicolon\b/gi,
      ";"
    ],

    [
      /\bopen parenthesis\b/gi,
      "("
    ],

    [
      /\bclose parenthesis\b/gi,
      ")"
    ],

    [
      /\bquotation mark\b/gi,
      "\""
    ],

    [
      /\bquote\b/gi,
      "\""
    ],

    [
      /\bhyphen\b/gi,
      "-"
    ],

    [
      /\bdash\b/gi,
      "—"
    ],

    [
      /\bnew line\b/gi,
      "\n"
    ],

    [
      /\bnew paragraph\b/gi,
      "\n\n"
    ]

  ];

  for (const [pattern, replacement] of replacements) {

    t =
      t.replace(
        pattern,
        replacement
      );

  }

  return t;

}


/* =========================================================
   NUMBER ENGINE
   ========================================================= */

const units = {

  zero: 0,
  one: 1,
  two: 2,
  three: 3,
  four: 4,
  five: 5,
  six: 6,
  seven: 7,
  eight: 8,
  nine: 9,
  ten: 10,
  eleven: 11,
  twelve: 12,
  thirteen: 13,
  fourteen: 14,
  fifteen: 15,
  sixteen: 16,
  seventeen: 17,
  eighteen: 18,
  nineteen: 19

};


const tens = {

  twenty: 20,
  thirty: 30,
  forty: 40,
  fifty: 50,
  sixty: 60,
  seventy: 70,
  eighty: 80,
  ninety: 90

};


function wordsToNumber(words) {

  let total = 0;

  let current = 0;

  let found = false;

  for (const word of words) {

    if (units[word] !== undefined) {

      current += units[word];

      found = true;

    }

    else if (tens[word] !== undefined) {

      current += tens[word];

      found = true;

    }

    else if (word === "hundred") {

      if (current === 0) {
        current = 1;
      }

      current *= 100;

      found = true;

    }

    else if (word === "thousand") {

      if (current === 0) {
        current = 1;
      }

      total += current * 1000;

      current = 0;

      found = true;

    }

    else {

      return null;

    }

  }

  if (!found) {

    return null;

  }

  return total + current;

}


function convertNumbers(text) {

  const tokens =
    text.split(/\s+/);

  const output = [];

  let i = 0;

  while (i < tokens.length) {

    let bestNumber = null;

    let bestLength = 0;

    for (
      let length =
        Math.min(6, tokens.length - i);
      length >= 1;
      length--
    ) {

      const candidate =
        tokens
          .slice(i, i + length)
          .map(word =>
            word
              .toLowerCase()
              .replace(/[^a-z]/g, "")
          );

      const number =
        wordsToNumber(candidate);

      if (number !== null) {

        bestNumber = number;

        bestLength = length;

        break;

      }

    }

    if (bestLength > 0) {

      output.push(
        String(bestNumber)
      );

      i += bestLength;

    }

    else {

      output.push(tokens[i]);

      i++;

    }

  }

  return output.join(" ");

}


/* =========================================================
   SPELLING
   ========================================================= */

/*
   Convert a word into:

   specific

   →

   S-P-E-C-I-F-I-C
*/

function spellWord(word) {

  const clean =
    word
      .replace(/[^A-Za-z]/g, "")
      .toUpperCase();

  if (!clean) {

    return "";

  }

  return clean
    .split("")
    .join("-");

}


/*
   Detect:

   spell specific

   spell the word specific

   spell "specific"

   spell shit

   etc.
*/

function extractSpellCommand(text) {

  const cleaned =
    text
      .trim()
      .replace(/[.!?]+$/g, "")
      .trim();


  const match =
    cleaned.match(
      /^(?:please\s+)?spell(?:\s+the\s+word)?(?:\s+)([a-z]+)$/i
    );


  if (!match) {

    return null;

  }


  return match[1];

}


/*
   Detect the word "spell" by itself.
*/

function isSpellCommand(text) {

  const cleaned =
    text
      .trim()
      .toLowerCase()
      .replace(/[.!?]+$/g, "")
      .trim();

  return (
    cleaned === "spell" ||
    cleaned === "please spell"
  );

}


/* =========================================================
   PROCESS SPELLING
   ========================================================= */

function processSpelling(text) {

  const cleaned =
    text
      .trim()
      .replace(/[.!?]+$/g, "")
      .trim();


  /*
     "spell specific"
  */

  const directWord =
    extractSpellCommand(cleaned);

  if (directWord) {

    spellingMode = false;

    waitingForSpellingWord = false;

    return spellWord(directWord);

  }


  /*
     "spell"
     by itself means:
     wait for the next word.
  */

  if (isSpellCommand(cleaned)) {

    spellingMode = true;

    waitingForSpellingWord = true;

    return "";

  }


  /*
     If we are waiting for a spelling word,
     spell the next spoken word.
  */

  if (
    spellingMode &&
    waitingForSpellingWord
  ) {

    const words =
      cleaned.split(/\s+/);

    /*
       Use the first normal word.
    */

    const word =
      words[0];

    if (/^[A-Za-z]+$/.test(word)) {

      spellingMode = false;

      waitingForSpellingWord = false;

      return spellWord(word);

    }

  }


  return null;

}


/* =========================================================
   NORMAL SPEECH PROCESSOR
   ========================================================= */

function processNormalSpeech(text) {

  if (!text) {

    return "";

  }

  let t =
    text.trim();


  /*
     Remove fillers.
  */

  t =
    removeFillers(t);


  /*
     Remove immediate duplicated words.
  */

  t =
    removeImmediateRepeats(t);


  /*
     Convert spoken punctuation.
  */

  t =
    convertPunctuation(t);


  /*
     Convert number words.
  */

  t =
    convertNumbers(t);


  /*
     IMPORTANT:

     There is NO automatic conversion of:

     are → R
     you → U
     why → Y
     tea → T

     Normal speech remains normal speech.
  */


  t =
    t
      .replace(/\s+([,.!?;:)\]}])/g, "$1")
      .replace(/([(\[])\s+/g, "$1")
      .replace(/\s+([)\]])/g, "$1")
      .replace(/[ \t]{2,}/g, " ")
      .trim();


  return t;

}


/* =========================================================
   MAIN SPEECH PROCESSOR
   ========================================================= */

function processSpeech(text) {

  if (!text) {

    return "";

  }


  /*
     SPELLING COMMAND HAS PRIORITY.
  */

  const spellingResult =
    processSpelling(text);


  if (spellingResult !== null) {

    return spellingResult;

  }


  /*
     If spelling mode is active but
     this isn't the spelling word yet,
     don't accidentally process it
     as normal speech.
  */

  if (
    spellingMode &&
    waitingForSpellingWord
  ) {

    return "";

  }


  /*
     Everything else is normal speech.
  */

  return processNormalSpeech(text);

}


/* =========================================================
   CAPTION DISPLAY
   ========================================================= */

function showCaption() {

  captionText.classList.remove("hidden");

}


function hideCaption() {

  captionText.classList.add("hidden");

}


/* =========================================================
   ADAPTIVE FONT
   ========================================================= */

function fitCaption() {

  if (!captionText.textContent.trim()) {

    return;

  }

  let fontSize =
    Number(sizeSelect.value);


  caption.style.fontSize =
    fontSize + "px";


  while (
    captionText.scrollHeight >
    captionText.clientHeight &&
    fontSize > MIN_FONT_SIZE
  ) {

    fontSize -= 2;

    caption.style.fontSize =
      fontSize + "px";

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function renderCaption() {

  const display =
    [
      currentCaption,
      currentInterim
    ]
    .filter(Boolean)
    .join(" ")
    .trim();


  if (!display) {

    captionText.textContent = "";

    hideCaption();

    return;

  }


  captionText.textContent =
    display;


  captionText.classList.toggle(
    "interim",
    Boolean(currentInterim)
  );


  showCaption();

  fitCaption();

}


/* =========================================================
   APPEND FINAL SPEECH
   ========================================================= */

function appendFinalSpeech(text) {

  if (!text.trim()) {

    return;

  }


  /*
     SPELLING COMMAND

     This is handled before normal speech.
  */

  const spellingResult =
    processSpelling(text);


  if (spellingResult !== null) {

    if (spellingResult.trim()) {

      currentCaption =
        spellingResult;

    }

    else {

      currentCaption = "";

    }

    currentInterim = "";

    renderCaption();

    return;

  }


  /*
     If we are waiting for the spelling word,
     don't add it as ordinary text.
  */

  if (
    spellingMode &&
    waitingForSpellingWord
  ) {

    return;

  }


  /*
     Normal speech.
  */

  const processed =
    processNormalSpeech(text);


  if (!processed.trim()) {

    return;

  }


  /*
     Prevent duplicate finalized chunks.
  */

  if (
    processed.trim().toLowerCase() ===
    lastFinalText.trim().toLowerCase()
  ) {

    return;

  }


  /*
     Punctuation attaches directly.
  */

  if (
    /^[,.!?;:)\]}]/.test(processed)
  ) {

    currentCaption =
      currentCaption.trim() +
      processed;

  }

  else {

    currentCaption =
      (
        currentCaption +
        " " +
        processed
      )
      .replace(/\s+/g, " ")
      .trim();

  }


  lastFinalText =
    processed;


  renderCaption();

}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

if (!SpeechRecognition) {

  startBtn.disabled = true;

  setStatus(
    "Chrome speech recognition is unavailable."
  );

}

else {

  recognition =
    new SpeechRecognition();


  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 5;

  recognition.lang =
    languageMode.value;


  /* =======================================================
     LANGUAGE
     ======================================================= */

  languageMode.addEventListener(
    "change",
    () => {

      recognition.lang =
        languageMode.value;


      if (listening) {

        try {

          recognition.stop();

        }

        catch (error) {}

      }

    }
  );


  /* =======================================================
     START
     ======================================================= */

  recognition.onstart = () => {

    listening = true;

    startBtn.disabled = true;

    stopBtn.disabled = false;

    setStatus("Listening…");

  };


  /* =======================================================
     RESULT
     ======================================================= */

  recognition.onresult = (event) => {

    cancelSilenceTimer();


    currentInterim = "";


    let newlyFinalized = "";

    let newestInterim = "";


    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result =
        event.results[i];


      const transcript =
        result[0]
          .transcript
          .trim();


      if (!transcript) {

        continue;

      }


      if (result.isFinal) {

        newlyFinalized +=
          " " + transcript;

      }

      else {

        newestInterim +=
          " " + transcript;

      }

    }


    /*
       FINAL SPEECH
    */

    if (newlyFinalized.trim()) {

      appendFinalSpeech(
        newlyFinalized.trim()
      );

      restartSilenceTimer();

    }


    /*
       INTERIM SPEECH

       Do NOT interfere with spelling mode.
    */

    if (
      newestInterim.trim() &&
      !spellingMode
    ) {

      currentInterim =
        processNormalSpeech(
          newestInterim.trim()
        );

    }


    /*
       During spelling mode,
       hide interim results until
       the complete spelling command
       is finalized.
    */

    else {

      currentInterim = "";

    }


    renderCaption();


    if (
      newlyFinalized.trim() &&
      !newestInterim.trim()
    ) {

      restartSilenceTimer();

    }

  };


  /* =======================================================
     ERROR
     ======================================================= */

  recognition.onerror = (event) => {

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {

      listening = false;

      startBtn.disabled = false;

      stopBtn.disabled = true;

      setStatus(
        "Microphone permission denied."
      );

      return;

    }


    setStatus(
      "Listening…"
    );

  };


  /* =======================================================
     END
     ======================================================= */

  recognition.onend = () => {

    if (listening) {

      setTimeout(() => {

        if (!listening) {

          return;

        }

        try {

          recognition.lang =
            languageMode.value;

          recognition.start();

        }

        catch (error) {}

      }, 200);

    }

    else {

      startBtn.disabled = false;

      stopBtn.disabled = true;

      setStatus("Stopped");

    }

  };


  /* =======================================================
     START BUTTON
     ======================================================= */

  startBtn.addEventListener(
    "click",
    () => {

      if (listening) {

        return;

      }


      clearCaption();

      cancelSilenceTimer();

      spellingMode = false;

      waitingForSpellingWord = false;

      lastFinalText = "";


      recognition.lang =
        languageMode.value;


      try {

        recognition.start();

      }

      catch (error) {

        setStatus(
          "Could not start listening."
        );

      }

    }
  );


  /* =======================================================
     STOP BUTTON
     ======================================================= */

  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      cancelSilenceTimer();

      currentInterim = "";

      spellingMode = false;

      waitingForSpellingWord = false;


      try {

        recognition.stop();

      }

      catch (error) {}


      setStatus("Stopped");

    }
  );

}


/* =========================================================
   CLEAR BUTTON
   ========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    cancelSilenceTimer();

    clearCaption();

    lastFinalText = "";

    spellingMode = false;

    waitingForSpellingWord = false;


    setStatus(
      listening
        ? "Listening…"
        : "Ready"
    );

  }
);


/* =========================================================
   FONT SIZE
   ========================================================= */

sizeSelect.addEventListener(
  "change",
  () => {

    caption.style.fontSize =
      sizeSelect.value + "px";

    fitCaption();

  }
);


/* =========================================================
   FULL SCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement
          .requestFullscreen();

        document
          .getElementById("controls")
          .classList
          .add("hidden");

      }

      else {

        await document.exitFullscreen();

      }

    }

    catch (error) {

      setStatus(
        "Full screen unavailable."
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  () => {

    if (!document.fullscreenElement) {

      document
        .getElementById("controls")
        .classList
        .remove("hidden");

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

caption.style.fontSize =
  sizeSelect.value;

hideCaption();

</script>
