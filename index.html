<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Classroom Live Transcription</title>


<style>

/* ============================================================
   BASIC SCREEN
   ============================================================ */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ============================================================
   CAPTION
   ============================================================ */

#caption {

    position: fixed;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 90vw;

    max-width: 1500px;

    max-height: 3.6em;

    overflow: hidden;

    text-align: center;

    color: white;

    /*
       DEFAULT CLASSROOM SIZE

       Earlier version:
       maximum 72px

       New default:
       96px
    */

    font-size: 96px;

    font-weight: 600;

    line-height: 1.12;

    overflow-wrap: break-word;

    word-break: normal;

    opacity: 0;

    transition:
        opacity 0.12s ease;

    pointer-events: none;

    user-select: none;
}


#caption.visible {

    opacity: 1;
}


/* ============================================================
   TEACHER MENU
   ============================================================ */

#teacherMenu {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    background:
        rgba(25, 25, 25, 0.96);

    z-index: 1000;

    transition:
        opacity 0.2s ease;
}


#teacherMenu label {

    color: white;

    font-size: 14px;

    font-weight: 600;
}


#teacherMenu select,
#teacherMenu button {

    height: 32px;

    border: 1px solid #666;

    border-radius: 5px;

    background: #222;

    color: white;

    padding: 0 10px;

    font-size: 14px;

    cursor: pointer;
}


#teacherMenu button:hover,
#teacherMenu select:hover {

    background: #333;
}


/* ============================================================
   FULLSCREEN

   When the page enters fullscreen, the entire menu disappears.
   ============================================================ */

:fullscreen #teacherMenu {

    display: none;
}


:-webkit-full-screen #teacherMenu {

    display: none;
}


/* ============================================================
   TRANSLATION STATUS

   This is NOT displayed on the student screen.

   It is only logged internally.
   ============================================================ */

</style>

</head>


<body>


<!-- ============================================================
     TEACHER MENU
     ============================================================ -->

<div id="teacherMenu">

    <label for="fontSize">
        Font
    </label>

    <select id="fontSize">

        <option value="48">
            48 px
        </option>

        <option value="64">
            64 px
        </option>

        <option value="80">
            80 px
        </option>

        <option value="96" selected>
            96 px
        </option>

        <option value="120">
            120 px
        </option>

        <option value="144">
            144 px
        </option>

    </select>


    <label for="language">
        Language
    </label>

    <select id="language">

        <option value="en" selected>
            English
        </option>

        <option value="th">
            Thai
        </option>

    </select>


    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>



<!-- ============================================================
     ONLY STUDENT-VISIBLE ELEMENT
     ============================================================ -->

<div id="caption"></div>



<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ============================================================
   SETTINGS
   ============================================================ */

const CLEAR_DELAY = 2000;

let clearTimer = null;

let recognition = null;

let restarting = false;

let currentLanguage = "en";

let lastFinalEnglish = "";


/* ============================================================
   FONT SIZE
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        /*
        Clear old caption when language changes.
        */

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   CAPTION DISPLAY
   ============================================================ */

function showCaption(text) {

    if (!text || !text.trim()) {

        return;
    }


    clearTimeout(clearTimer);


    caption.textContent =
        text.trim();


    caption.classList.add(
        "visible"
    );
}


/* ============================================================
   CLEAR CAPTION
   ============================================================ */

function clearCaption() {

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove(
        "visible"
    );
}


/* ============================================================
   PROTECTED WORDS

   These MUST remain words.

   "anyone"
   "someone"
   "everyone"

   must never become:

   "any 1"
   "some 1"
   "every 1"
   ============================================================ */

const protectedWords = new Set([

    "anyone",
    "someone",
    "everyone",

    "anybody",
    "somebody",
    "everybody",

    "nobody",

    "nothing",
    "something",
    "everything",

    "anywhere",
    "somewhere",
    "everywhere",

    "sometimes"

]);


/* ============================================================
   PROTECT SPECIAL WORDS
   ============================================================ */

function protectSpecialWords(text) {

    const saved = [];


    text = text.replace(
        /\b[a-zA-Z]+(?:'[a-zA-Z]+)?\b/g,

        function(word) {

            const lower =
                word.toLowerCase();


            if (
                protectedWords.has(
                    lower
                )
            ) {

                const token =
                    `___SPECIAL_${saved.length}___`;

                saved.push(word);

                return token;
            }


            return word;
        }
    );


    return {
        text,
        saved
    };
}


/* ============================================================
   RESTORE SPECIAL WORDS
   ============================================================ */

function restoreSpecialWords(
    text,
    saved
) {

    return text.replace(
        /___SPECIAL_(\d+)___/g,

        function(match, index) {

            return saved[
                parseInt(index, 10)
            ];

        }
    );
}


/* ============================================================
   CONVERT ORDINARY DIGITS TO WORDS

   Examples:

   5      -> five
   12     -> twelve
   25     -> twenty-five

   BUT:

   2026   -> 2026
   $25    -> $25
   25 baht -> 25 baht

   Spoken "one", "two", "three" remain words.
   ============================================================ */

function numberToWords(number) {

    const ones = [

        "zero",
        "one",
        "two",
        "three",
        "four",
        "five",
        "six",
        "seven",
        "eight",
        "nine",
        "ten",
        "eleven",
        "twelve",
        "thirteen",
        "fourteen",
        "fifteen",
        "sixteen",
        "seventeen",
        "eighteen",
        "nineteen"

    ];


    const tens = [

        "",
        "",
        "twenty",
        "thirty",
        "forty",
        "fifty",
        "sixty",
        "seventy",
        "eighty",
        "ninety"

    ];


    if (number < 20) {

        return ones[number];

    }


    if (number < 100) {

        return tens[
            Math.floor(number / 10)
        ] +

        (
            number % 10
                ? "-" +
                  ones[number % 10]
                : ""
        );

    }


    if (number < 1000) {

        return (

            ones[
                Math.floor(number / 100)
            ]

            +

            " hundred"

            +

            (
                number % 100
                    ? " " +
                      numberToWords(
                          number % 100
                      )
                    : ""
            )

        );

    }


    if (number < 1000000) {

        return (

            numberToWords(
                Math.floor(
                    number / 1000
                )
            )

            +

            " thousand"

            +

            (
                number % 1000
                    ? " " +
                      numberToWords(
                          number % 1000
                      )
                    : ""
            )

        );

    }


    return String(number);
}


/* ============================================================
   FORMAT NUMBERS
   ============================================================ */

function formatNumbers(text) {

    const protectedResult =
        protectSpecialWords(text);


    let result =
        protectedResult.text;


    /*
    Protect money.
    */

    const money = [];


    result = result.replace(

        /(?:[$€£¥]\s?\d[\d,]*(?:\.\d+)?|\b\d[\d,]*(?:\.\d+)?\s?(?:dollars?|baht|euros?|pounds?|yen))/gi,

        function(match) {

            const token =
                `___MONEY_${money.length}___`;

            money.push(match);

            return token;

        }

    );


    /*
    Protect years.
    */

    const years = [];


    result = result.replace(

        /\b(?:1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/g,

        function(match) {

            const token =
                `___YEAR_${years.length}___`;

            years.push(match);

            return token;

        }

    );


    /*
    Convert ordinary digits.
    */

    result = result.replace(

        /\b\d+\b/g,

        function(match) {

            const number =
                parseInt(
                    match,
                    10
                );


            /*
            Avoid absurdly large conversions.
            */

            if (
                !Number.isSafeInteger(
                    number
                ) ||
                number > 999999
            ) {

                return match;

            }


            return numberToWords(
                number
            );

        }

    );


    /*
    Restore years.
    */

    result = result.replace(

        /___YEAR_(\d+)___/g,

        function(match, index) {

            return years[
                parseInt(index, 10)
            ];

        }

    );


    /*
    Restore money.
    */

    result = result.replace(

        /___MONEY_(\d+)___/g,

        function(match, index) {

            return money[
                parseInt(index, 10)
            ];

        }

    );


    /*
    Restore words such as "anyone".
    */

    result =
        restoreSpecialWords(
            result,
            protectedResult.saved
        );


    return result;
}


/* ============================================================
   PUNCTUATION CLEANUP

   We preserve punctuation supplied by speech recognition.

   We do NOT remove question marks or exclamation marks.
   ============================================================ */

function cleanPunctuation(text) {

    return text

        .replace(
            /\s+([,.!?;:])/g,
            "$1"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* ============================================================
   ENGLISH CAPTION
   ============================================================ */

function displayEnglish(text) {

    const processed =
        formatNumbers(text);


    const cleaned =
        cleanPunctuation(
            processed
        );


    if (!cleaned) {
        return;
    }


    showCaption(cleaned);
}


/* ============================================================
   TRANSLATE ENGLISH → THAI

   The browser sends the completed English sentence
   to YOUR server.

   The server then communicates with Google Cloud Translation.

   The Google credential never appears in this HTML file.
   ============================================================ */

async function translateToThai(text) {

    try {

        const response =
            await fetch(
                "/translate",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        text: text,

                        source: "en",

                        target: "th"

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Translation request failed."
            );

        }


        const data =
            await response.json();


        if (
            !data.translation
        ) {

            throw new Error(
                "No translation returned."
            );

        }


        return data.translation;

    }

    catch (error) {

        console.error(
            "Translation error:",
            error
        );


        return null;
    }
}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    console.error(
        "Speech Recognition is not supported in this browser."
    );

}

else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();


        /*
        Continuous listening.
        */

        recognition.continuous =
            true;


        /*
        We want live text while speaking.
        */

        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        recognition.lang =
            "en-US";


        /*
        ========================================================
        SPEECH RESULT
        ========================================================
        */

        recognition.onresult =
            async function(event) {

                let interimText = "";

                let finalText = "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const result =
                        event.results[i];


                    const transcript =
                        result[0].transcript;


                    if (
                        result.isFinal
                    ) {

                        finalText +=
                            transcript;

                    }

                    else {

                        interimText +=
                            transcript;

                    }

                }


                /*
                =================================================
                INTERIM SPEECH
                =================================================

                Show English immediately.

                This keeps the caption feeling live.
                */

                if (
                    interimText.trim() &&
                    currentLanguage === "en"
                ) {

                    displayEnglish(
                        interimText
                    );

                }


                /*
                =================================================
                FINAL SPEECH
                =================================================
                */

                if (
                    finalText.trim()
                ) {

                    lastFinalEnglish =
                        finalText.trim();


                    /*
                    English mode.
                    */

                    if (
                        currentLanguage === "en"
                    ) {

                        displayEnglish(
                            finalText
                        );

                    }


                    /*
                    Thai mode.
                    */

                    else if (
                        currentLanguage === "th"
                    ) {

                        /*
                        Temporarily show the English
                        recognition while translation
                        is being requested.
                        */

                        displayEnglish(
                            finalText
                        );


                        const thai =
                            await translateToThai(
                                formatNumbers(
                                    finalText
                                )
                            );


                        /*
                        Make sure the user has not
                        switched back to English while
                        translation was happening.
                        */

                        if (
                            thai &&
                            currentLanguage === "th"
                        ) {

                            showCaption(
                                thai
                            );

                        }

                    }


                    /*
                    =================================================
                    TWO-SECOND DISAPPEAR TIMER
                    =================================================

                    If no new speech arrives,
                    the caption disappears.
                    */

                    clearTimeout(
                        clearTimer
                    );


                    clearTimer =
                        setTimeout(
                            function() {

                                clearCaption();

                            },
                            CLEAR_DELAY
                        );

                }

            };


        /*
        ========================================================
        SPEECH START
        ========================================================
        */

        recognition.onspeechstart =
            function() {

                /*
                Immediately clear the old caption
                when a new person starts speaking.
                */

                clearCaption();

            };


        /*
        ========================================================
        SPEECH END
        ========================================================
        */

        recognition.onspeechend =
            function() {

                /*
                Start the two-second disappearance timer
                as soon as actual speech ends.
                */

                clearTimeout(
                    clearTimer
                );


                clearTimer =
                    setTimeout(
                        function() {

                            clearCaption();

                        },
                        CLEAR_DELAY
                    );

            };


        /*
        ========================================================
        RECOGNITION ENDS
        ========================================================
        */

        recognition.onend =
            function() {

                /*
                Chrome can end a recognition session
                even though we still want to listen.

                Restart automatically.
                */

                if (
                    !restarting
                ) {

                    restarting =
                        true;


                    setTimeout(
                        function() {

                            restarting =
                                false;


                            try {

                                startRecognition();

                            }

                            catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        100
                    );

                }

            };


        /*
        ========================================================
        ERROR
        ========================================================
        */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /*
        ========================================================
        START
        ========================================================
        */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition could not start yet."
            );

        }

    }


    /*
    ============================================================
    AUTOMATIC START
    ============================================================
    */

    window.addEventListener(
        "load",
        function() {

            startRecognition();

        }
    );

}

</script>

</body>
</html>
