<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Caption</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  padding: 8px 11px;
  border: 1px solid #555;
  border-radius: 6px;
  background: #252525;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

#status {
  margin-left: auto;
  color: #aaa;
  font-size: 13px;
}

#captionArea {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 3vh 5vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1900px;
  text-align: center;
  font-weight: 700;
  line-height: 1.12;
  font-size: 90px;
}

#captionText {
  width: 100%;
  max-height: 4.48em;
  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: normal;
  transition: opacity .15s ease, font-size .1s ease;
}

#captionText.interim {
  opacity: .82;
}

#captionText.hidden {
  opacity: 0;
}

#controls.hidden {
  display: none;
}
</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">▶ Start Listening</button>
  <button id="stopBtn" disabled>■ Stop</button>
  <button id="clearBtn">Clear</button>
  <button id="fullscreenBtn">⛶ Full Screen</button>

  <label>
    Size:
    <select id="sizeSelect">
      <option value="60">60</option>
      <option value="72">72</option>
      <option value="80">80</option>
      <option value="90" selected>90</option>
      <option value="100">100</option>
      <option value="110">110</option>
      <option value="120">120</option>
    </select>
  </label>

  <label>
    Language:
    <select id="languageMode">
      <option value="en-US">English</option>
      <option value="th-TH">Thai</option>
    </select>
  </label>

  <span id="status">Ready</span>

</div>

<main id="captionArea">
  <div id="caption">
    <div id="captionText"></div>
  </div>
</main>

<script>

/* =========================================================
   CLASSROOM LIVE CAPTION — REVISED ENGINE
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const sizeSelect =
  document.getElementById("sizeSelect");

const languageMode =
  document.getElementById("languageMode");

const status =
  document.getElementById("status");

const caption =
  document.getElementById("caption");

const captionText =
  document.getElementById("captionText");


/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let listening = false;

/*
   IMPORTANT:

   We no longer keep the entire history.

   This is ONLY the current caption sentence/
   utterance.
*/
let currentCaption = "";

let currentInterim = "";

let silenceTimer = null;

let spellingMode = false;

let syllableMode = false;

let lastFinalText = "";

const SILENCE_DELAY = 3000;

const MIN_FONT_SIZE = 40;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {
  status.textContent = text;
}


/* =========================================================
   CLEAR CAPTION
   ========================================================= */

function clearCaption() {

  currentCaption = "";
  currentInterim = "";

  captionText.textContent = "";

  captionText.classList.remove("interim");
  captionText.classList.add("hidden");

}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilenceTimer() {

  if (silenceTimer !== null) {

    clearTimeout(silenceTimer);

    silenceTimer = null;
  }
}


function restartSilenceTimer() {

  cancelSilenceTimer();

  silenceTimer = setTimeout(() => {

    currentCaption = "";
    currentInterim = "";

    captionText.textContent = "";

    captionText.classList.remove("interim");
    captionText.classList.add("hidden");

    /*
       A new sentence starts fresh.
    */
    lastFinalText = "";

    /*
       Do not leave special modes running
       after a complete silence.
    */
    spellingMode = false;
    syllableMode = false;

    silenceTimer = null;

  }, SILENCE_DELAY);
}


/* =========================================================
   FILLERS
   ========================================================= */

function removeFillers(text) {

  return text
    .replace(
      /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
      ""
    )
    .replace(/\s{2,}/g, " ")
    .trim();

}


/* =========================================================
   ACCIDENTAL REPETITIONS
   ========================================================= */

function removeImmediateRepeats(text) {

  const words =
    text.split(/\s+/);

  const result = [];

  for (const word of words) {

    const previous =
      result[result.length - 1];

    if (
      previous &&
      word
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "") ===

      previous
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "")
    ) {
      continue;
    }

    result.push(word);
  }

  return result.join(" ");

}


/* =========================================================
   PUNCTUATION
   ========================================================= */

function convertPunctuation(text) {

  let t = text;

  const replacements = [

    [
      /\bquestion mark\b/gi,
      "?"
    ],

    [
      /\bquestionmark\b/gi,
      "?"
    ],

    [
      /\bexclamation mark\b/gi,
      "!"
    ],

    [
      /\bexclamation point\b/gi,
      "!"
    ],

    [
      /\bcomma\b/gi,
      ","
    ],

    [
      /\bperiod\b/gi,
      "."
    ],

    [
      /\bfull stop\b/gi,
      "."
    ],

    [
      /\bcolon\b/gi,
      ":"
    ],

    [
      /\bsemicolon\b/gi,
      ";"
    ],

    [
      /\bopen parenthesis\b/gi,
      "("
    ],

    [
      /\bclose parenthesis\b/gi,
      ")"
    ],

    [
      /\bquotation mark\b/gi,
      "\""
    ],

    [
      /\bquote\b/gi,
      "\""
    ],

    [
      /\bhyphen\b/gi,
      "-"
    ],

    [
      /\bdash\b/gi,
      "—"
    ],

    [
      /\bnew line\b/gi,
      "\n"
    ],

    [
      /\bnew paragraph\b/gi,
      "\n\n"
    ]

  ];

  for (const [pattern, replacement] of replacements) {

    t = t.replace(
      pattern,
      replacement
    );

  }

  return t;

}


/* =========================================================
   NUMBER ENGINE
   ========================================================= */

const units = {
  zero: 0,
  one: 1,
  two: 2,
  three: 3,
  four: 4,
  five: 5,
  six: 6,
  seven: 7,
  eight: 8,
  nine: 9,
  ten: 10,
  eleven: 11,
  twelve: 12,
  thirteen: 13,
  fourteen: 14,
  fifteen: 15,
  sixteen: 16,
  seventeen: 17,
  eighteen: 18,
  nineteen: 19
};

const tens = {
  twenty: 20,
  thirty: 30,
  forty: 40,
  fifty: 50,
  sixty: 60,
  seventy: 70,
  eighty: 80,
  ninety: 90
};


/*
   Converts:

   eight       → 8
   twenty      → 20
   twenty five → 25
   one hundred → 100
   one hundred twenty five → 125
*/

function wordsToNumber(words) {

  let total = 0;
  let current = 0;
  let found = false;

  for (const word of words) {

    if (units[word] !== undefined) {

      current += units[word];
      found = true;

    }

    else if (tens[word] !== undefined) {

      current += tens[word];
      found = true;

    }

    else if (word === "hundred") {

      if (current === 0) {
        current = 1;
      }

      current *= 100;
      found = true;

    }

    else if (word === "thousand") {

      if (current === 0) {
        current = 1;
      }

      total += current * 1000;
      current = 0;
      found = true;

    }

    else {

      return null;

    }

  }

  if (!found) {
    return null;
  }

  return total + current;

}


/*
   Replace number phrases without
   accidentally changing ordinary words.
*/

function convertNumbers(text) {

  const tokens =
    text.split(/\s+/);

  const output = [];

  let i = 0;

  while (i < tokens.length) {

    let bestNumber = null;
    let bestLength = 0;

    /*
       Try sequences from longest to shortest.
    */

    for (
      let length = Math.min(6, tokens.length - i);
      length >= 1;
      length--
    ) {

      const candidate =
        tokens
          .slice(i, i + length)
          .map(word =>
            word
              .toLowerCase()
              .replace(/[^a-z]/g, "")
          );

      const number =
        wordsToNumber(candidate);

      if (number !== null) {

        bestNumber = number;
        bestLength = length;
        break;

      }

    }

    if (bestLength > 0) {

      output.push(
        String(bestNumber)
      );

      i += bestLength;

    }

    else {

      output.push(tokens[i]);

      i++;

    }

  }

  return output.join(" ");

}


/* =========================================================
   LETTER NAMES
   ========================================================= */

const letterNames = {

  a: "A",
  ay: "A",

  b: "B",
  bee: "B",

  c: "C",
  see: "C",

  d: "D",
  dee: "D",

  e: "E",

  f: "F",
  ef: "F",

  g: "G",
  gee: "G",

  h: "H",
  aitch: "H",

  i: "I",
  eye: "I",

  j: "J",
  jay: "J",

  k: "K",
  kay: "K",

  l: "L",
  el: "L",

  m: "M",
  em: "M",

  n: "N",
  en: "N",

  o: "O",

  p: "P",
  pee: "P",

  q: "Q",
  cue: "Q",

  r: "R",
  are: "R",

  s: "S",
  ess: "S",

  t: "T",
  tea: "T",

  u: "U",
  you: "U",

  v: "V",
  vee: "V",

  w: "W",
  doubleyou: "W",

  x: "X",
  ex: "X",

  y: "Y",
  why: "Y",

  z: "Z",
  zee: "Z",
  zed: "Z"

};


/* =========================================================
   DETECT LETTER RUNS INSIDE A SENTENCE
   =========================================================

   Example:

   "The vowels are A E I O U"

   becomes:

   "The vowels are A, E, I, O, U"
*/

function convertLetterRuns(text) {

  const words =
    text.split(/\s+/);

  const output = [];

  let i = 0;

  while (i < words.length) {

    const clean =
      words[i]
        .toLowerCase()
        .replace(/[^a-z]/g, "");

    if (letterNames[clean]) {

      const letters = [];

      let j = i;

      while (j < words.length) {

        const candidate =
          words[j]
            .toLowerCase()
            .replace(/[^a-z]/g, "");

        if (!letterNames[candidate]) {
          break;
        }

        letters.push(
          letterNames[candidate]
        );

        j++;

      }

      /*
         Only treat two or more consecutive
         letter names as a letter sequence.

         A single "I" remains ordinary text.
      */

      if (letters.length >= 2) {

        output.push(
          letters.join(", ")
        );

        i = j;

        continue;

      }

    }

    output.push(words[i]);

    i++;

  }

  return output.join(" ");

}


/* =========================================================
   SPELLING
   ========================================================= */


/*
   Detect:

   T-H-E-M-S-E-L-V-E-S

   and normalize it.
*/

function normalizeHyphenSpelling(text) {

  return text.replace(
    /\b([A-Za-z](?:-[A-Za-z])+)\b/g,
    match =>
      match.toUpperCase()
  );

}


/*
   Detect:

   T H E M S E L V E S

   when explicitly in spelling mode.
*/

function spellIndividualLetters(text) {

  const words =
    text
      .trim()
      .split(/\s+/);

  if (words.length < 2) {
    return text;
  }

  if (
    words.every(word =>
      /^[A-Za-z]$/.test(word)
    )
  ) {

    return words
      .map(word =>
        word.toUpperCase()
      )
      .join("-");

  }

  return text;

}


/*
   "spell cat"

   → C-A-T
*/

function explicitSpellCommand(text) {

  const match =
    text.match(
      /^(?:please\s+)?spell\s+(?:the\s+word\s+)?([a-z]+)$/i
    );

  if (!match) {
    return null;
  }

  return match[1]
    .toUpperCase()
    .split("")
    .join("-");

}


/* =========================================================
   SYLLABLE ENGINE
   ========================================================= */

const knownSyllables = {

  mitigating: "mit-i-gat-ing",

  themselves: "them-selves",

  pronunciation: "pro-nun-ci-a-tion",

  transcription: "tran-scrip-tion",

  communication: "com-mu-ni-ca-tion",

  education: "ed-u-ca-tion",

  classroom: "class-room",

  teacher: "teach-er",

  student: "stu-dent",

  science: "sci-ence",

  English: "Eng-lish",

  alphabet: "al-pha-bet",

  vocabulary: "vo-cab-u-lar-y",

  photosynthesis: "pho-to-syn-the-sis"

};


function syllabifyWord(word) {

  const original = word;

  const clean =
    word
      .toLowerCase()
      .replace(/[^a-z]/g, "");

  if (knownSyllables[clean]) {
    return knownSyllables[clean];
  }

  if (clean.length <= 3) {
    return original;
  }

  /*
     Basic syllable approximation.
     Explicit syllable mode should be used
     for classroom syllabication.
  */

  const vowels = "aeiouy";

  let result = "";

  let previousWasVowel = false;

  for (let i = 0; i < clean.length; i++) {

    const char = clean[i];

    const isVowel =
      vowels.includes(char);

    if (
      i > 1 &&
      isVowel &&
      !previousWasVowel &&
      result.length > 3
    ) {

      result += "-";

    }

    result += char;

    previousWasVowel = isVowel;

  }

  return result;

}


/*
   Explicit command:

   syllabicate mitigating

   →
   mit-i-gat-ing
*/

function explicitSyllableCommand(text) {

  const match =
    text.match(
      /^(?:please\s+)?(?:syllabicate|syllabify|break\s+(?:it\s+)?into\s+syllables)\s+(.+)$/i
    );

  if (!match) {
    return null;
  }

  return match[1]
    .trim()
    .split(/\s+/)
    .map(word =>
      syllabifyWord(word)
    )
    .join(" ");

}


/* =========================================================
   COMMAND DETECTION
   ========================================================= */

function detectCommands(text) {

  const lower =
    text
      .trim()
      .toLowerCase();


  /*
     SPELLING MODE
  */

  if (
    lower === "spelling mode" ||
    lower === "start spelling" ||
    lower === "start spelling mode"
  ) {

    spellingMode = true;
    syllableMode = false;

    return {
      command: true,
      output: ""
    };

  }


  if (
    lower === "stop spelling" ||
    lower === "exit spelling mode"
  ) {

    spellingMode = false;

    return {
      command: true,
      output: ""
    };

  }


  /*
     SYLLABLE MODE
  */

  if (
    lower === "syllable mode" ||
    lower === "start syllable mode" ||
    lower === "start syllabication"
  ) {

    syllableMode = true;
    spellingMode = false;

    return {
      command: true,
      output: ""
    };

  }


  if (
    lower === "stop syllable mode" ||
    lower === "exit syllable mode"
  ) {

    syllableMode = false;

    return {
      command: true,
      output: ""
    };

  }


  /*
     LANGUAGE COMMANDS
  */

  if (
    lower.includes("switch to thai") ||
    lower.includes("switch to thai translation") ||
    lower.includes("switch to thai text")
  ) {

    languageMode.value = "th-TH";

    if (recognition) {
      recognition.lang = "th-TH";
    }

    return {
      command: true,
      output: ""
    };

  }


  if (
    lower.includes("switch to english") ||
    lower.includes("switch back to english") ||
    lower.includes("switch to english text") ||
    lower.includes("switch to english translation")
  ) {

    languageMode.value = "en-US";

    if (recognition) {
      recognition.lang = "en-US";
    }

    return {
      command: true,
      output: ""
    };

  }


  return {
    command: false,
    output: null
  };

}


/* =========================================================
   MAIN PROCESSOR
   ========================================================= */

function processSpeech(text) {

  if (!text) {
    return "";
  }

  let t =
    text
      .trim();


  /*
     Commands first.
  */

  const command =
    detectCommands(t);

  if (command.command) {
    return command.output;
  }


  /*
     Explicit spelling command.
  */

  const explicitSpell =
    explicitSpellCommand(t);

  if (explicitSpell !== null) {

    spellingMode = false;

    return explicitSpell;

  }


  /*
     Explicit syllabication command.
  */

  const explicitSyllable =
    explicitSyllableCommand(t);

  if (explicitSyllable !== null) {

    syllableMode = false;

    return explicitSyllable;

  }


  /*
     Hyphenated spelling.
  */

  t =
    normalizeHyphenSpelling(t);


  /*
     SPELLING MODE
  */

  if (spellingMode) {

    return spellIndividualLetters(t);

  }


  /*
     SYLLABLE MODE
  */

  if (syllableMode) {

    return t
      .split(/\s+/)
      .map(word =>
        syllabifyWord(word)
      )
      .join(" ");

  }


  /*
     Normal speech.
  */

  t =
    removeFillers(t);

  t =
    removeImmediateRepeats(t);

  t =
    convertPunctuation(t);

  t =
    convertNumbers(t);

  t =
    convertLetterRuns(t);


  /*
     Final punctuation cleanup.
  */

  t =
    t
      .replace(/\s+([,.!?;:])/g, "$1")
      .replace(/([(\[])\s+/g, "$1")
      .replace(/\s+([)\]])/g, "$1")
      .replace(/[ \t]{2,}/g, " ")
      .trim();


  return t;

}


/* =========================================================
   CAPTION DISPLAY
   ========================================================= */

function showCaption() {

  captionText.classList.remove("hidden");

}


function hideCaption() {

  captionText.classList.add("hidden");

}


/* =========================================================
   ADAPTIVE FONT
   ========================================================= */

function fitCaption() {

  if (!captionText.textContent.trim()) {
    return;
  }

  let fontSize =
    Number(sizeSelect.value);

  caption.style.fontSize =
    fontSize + "px";


  /*
     Maximum four visible lines.
  */

  while (
    captionText.scrollHeight >
    captionText.clientHeight &&
    fontSize > MIN_FONT_SIZE
  ) {

    fontSize -= 2;

    caption.style.fontSize =
      fontSize + "px";

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function renderCaption() {

  const display =
    [
      currentCaption,
      currentInterim
    ]
    .filter(Boolean)
    .join(" ")
    .trim();


  if (!display) {

    captionText.textContent = "";

    hideCaption();

    return;

  }


  captionText.textContent =
    display;


  captionText.classList.toggle(
    "interim",
    Boolean(currentInterim)
  );


  showCaption();

  fitCaption();

}


/* =========================================================
   APPEND FINAL SPEECH
   ========================================================= */

function appendFinalSpeech(text) {

  if (!text.trim()) {
    return;
  }

  const processed =
    processSpeech(text);


  if (!processed.trim()) {
    return;
  }


  /*
     Prevent the same finalized chunk
     from being added twice.
  */

  if (
    processed.trim().toLowerCase() ===
    lastFinalText.trim().toLowerCase()
  ) {

    return;

  }


  /*
     Punctuation should attach directly.
  */

  if (
    /^[,.!?;:)\]}]/.test(processed)
  ) {

    currentCaption =
      currentCaption.trim() +
      processed;

  }

  else {

    currentCaption =
      (
        currentCaption +
        " " +
        processed
      )
      .replace(/\s+/g, " ")
      .trim();

  }


  lastFinalText =
    processed;

}


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

if (!SpeechRecognition) {

  startBtn.disabled = true;

  setStatus(
    "Chrome speech recognition is unavailable."
  );

}
else {

  recognition =
    new SpeechRecognition();


  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 5;

  recognition.lang =
    languageMode.value;


  /* =======================================================
     LANGUAGE
     ======================================================= */

  languageMode.addEventListener(
    "change",
    () => {

      recognition.lang =
        languageMode.value;


      /*
         Restart recognition so the new
         language takes effect immediately.
      */

      if (listening) {

        try {
          recognition.stop();
        }
        catch (error) {}

      }

    }
  );


  /* =======================================================
     START
     ======================================================= */

  recognition.onstart = () => {

    listening = true;

    startBtn.disabled = true;

    stopBtn.disabled = false;

    setStatus("Listening…");

  };


  /* =======================================================
     RESULT
     ======================================================= */

  recognition.onresult = (event) => {

    /*
       IMPORTANT:

       Every new sound resets the 3-second
       disappearance countdown.
    */

    cancelSilenceTimer();


    currentInterim = "";


    let newlyFinalized = "";


    let newestInterim = "";


    /*
       ONLY inspect new results.

       We do not rebuild the entire
       transcript on every event.

       This eliminates the repeated:

       "Ion Caption Ion Caption Ion..."

       problem.
    */

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result =
        event.results[i];


      const transcript =
        result[0]
          .transcript
          .trim();


      if (!transcript) {
        continue;
      }


      if (result.isFinal) {

        newlyFinalized +=
          " " + transcript;

      }

      else {

        newestInterim +=
          " " + transcript;

      }

    }


    /*
       Add only newly finalized text.
    */

    if (newlyFinalized.trim()) {

      appendFinalSpeech(
        newlyFinalized.trim()
      );

    }


    /*
       Show the current unfinished
       speech without permanently
       adding it to the caption.
    */

    if (newestInterim.trim()) {

      currentInterim =
        processSpeech(
          newestInterim.trim()
        );

    }


    renderCaption();


    /*
       Start the disappearance timer
       when the browser has finalized
       speech and there is currently
       no unfinished speech.
    */

    if (
      newlyFinalized.trim() &&
      !newestInterim.trim()
    ) {

      restartSilenceTimer();

    }

  };


  /* =======================================================
     ERROR
     ======================================================= */

  recognition.onerror = (event) => {

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {

      listening = false;

      startBtn.disabled = false;

      stopBtn.disabled = true;

      setStatus(
        "Microphone permission denied."
      );

      return;

    }


    /*
       Do not kill the application for
       temporary recognition errors.
    */

    setStatus(
      "Listening…"
    );

  };


  /* =======================================================
     END
     ======================================================= */

  recognition.onend = () => {

    if (listening) {

      /*
         Chrome sometimes ends its speech
         recognition session automatically.

         Restart it without clearing the
         current caption.
      */

      setTimeout(() => {

        if (!listening) {
          return;
        }

        try {

          recognition.lang =
            languageMode.value;

          recognition.start();

        }
        catch (error) {}

      }, 200);

    }
    else {

      startBtn.disabled = false;

      stopBtn.disabled = true;

      setStatus("Stopped");

    }

  };


  /* =======================================================
     START BUTTON
     ======================================================= */

  startBtn.addEventListener(
    "click",
    () => {

      if (listening) {
        return;
      }


      clearCaption();

      cancelSilenceTimer();

      spellingMode = false;

      syllableMode = false;

      lastFinalText = "";

      recognition.lang =
        languageMode.value;


      try {

        recognition.start();

      }
      catch (error) {

        setStatus(
          "Could not start listening."
        );

      }

    }
  );


  /* =======================================================
     STOP BUTTON
     ======================================================= */

  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      cancelSilenceTimer();

      currentInterim = "";

      try {
        recognition.stop();
      }
      catch (error) {}

      setStatus("Stopped");

    }
  );

}


/* =========================================================
   CLEAR BUTTON
   ========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    cancelSilenceTimer();

    clearCaption();

    lastFinalText = "";

    spellingMode = false;

    syllableMode = false;

    setStatus(
      listening
        ? "Listening…"
        : "Ready"
    );

  }
);


/* =========================================================
   FONT SIZE
   ========================================================= */

sizeSelect.addEventListener(
  "change",
  () => {

    caption.style.fontSize =
      sizeSelect.value + "px";

    fitCaption();

  }
);


/* =========================================================
   FULL SCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement
          .requestFullscreen();

        document
          .getElementById("controls")
          .classList
          .add("hidden");

      }
      else {

        await document.exitFullscreen();

      }

    }
    catch (error) {

      setStatus(
        "Full screen unavailable."
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  () => {

    if (!document.fullscreenElement) {

      document
        .getElementById("controls")
        .classList
        .remove("hidden");

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

caption.style.fontSize =
  sizeSelect.value + "px";

hideCaption();

</script>

</body>
</html>
