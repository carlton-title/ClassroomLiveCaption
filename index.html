<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Live Caption</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#controls {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font-family: inherit;
  font-size: 15px;
  padding: 9px 13px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #252525;
  color: #fff;
  cursor: pointer;
}

button:hover,
select:hover {
  background: #333;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

#status {
  margin-left: auto;
  color: #aaa;
  font-size: 14px;
}

#captionArea {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4vh 6vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1800px;
  text-align: center;
  font-size: 90px;
  line-height: 1.15;
  font-weight: 700;
  overflow: hidden;
}

#captionText {
  width: 100%;
  max-height: 4.6em;
  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: normal;
  transition: opacity .25s ease;
}

#captionText.interim {
  opacity: .78;
}

#captionText.hidden {
  opacity: 0;
}

#controls.hidden {
  display: none;
}
</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">
    ▶ Start Listening
  </button>

  <button id="stopBtn" disabled>
    ■ Stop
  </button>

  <button id="clearBtn">
    Clear
  </button>

  <button id="fullscreenBtn">
    ⛶ Full Screen
  </button>

  <label>
    Size:
    <select id="sizeSelect">
      <option value="60">60</option>
      <option value="72">72</option>
      <option value="80">80</option>
      <option value="90" selected>90</option>
      <option value="100">100</option>
      <option value="110">110</option>
      <option value="120">120</option>
    </select>
    px
  </label>

  <label>
    Language:
    <select id="languageMode">
      <option value="en-US">English</option>
      <option value="th-TH">ไทย</option>
    </select>
  </label>

  <span id="status">Ready</span>

</div>


<main id="captionArea">

  <div id="caption">
    <div id="captionText"></div>
  </div>

</main>


<script>

/* =====================================================
   CLASSROOM LIVE CAPTION ENGINE
   ===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* DOM */

const caption =
  document.getElementById("caption");

const captionText =
  document.getElementById("captionText");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const sizeSelect =
  document.getElementById("sizeSelect");

const languageMode =
  document.getElementById("languageMode");

const status =
  document.getElementById("status");


/* =====================================================
   STATE
   ===================================================== */

let recognition = null;

let listening = false;

let finalText = "";

let interimText = "";

let silenceTimer = null;

let currentFontSize = 90;


/*
   Maximum visible lines.
*/
const MAX_LINES = 4;


/*
   Caption disappears three seconds
   after speech stops.
*/
const SILENCE_DELAY = 3000;


/*
   Smallest automatic font size.
*/
const MIN_FONT_SIZE = 42;


/*
   =====================================================
   FILLER WORDS
   =====================================================
*/

const fillerPattern =
  /\b(um+|uh+|erm+|hmm+)\b/gi;


/*
   =====================================================
   PUNCTUATION COMMANDS
   =====================================================
*/

function convertPunctuation(text) {

  if (!text) return "";

  let result = text;

  result = result.replace(
    /\bquestion mark\b/gi,
    "?"
  );

  result = result.replace(
    /\bexclamation mark\b/gi,
    "!"
  );

  result = result.replace(
    /\bexclamation point\b/gi,
    "!"
  );

  result = result.replace(
    /\bcomma\b/gi,
    ","
  );

  result = result.replace(
    /\bcolon\b/gi,
    ":"
  );

  result = result.replace(
    /\bsemicolon\b/gi,
    ";"
  );

  result = result.replace(
    /\bhyphen\b/gi,
    "-"
  );

  result = result.replace(
    /\bdash\b/gi,
    "—"
  );

  result = result.replace(
    /\bperiod\b/gi,
    "."
  );

  result = result.replace(
    /\bfull stop\b/gi,
    "."
  );

  return result;
}


/*
   =====================================================
   NUMBER CONVERSION
   =====================================================
*/

const numberWords = {
  zero: "0",
  one: "1",
  two: "2",
  three: "3",
  four: "4",
  five: "5",
  six: "6",
  seven: "7",
  eight: "8",
  nine: "9",
  ten: "10",
  eleven: "11",
  twelve: "12",
  thirteen: "13",
  fourteen: "14",
  fifteen: "15",
  sixteen: "16",
  seventeen: "17",
  eighteen: "18",
  nineteen: "19",
  twenty: "20"
};


function convertNumbers(text) {

  if (!text) return "";

  return text.replace(
    /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty)\b/gi,
    word => numberWords[word.toLowerCase()]
  );
}


/*
   =====================================================
   LETTER DETECTION
   =====================================================

   Detect sequences such as:

   A E I O U

   C A T

   T H E M S E L V E S

   Chrome may return these as separate
   words, so we inspect the entire phrase.
   =====================================================
*/

const letterWords = {
  a: "A",
  ay: "A",

  b: "B",
  bee: "B",

  c: "C",
  see: "C",

  d: "D",
  dee: "D",

  e: "E",

  f: "F",
  ef: "F",

  g: "G",
  gee: "G",

  h: "H",
  aitch: "H",

  i: "I",
  eye: "I",

  j: "J",
  jay: "J",

  k: "K",
  kay: "K",

  l: "L",
  el: "L",

  m: "M",
  em: "M",

  n: "N",
  en: "N",

  o: "O",

  p: "P",
  pee: "P",

  q: "Q",
  cue: "Q",

  r: "R",
  are: "R",

  s: "S",
  ess: "S",

  t: "T",
  tea: "T",

  u: "U",
  you: "U",

  v: "V",
  vee: "V",

  w: "W",
  doubleyou: "W",

  x: "X",
  ex: "X",

  y: "Y",
  why: "Y",

  z: "Z",
  zee: "Z",
  zed: "Z"
};


/*
   Convert a sequence of individual
   letter names into letters.

   Example:

   "a e i o u"

   becomes:

   "A, E, I, O, U"
*/

function detectLetterSequence(text) {

  if (!text) return null;

  const words =
    text
      .trim()
      .toLowerCase()
      .split(/\s+/)
      .filter(Boolean);

  if (words.length < 2) {
    return null;
  }

  const converted = [];

  for (const word of words) {

    const clean =
      word.replace(
        /[^a-z]/g,
        ""
      );

    if (
      !letterWords[clean]
    ) {
      return null;
    }

    converted.push(
      letterWords[clean]
    );
  }

  return converted.join(", ");
}


/*
   =====================================================
   EXPLICIT SPELLING DETECTION
   =====================================================
*/

function convertSpellingSequence(text) {

  if (!text) return text;

  /*
     Already hyphenated spelling:

     T-H-E-M-S-E-L-V-E-S

     is preserved.
  */

  if (
    /^[A-Za-z](?:-[A-Za-z])+$/.
    test(text.trim())
  ) {

    return text.toUpperCase();

  }


  /*
     Individual letters:

     T H E M S E L V E S

     become:

     T-H-E-M-S-E-L-V-E-S
  */

  const words =
    text
      .trim()
      .split(/\s+/);

  if (
    words.length >= 2 &&
    words.every(word =>
      /^[A-Za-z]$/.test(word)
    )
  ) {

    return words
      .map(word =>
        word.toUpperCase()
      )
      .join("-");

  }

  return text;
}


/*
   =====================================================
   REPEATED WORD CLEANUP
   =====================================================
*/

function removeAccidentalRepeats(text) {

  if (!text) return "";

  const words =
    text.split(/\s+/);

  const output = [];

  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const current =
      words[i];

    const previous =
      output[output.length - 1];

    if (
      previous &&
      current
        .toLowerCase()
        .replace(/[.,!?]/g, "") ===

      previous
        .toLowerCase()
        .replace(/[.,!?]/g, "")
    ) {

      continue;
    }

    output.push(current);
  }

  return output.join(" ");
}


/*
   =====================================================
   TEXT CLEANUP
   =====================================================
*/

function cleanText(text) {

  if (!text) return "";

  let result = text;


  /*
     Remove fillers.
  */

  result =
    result.replace(
      fillerPattern,
      ""
    );


  /*
     Remove obvious accidental
     repetitions.
  */

  result =
    removeAccidentalRepeats(
      result
    );


  /*
     Convert punctuation commands.
  */

  result =
    convertPunctuation(
      result
    );


  /*
     Normalize numbers.
  */

  result =
    convertNumbers(
      result
    );


  /*
     Clean extra spaces.
  */

  result =
    result
      .replace(/\s+([,.!?;:])/g, "$1")
      .replace(/\s{2,}/g, " ")
      .trim();


  return result;
}


/*
   =====================================================
   SMART PROCESSOR
   =====================================================
*/

function processSpeech(text) {

  if (!text) return "";

  const original =
    text.trim();


  /*
     First check for a sequence
     of letters.

     This is particularly important
     for classroom examples such as:

     "A E I O U"
  */

  const letters =
    detectLetterSequence(
      original
    );


  if (letters) {

    return letters;

  }


  /*
     Next check for deliberate
     spelling.
  */

  const spelling =
    convertSpellingSequence(
      original
    );


  if (
    spelling !== original
  ) {

    return spelling;

  }


  /*
     Otherwise process ordinary
     classroom speech.
  */

  return cleanText(
    original
  );
}


/*
   =====================================================
   CAPTION DISPLAY
   =====================================================
*/

function showCaption() {

  captionText.classList.remove(
    "hidden"
  );

}


function hideCaption() {

  captionText.classList.add(
    "hidden"
  );

}


/*
   =====================================================
   SILENCE TIMER
   =====================================================
*/

function cancelSilenceTimer() {

  if (
    silenceTimer !== null
  ) {

    clearTimeout(
      silenceTimer
    );

    silenceTimer = null;

  }

}


function startSilenceTimer() {

  cancelSilenceTimer();

  silenceTimer =
    setTimeout(
      () => {

        finalText = "";

        interimText = "";

        captionText.textContent =
          "";

        hideCaption();

        silenceTimer =
          null;

      },
      SILENCE_DELAY
    );

}


/*
   =====================================================
   ADAPTIVE FONT SIZE
   =====================================================

   The caption can use up to four
   lines.

   Instead of deleting words when
   the sentence becomes longer,
   the font becomes smaller.
   =====================================================
*/

function fitCaption() {

  if (
    !captionText.textContent.trim()
  ) {

    return;

  }


  let fontSize =
    Number(
      sizeSelect.value
    );


  caption.style.fontSize =
    fontSize + "px";


  while (

    captionText.scrollHeight >
    captionText.clientHeight &&

    fontSize >
    MIN_FONT_SIZE

  ) {

    fontSize -= 2;

    caption.style.fontSize =
      fontSize + "px";

  }


  currentFontSize =
    fontSize;

}


/*
   =====================================================
   RENDER
   =====================================================
*/

function renderCaption() {

  const combined =
    [
      finalText,
      interimText
    ]
    .filter(Boolean)
    .join(" ");


  if (!combined) {

    captionText.textContent =
      "";

    hideCaption();

    return;

  }


  captionText.textContent =
    combined;


  showCaption();


  captionText.classList.toggle(
    "interim",
    Boolean(interimText)
  );


  fitCaption();

}


/*
   =====================================================
   FONT SIZE CONTROL
   =====================================================
*/

sizeSelect.addEventListener(
  "change",
  () => {

    currentFontSize =
      Number(
        sizeSelect.value
      );

    caption.style.fontSize =
      currentFontSize + "px";

    fitCaption();

  }
);


/*
   =====================================================
   CLEAR
   =====================================================
*/

clearBtn.addEventListener(
  "click",
  () => {

    finalText = "";

    interimText = "";

    cancelSilenceTimer();

    captionText.textContent =
      "";

    hideCaption();

    setStatus(
      listening
        ? "Listening…"
        : "Ready"
    );

  }
);


/*
   =====================================================
   FULL SCREEN
   =====================================================
*/

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        await
          document.documentElement
            .requestFullscreen();

        document
          .getElementById(
            "controls"
          )
          .classList
          .add("hidden");

      }

      else {

        await
          document.exitFullscreen();

      }

    }

    catch (error) {

      setStatus(
        "Full screen unavailable"
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  () => {

    if (
      !document.fullscreenElement
    ) {

      document
        .getElementById(
          "controls"
        )
        .classList
        .remove("hidden");

    }

  }
);


/*
   =====================================================
   STATUS
   =====================================================
*/

function setStatus(message) {

  status.textContent =
    message;

}


/*
   =====================================================
   SPEECH RECOGNITION
   =====================================================
*/

if (!SpeechRecognition) {

  setStatus(
    "Chrome speech recognition is required."
  );

  startBtn.disabled =
    true;

}

else {

  recognition =
    new SpeechRecognition();


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  /*
     Multiple alternatives give the
     browser more opportunities to
     recognize ambiguous speech.
  */

  recognition.maxAlternatives =
    3;


  function updateLanguage() {

    recognition.lang =
      languageMode.value;

  }


  updateLanguage();


  languageMode.addEventListener(
    "change",
    () => {

      updateLanguage();

      if (listening) {

        try {

          recognition.stop();

        }

        catch (error) {}

      }

    }
  );


  /*
     ==================================================
     RECOGNITION START
     ==================================================
  */

  recognition.onstart =
    () => {

      listening = true;

      startBtn.disabled =
        true;

      stopBtn.disabled =
        false;

      setStatus(
        "Listening…"
      );

    };


  /*
     ==================================================
     SPEECH RESULT
     ==================================================
  */

  recognition.onresult =
    event => {

      /*
         New speech means the caption
         should stay visible.
      */

      cancelSilenceTimer();


      interimText = "";


      let newFinal =
        "";


      let newInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const raw =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          newFinal +=
            " " + raw;

        }

        else {

          newInterim +=
            " " + raw;

        }

      }


      /*
         Process finalized speech.
      */

      if (
        newFinal.trim()
      ) {

        const processed =
          processSpeech(
            newFinal
          );


        if (processed) {

          finalText =
            (
              finalText +
              " " +
              processed
            )
            .replace(
              /\s+/g,
              " "
            )
            .trim();

        }

      }


      /*
         Process speech that Chrome
         has not finalized yet.

         This makes the display feel
         live instead of waiting for
         the complete sentence.
      */

      if (
        newInterim.trim()
      ) {

        interimText =
          processSpeech(
            newInterim
          );

      }


      renderCaption();


      /*
         Start the disappearance timer
         after finalized speech.

         More speech cancels it.
      */

      if (
        newFinal.trim() &&
        !newInterim.trim()
      ) {

        startSilenceTimer();

      }

    };


  /*
     ==================================================
     ERROR
     ==================================================
  */

  recognition.onerror =
    event => {

      if (
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ) {

        listening = false;

        startBtn.disabled =
          false;

        stopBtn.disabled =
          true;

        setStatus(
          "Microphone permission denied"
        );

      }

      else {

        setStatus(
          "Recognition: " +
          event.error
        );

      }

    };


  /*
     ==================================================
     AUTOMATIC RESTART
     ==================================================
  */

  recognition.onend =
    () => {

      if (listening) {

        try {

          recognition.start();

        }

        catch (error) {}

      }

      else {

        startBtn.disabled =
          false;

        stopBtn.disabled =
          true;

        setStatus(
          "Stopped"
        );

      }

    };


  /*
     ==================================================
     START BUTTON
     ==================================================
  */

  startBtn.addEventListener(
    "click",
    () => {

      if (!listening) {

        updateLanguage();

        cancelSilenceTimer();

        try {

          recognition.start();

        }

        catch (error) {

          setStatus(
            "Could not start listening"
          );

        }

      }

    }
  );


  /*
     ==================================================
     STOP BUTTON
     ==================================================
  */

  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      cancelSilenceTimer();

      interimText = "";

      try {

        recognition.stop();

      }

      catch (error) {}

      setStatus(
        "Stopped"
      );

    }
  );

}


/*
   =====================================================
   INITIAL DISPLAY
   =====================================================
*/

caption.style.fontSize =
  sizeSelect.value + "px";

</script>

</body>
</html>
