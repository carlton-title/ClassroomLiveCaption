<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speech Recognition Captioning</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    /* Main screen */
    #screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #111;
    }

    /* Number sequence */
    #numberDisplay {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);

        font-size: 32px;
        font-weight: bold;
        color: white;

        z-index: 10;
    }

    /* Caption container */
    #captionContainer {
        position: absolute;

        /*
         * IMPORTANT:
         * The captions are positioned from the TOP,
         * not from the bottom.
         */
        top: 180px;
        left: 50%;

        transform: translateX(-50%);

        width: 85%;
        max-width: 1100px;

        text-align: center;

        z-index: 20;
    }

    /* Caption text */
    #caption {
        display: inline-block;

        padding: 18px 28px;

        font-size: 42px;
        line-height: 1.25;
        font-weight: bold;

        color: white;
        background: rgba(0, 0, 0, 0.75);

        border-radius: 12px;

        min-height: 60px;

        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    /* Control area */
    #controls {
        position: absolute;

        top: 100px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 30;

        display: flex;
        gap: 12px;
    }

    button {
        padding: 12px 22px;

        font-size: 18px;
        font-weight: bold;

        border: none;
        border-radius: 8px;

        cursor: pointer;
    }

    #startButton {
        background: #28a745;
        color: white;
    }

    #stopButton {
        background: #dc3545;
        color: white;
    }

    #status {
        position: absolute;

        top: 145px;
        left: 50%;

        transform: translateX(-50%);

        color: #aaa;

        font-size: 16px;

        z-index: 30;
    }
</style>
</head>

<body>

<div id="screen">

    <!-- NUMBER SEQUENCE -->
    <div id="numberDisplay">1</div>

    <!-- CONTROLS -->
    <div id="controls">
        <button id="startButton">Start</button>
        <button id="stopButton">Stop</button>
    </div>

    <!-- STATUS -->
    <div id="status">Ready</div>

    <!-- CAPTION -->
    <div id="captionContainer">
        <div id="caption"></div>
    </div>

</div>


<script>

    /*
     * ==========================================
     * SPEECH RECOGNITION
     * ==========================================
     */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const caption = document.getElementById("caption");
    const numberDisplay = document.getElementById("numberDisplay");
    const status = document.getElementById("status");

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");


    if (!SpeechRecognition) {

        status.textContent =
            "Speech recognition is not supported in this browser.";

        startButton.disabled = true;
        stopButton.disabled = true;

    } else {

        const recognition = new SpeechRecognition();

        /*
         * Keep listening continuously.
         */
        recognition.continuous = true;

        /*
         * Give both temporary and final results.
         */
        recognition.interimResults = true;

        /*
         * English speech recognition.
         */
        recognition.lang = "en-US";

        /*
         * Current number in the sequence.
         */
        let number = 1;

        /*
         * Prevent automatic restarting
         * after the user presses STOP.
         */
        let manuallyStopped = false;


        /*
         * ==========================================
         * START
         * ==========================================
         */

        startButton.addEventListener("click", () => {

            manuallyStopped = false;

            status.textContent = "Listening...";

            try {
                recognition.start();
            } catch (error) {
                /*
                 * Browser may throw an error if
                 * recognition is already running.
                 */
            }

        });


        /*
         * ==========================================
         * STOP
         * ==========================================
         */

        stopButton.addEventListener("click", () => {

            manuallyStopped = true;

            recognition.stop();

            status.textContent = "Stopped";

        });


        /*
         * ==========================================
         * SPEECH RESULTS
         * ==========================================
         */

        recognition.onresult = (event) => {

            let finalText = "";
            let interimText = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0].transcript;


                if (event.results[i].isFinal) {

                    finalText += transcript;

                } else {

                    interimText += transcript;

                }

            }


            /*
             * Show the speech exactly as
             * recognized by the browser.
             *
             * Nothing is removed.
             */
            if (interimText) {

                caption.textContent =
                    interimText;

            }


            /*
             * When the browser considers
             * the speech final...
             */
            if (finalText) {

                caption.textContent =
                    finalText;


                /*
                 * Increase the number sequence.
                 */
                numberDisplay.textContent =
                    number;

                number++;


                /*
                 * Reset the number if desired.
                 *
                 * Remove this section if you
                 * want unlimited numbers.
                 */
                if (number > 9999) {
                    number = 1;
                }

            }

        };


        /*
         * ==========================================
         * RECOGNITION ENDS
         * ==========================================
         */

        recognition.onend = () => {

            /*
             * Chrome sometimes automatically
             * stops speech recognition.
             *
             * Restart it unless the user
             * deliberately pressed STOP.
             */
            if (!manuallyStopped) {

                status.textContent =
                    "Listening...";

                try {
                    recognition.start();
                } catch (error) {
                    // Already running.
                }

            }

        };


        /*
         * ==========================================
         * ERRORS
         * ==========================================
         */

        recognition.onerror = (event) => {

            console.log(
                "Speech recognition error:",
                event.error
            );


            if (event.error === "not-allowed") {

                status.textContent =
                    "Microphone permission denied.";

            } else if (event.error === "no-speech") {

                status.textContent =
                    "Listening...";

            } else {

                status.textContent =
                    "Error: " + event.error;

            }

        };

    }

</script>

</body>
</html>
