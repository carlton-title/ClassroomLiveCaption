<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Caption</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    max-height: 4em;
    overflow: hidden;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.15;
    overflow-wrap: break-word;
    word-break: normal;
    opacity: 0;
    transition: opacity 0.15s ease;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25, 25, 25, 0.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

:fullscreen #teacherMenu {
    display: none;
}
</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en">English</option>
        <option value="th" selected>Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption = document.getElementById("caption");
const fontSize = document.getElementById("fontSize");
const language = document.getElementById("language");
const fullscreenButton = document.getElementById("fullscreenButton");

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";

const CLEAR_DELAY = 2500;

let currentLanguage = "th";
let clearTimer = null;
let recognition = null;
let restarting = false;
let translationNumber = 0;


/* FONT SIZE */

fontSize.addEventListener("change", function () {
    caption.style.fontSize = fontSize.value + "px";
});


/* LANGUAGE */

language.addEventListener("change", function () {

    currentLanguage = language.value;

    translationNumber++;

    clearCaption();

});


/* FULLSCREEN */

fullscreenButton.addEventListener("click", async function () {

    try {

        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }

    } catch (error) {
        console.error("Fullscreen error:", error);
    }

});


/* SHOW CAPTION */

function showCaption(text) {

    if (!text || !text.trim()) {
        return;
    }

    clearTimeout(clearTimer);

    caption.textContent = text.trim();

    caption.classList.add("visible");
}


/* CLEAR CAPTION */

function clearCaption() {

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove("visible");
}


/* CLEAN TEXT */

function cleanText(text) {

    return text
        .replace(/\s+([,.!?;:])/g, "$1")
        .replace(/\s+/g, " ")
        .trim();

}


/* ENGLISH → THAI USING CLOUDFLARE GET */

async function translateToThai(text) {

    try {

        const url =
            TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);

        console.log("Sending:", text);

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        console.log("Translation:", data);

        return data.translation || null;

    }

    catch (error) {

        console.error(
            "Thai translation failed:",
            error
        );

        return null;

    }

}


/* SPEECH RECOGNITION */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

} else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();

        recognition.continuous = true;

        recognition.interimResults = true;

        recognition.maxAlternatives = 1;

        /*
         * YOU SPEAK ENGLISH.
         * Chrome listens in English.
         */

        recognition.lang = "en-US";


        recognition.onresult =
            async function(event) {

                let finalText = "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const result =
                        event.results[i];

                    const transcript =
                        result[0].transcript;


                    if (result.isFinal) {

                        finalText += transcript;

                    }

                }


                if (!finalText.trim()) {
                    return;
                }


                const english =
                    cleanText(finalText);


                /* ==============================
                   ENGLISH MODE
                   ============================== */

                if (currentLanguage === "en") {

                    showCaption(english);

                    clearTimeout(clearTimer);

                    clearTimer =
                        setTimeout(
                            clearCaption,
                            CLEAR_DELAY
                        );

                    return;
                }


                /* ==============================
                   THAI MODE
                   ============================== */

                if (currentLanguage === "th") {

                    const requestNumber =
                        ++translationNumber;


                    /*
                     * DO NOT SHOW ENGLISH.
                     */

                    clearCaption();


                    const thai =
                        await translateToThai(
                            english
                        );


                    /*
                     * SHOW ONLY THAI.
                     */

                    if (
                        thai &&
                        currentLanguage === "th" &&
                        requestNumber ===
                            translationNumber
                    ) {

                        showCaption(thai);

                        clearTimeout(clearTimer);

                        clearTimer =
                            setTimeout(
                                clearCaption,
                                CLEAR_DELAY
                            );

                    }

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        recognition.onend =
            function() {

                if (!restarting) {

                    restarting = true;

                    setTimeout(
                        function() {

                            restarting = false;

                            try {
                                startRecognition();
                            }
                            catch (error) {
                                console.error(error);
                            }

                        },
                        300
                    );

                }

            };


        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition restarting..."
            );

        }

    }


    window.addEventListener(
        "load",
        startRecognition
    );

}

</script>

</body>
</html>
