<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Live Caption</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow: hidden;
}


/* =========================================================
   CONTROLS
========================================================= */

#controls {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 100;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px 12px;

    background: #171717;

    border-bottom: 1px solid #444;

    flex-wrap: wrap;
}


button,
select {

    font-family: Arial, Helvetica, sans-serif;

    font-size: 15px;

    padding: 9px 12px;

    border: 1px solid #666;

    border-radius: 6px;

    background: #292929;

    color: #fff;

    cursor: pointer;
}


button:hover,
select:hover {

    background: #383838;
}


button:disabled {

    opacity: 0.45;

    cursor: default;
}


label {

    display: flex;

    align-items: center;

    gap: 5px;

    font-size: 14px;
}


#status {

    margin-left: auto;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   CAPTION AREA

   CENTER OF SCREEN
========================================================= */

#captionArea {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12vh 7vw;

    pointer-events: none;

    z-index: 10;
}


#caption {

    width: 100%;

    max-width: 1700px;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;
}


/* =========================================================
   CAPTION BOX

   MAXIMUM TWO LINES
========================================================= */

#captionText {

    width: auto;

    max-width: 1600px;

    padding: 14px 28px;

    border-radius: 12px;

    background: rgba(0, 0, 0, 0.72);

    color: #fff;

    text-align: center;

    font-size: 90px;

    font-weight: 700;

    line-height: 1.12;

    /*
       Maximum two lines.
    */

    display: -webkit-box;

    -webkit-box-orient: vertical;

    -webkit-line-clamp: 2;

    overflow: hidden;

    /*
       Prevent the box from becoming
       unnecessarily tall.
    */

    max-height: 2.24em;

    /*
       Keep normal words intact.
    */

    overflow-wrap: normal;

    word-break: normal;

    /*
       Readability.
    */

    text-shadow:

        2px 2px 4px #000,

        -2px -2px 4px #000,

        2px -2px 4px #000,

        -2px 2px 4px #000;
}


/* =========================================================
   INTERIM SPEECH
========================================================= */

#captionText.interim {

    opacity: 0.72;
}


/* =========================================================
   SPELLING MODE
========================================================= */

#captionText.spelling {

    font-weight: 900;

    letter-spacing: 0.08em;

    text-transform: uppercase;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    visibility: hidden;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #controls {

        padding: 8px;
    }


    button,
    select {

        font-size: 14px;

        padding: 8px 10px;
    }


    #status {

        width: 100%;

        margin-left: 0;
    }


    #captionArea {

        padding: 10vh 4vw;
    }


    #captionText {

        font-size: 55px;

        padding: 10px 18px;

        border-radius: 8px;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     CONTROLS
======================================================= -->

<div id="controls">

    <button id="startBtn">
        ▶ Start Listening
    </button>


    <button id="stopBtn" disabled>
        ■ Stop
    </button>


    <button id="clearBtn">
        Clear
    </button>


    <button id="fullscreenBtn">
        ⛶ Full Screen
    </button>


    <label>

        Size:

        <select id="sizeSelect">

            <option value="50">50</option>

            <option value="60">60</option>

            <option value="70">70</option>

            <option value="80">80</option>

            <option value="90" selected>
                90
            </option>

            <option value="100">100</option>

            <option value="110">110</option>

            <option value="120">120</option>

        </select>

    </label>


    <label>

        Language:

        <select id="languageSelect">

            <option value="en-US">
                English
            </option>

            <option value="th-TH">
                Thai
            </option>

        </select>

    </label>


    <span id="status">
        Ready
    </span>

</div>



<!-- =======================================================
     CAPTION
======================================================= -->

<main id="captionArea">

    <div id="caption">

        <div
            id="captionText"
            class="hidden">
        </div>

    </div>

</main>



<script>

"use strict";


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


/* =========================================================
   ELEMENTS
========================================================= */

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const clearBtn =
    document.getElementById("clearBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const sizeSelect =
    document.getElementById("sizeSelect");

const languageSelect =
    document.getElementById("languageSelect");

const status =
    document.getElementById("status");

const captionText =
    document.getElementById("captionText");


/* =========================================================
   STATE
========================================================= */

let recognition = null;

let listening = false;

let manuallyStopped = false;

let restarting = false;

let silenceTimer = null;

let spellingMode = false;

let waitingForSpellingWord = false;


const SILENCE_DELAY = 1800;

const MIN_FONT_SIZE = 32;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    status.textContent = message;
}


/* =========================================================
   CAPTION VISIBILITY
========================================================= */

function showCaption() {

    captionText.classList.remove(
        "hidden"
    );
}


function hideCaption() {

    captionText.classList.add(
        "hidden"
    );
}


/* =========================================================
   CLEAR CAPTION
========================================================= */

function clearCaption() {

    cancelSilenceTimer();

    spellingMode = false;

    waitingForSpellingWord = false;

    captionText.textContent = "";

    captionText.classList.remove(
        "interim"
    );

    captionText.classList.remove(
        "spelling"
    );

    hideCaption();
}


/* =========================================================
   SILENCE TIMER
========================================================= */

function cancelSilenceTimer() {

    if (
        silenceTimer !== null
    ) {

        clearTimeout(
            silenceTimer
        );

        silenceTimer = null;
    }
}


function startSilenceTimer() {

    cancelSilenceTimer();


    silenceTimer = setTimeout(
        function() {

            captionText.textContent = "";

            captionText.classList.remove(
                "interim"
            );

            captionText.classList.remove(
                "spelling"
            );

            hideCaption();

            silenceTimer = null;

        },

        SILENCE_DELAY
    );
}


/* =========================================================
   FILLER WORDS
========================================================= */

function removeFillers(text) {

    return text

        .replace(
            /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
            ""
        )

        .replace(
            /\s{2,}/g,
            " "
        )

        .trim();
}


/* =========================================================
   IMMEDIATE REPEATED WORDS
========================================================= */

function removeImmediateRepeats(text) {

    const words =
        text.split(/\s+/);

    const result = [];


    for (
        const word of words
    ) {

        const current =

            word

                .toLowerCase()

                .replace(
                    /[.,!?;:"'()[\]{}-]/g,
                    ""
                );


        const previous =

            result.length

                ?

                result[
                    result.length - 1
                ]

                    .toLowerCase()

                    .replace(
                        /[.,!?;:"'()[\]{}-]/g,
                        ""
                    )

                :

                "";


        if (
            current &&
            current === previous
        ) {

            continue;
        }


        result.push(word);
    }


    return result.join(" ");
}


/* =========================================================
   SPOKEN PUNCTUATION
========================================================= */

function convertSpokenPunctuation(text) {

    let t = text;


    const replacements = [

        [
            /\bnew paragraph\b/gi,
            "\n\n"
        ],

        [
            /\bnew line\b/gi,
            "\n"
        ],

        [
            /\bquestion mark\b/gi,
            "?"
        ],

        [
            /\bexclamation mark\b/gi,
            "!"
        ],

        [
            /\bexclamation point\b/gi,
            "!"
        ],

        [
            /\bcomma\b/gi,
            ","
        ],

        [
            /\bfull stop\b/gi,
            "."
        ],

        [
            /\bperiod\b/gi,
            "."
        ],

        [
            /\bcolon\b/gi,
            ":"
        ],

        [
            /\bsemicolon\b/gi,
            ";"
        ],

        [
            /\bopen parenthesis\b/gi,
            "("
        ],

        [
            /\bclose parenthesis\b/gi,
            ")"
        ]
    ];


    for (
        const [pattern, replacement]
        of replacements
    ) {

        t =
            t.replace(
                pattern,
                replacement
            );
    }


    return t;
}


/* =========================================================
   NUMBER WORD TABLES
========================================================= */

const units = {

    zero: 0,

    one: 1,

    two: 2,

    three: 3,

    four: 4,

    five: 5,

    six: 6,

    seven: 7,

    eight: 8,

    nine: 9,

    ten: 10,

    eleven: 11,

    twelve: 12,

    thirteen: 13,

    fourteen: 14,

    fifteen: 15,

    sixteen: 16,

    seventeen: 17,

    eighteen: 18,

    nineteen: 19
};


const tens = {

    twenty: 20,

    thirty: 30,

    forty: 40,

    fifty: 50,

    sixty: 60,

    seventy: 70,

    eighty: 80,

    ninety: 90
};


/* =========================================================
   NUMBER WORDS → VALUE
========================================================= */

function numberWordsToValue(words) {

    let total = 0;

    let current = 0;

    let found = false;


    for (
        const word of words
    ) {

        if (
            units[word] !== undefined
        ) {

            current +=
                units[word];

            found = true;
        }

        else if (
            tens[word] !== undefined
        ) {

            current +=
                tens[word];

            found = true;
        }

        else if (
            word === "hundred"
        ) {

            if (
                current === 0
            ) {

                current = 1;
            }


            current *= 100;

            found = true;
        }

        else if (
            word === "thousand"
        ) {

            if (
                current === 0
            ) {

                current = 1;
            }


            total +=
                current * 1000;

            current = 0;

            found = true;
        }

        else {

            return null;
        }
    }


    return found

        ?

        total + current

        :

        null;
}


/* =========================================================
   YEAR CONVERSION
========================================================= */

function convertYearPhrase(text) {

    const words =
        text.split(/\s+/);

    const result = [];

    let i = 0;


    while (
        i < words.length
    ) {

        const current =

            words[i]

                .toLowerCase()

                .replace(
                    /[^a-z]/g,
                    ""
                );


        /*
           2000 + number

           two thousand twenty-six
           → 2026
        */

        if (
            current === "two" &&
            i + 2 < words.length
        ) {

            const second =

                words[i + 1]

                    .toLowerCase()

                    .replace(
                        /[^a-z]/g,
                        ""
                    );


            const third =

                words[i + 2]

                    .toLowerCase()

                    .replace(
                        /[^a-z]/g,
                        ""
                    );


            if (
                second === "thousand"
            ) {

                const value =
                    numberWordsToValue([
                        third
                    ]);


                if (
                    value !== null &&
                    value >= 0 &&
                    value <= 99
                ) {

                    result.push(
                        String(
                            2000 + value
                        )
                    );

                    i += 3;

                    continue;
                }
            }
        }


        /*
           twenty twenty-six

           → 2026
        */

        if (
            current === "twenty" &&
            i + 1 < words.length
        ) {

            const second =

                words[i + 1]

                    .toLowerCase()

                    .replace(
                        /[^a-z]/g,
                        ""
                    );


            const value =
                numberWordsToValue([
                    second
                ]);


            if (
                value !== null &&
                value >= 0 &&
                value <= 99
            ) {

                result.push(
                    String(
                        2000 + value
                    )
                );

                i += 2;

                continue;
            }
        }


        /*
           nineteen ninety-five

           → 1995
        */

        if (
            current === "nineteen" &&
            i + 1 < words.length
        ) {

            const second =

                words[i + 1]

                    .toLowerCase()

                    .replace(
                        /[^a-z]/g,
                        ""
                    );


            const value =
                numberWordsToValue([
                    second
                ]);


            if (
                value !== null &&
                value >= 0 &&
                value <= 99
            ) {

                result.push(
                    String(
                        1900 + value
                    )
                );

                i += 2;

                continue;
            }
        }


        result.push(
            words[i]
        );

        i++;
    }


    return result.join(" ");
}


/* =========================================================
   ORDINARY NUMBER CONVERSION

   ONE IS PROTECTED.

   Therefore:

   "only one"
       remains
   "only one"

========================================================= */

function convertOrdinaryNumbers(text) {

    const words =
        text.split(/\s+/);

    const result = [];


    for (
        const word of words
    ) {

        const clean =

            word

                .toLowerCase()

                .replace(
                    /[^a-z]/g,
                    ""
                );


        /*
           Protect "one".
        */

        if (
            clean === "one"
        ) {

            result.push(word);

            continue;
        }


        /*
           Convert 2–19.
        */

        if (
            units[clean] !== undefined &&
            units[clean] >= 2
        ) {

            result.push(
                String(
                    units[clean]
                )
            );

            continue;
        }


        /*
           Convert 20, 30, etc.
        */

        if (
            tens[clean] !== undefined
        ) {

            result.push(
                String(
                    tens[clean]
                )
            );

            continue;
        }


        result.push(word);
    }


    return result.join(" ");
}


/* =========================================================
   CONTEXT-AWARE NUMBER PROCESSING
========================================================= */

function convertNumbersContextually(text) {

    let result =
        convertYearPhrase(text);


    result =
        convertOrdinaryNumbers(
            result
        );


    return result;
}


/* =========================================================
   QUESTION DETECTION
========================================================= */

function addQuestionMark(text) {

    const t =
        text.trim();


    if (!t) {

        return "";
    }


    /*
       Already has punctuation.
    */

    if (
        /[.!?]$/.test(t)
    ) {

        return t;
    }


    /*
       Direct auxiliary questions:

       Is he...
       Are they...
       Did you...
       Can you...
       Will you...
    */

    const auxiliaryQuestion =

        /^(am|is|are|was|were|do|does|did|can|could|will|would|should|shall|may|might|have|has|had)\b/i;


    /*
       WH-question structures.

       Only add ? when the sentence contains
       a recognizable question structure.
    */

    const whQuestion =

        /^(who|what|when|where|why|how|which|whose|whom)\b.*\b(is|are|was|were|do|does|did|can|could|will|would|should|have|has|had)\b/i;


    if (
        auxiliaryQuestion.test(t) ||
        whQuestion.test(t)
    ) {

        return t + "?";
    }


    return t;
}


/* =========================================================
   NORMAL SPEECH
========================================================= */

function processSpeech(text) {

    let t =
        text.trim();


    t =
        removeFillers(t);


    t =
        removeImmediateRepeats(t);


    t =
        convertSpokenPunctuation(t);


    /*
       Context-aware numbers.
    */

    t =
        convertNumbersContextually(t);


    t =
        t

            .replace(
                /\s+([,.!?;:)\]}])/g,
                "$1"
            )

            .replace(
                /([(\[])\s+/g,
                "$1"
            )

            .replace(
                /\s{2,}/g,
                " "
            )

            .trim();


    t =
        addQuestionMark(t);


    return t;
}


/* =========================================================
   SPELLING
========================================================= */

function spellWord(word) {

    const clean =

        word

            .replace(
                /[^A-Za-z]/g,
                ""
            )

            .toUpperCase();


    if (!clean) {

        return "";
    }


    return clean
        .split("")
        .join("-");
}


function processSpelling(text) {

    const cleaned =

        text

            .trim()

            .replace(
                /[.!?]+$/g,
                ""
            )

            .trim();


    /*
       "spell apple"
    */

    const direct =

        cleaned.match(

            /^(?:please\s+)?spell(?:\s+the\s+word)?\s+([A-Za-z]+)$/i

        );


    if (direct) {

        spellingMode = false;

        waitingForSpellingWord = false;

        return spellWord(
            direct[1]
        );
    }


    /*
       "spell"
    */

    if (
        /^(?:please\s+)?spell$/i
            .test(cleaned)
    ) {

        spellingMode = true;

        waitingForSpellingWord = true;

        return "";
    }


    /*
       Word after "spell"
    */

    if (
        spellingMode &&
        waitingForSpellingWord
    ) {

        if (
            /^[A-Za-z]+$/.test(
                cleaned
            )
        ) {

            spellingMode = false;

            waitingForSpellingWord =
                false;

            return spellWord(
                cleaned
            );
        }


        spellingMode = false;

        waitingForSpellingWord =
            false;
    }


    return null;
}


/* =========================================================
   DISPLAY CAPTION
========================================================= */

function displayCaption(
    text,
    interim = false
) {

    if (
        !text ||
        !text.trim()
    ) {

        hideCaption();

        return;
    }


    captionText.textContent =
        text.trim();


    captionText.classList.toggle(
        "interim",
        interim
    );


    showCaption();


    requestAnimationFrame(
        fitCaption
    );
}


/* =========================================================
   FONT FITTING

   The caption starts at the selected size.

   If it is too large for two lines,
   it gradually becomes smaller.
========================================================= */

function fitCaption() {

    if (
        !captionText.textContent.trim()
    ) {

        return;
    }


    let fontSize =
        Number(
            sizeSelect.value
        );


    captionText.style.fontSize =
        fontSize + "px";


    while (

        captionText.scrollHeight >
            captionText.clientHeight

        &&

        fontSize > MIN_FONT_SIZE

    ) {

        fontSize -= 2;


        captionText.style.fontSize =
            fontSize + "px";
    }
}


/* =========================================================
   FINAL SPEECH
========================================================= */

function showFinalSpeech(text) {

    if (
        !text.trim()
    ) {

        return;
    }


    /*
       SPELLING COMMAND
    */

    const spelling =
        processSpelling(text);


    if (
        spelling !== null
    ) {

        if (
            spelling
        ) {

            captionText.classList.add(
                "spelling"
            );


            displayCaption(
                spelling,
                false
            );
        }


        return;
    }


    /*
       NORMAL SPEECH
    */

    const processed =
        processSpeech(text);


    if (
        !processed
    ) {

        return;
    }


    captionText.classList.remove(
        "spelling"
    );


    /*
       IMPORTANT:

       We show the current caption rather
       than accumulating the entire speech.
    */

    displayCaption(
        processed,
        false
    );
}


/* =========================================================
   CREATE RECOGNITION
========================================================= */

function createRecognition() {

    if (
        !SpeechRecognition
    ) {

        startBtn.disabled = true;

        stopBtn.disabled = true;

        setStatus(
            "Use Google Chrome for speech recognition."
        );

        return null;
    }


    const r =
        new SpeechRecognition();


    r.continuous = true;

    r.interimResults = true;

    r.maxAlternatives = 1;

    r.lang =
        languageSelect.value;


    /* =====================================================
       START
    ===================================================== */

    r.onstart =
        function() {

            listening = true;

            restarting = false;

            startBtn.disabled = true;

            stopBtn.disabled = false;

            setStatus(
                "Listening..."
            );
        };


    /* =====================================================
       RESULT
    ===================================================== */

    r.onresult =
        function(event) {

            cancelSilenceTimer();


            let finalText = "";

            let interimText = "";


            for (

                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++

            ) {

                const result =
                    event.results[i];


                const transcript =

                    result[0]
                        .transcript
                        .trim();


                if (
                    !transcript
                ) {

                    continue;
                }


                if (
                    result.isFinal
                ) {

                    finalText +=
                        " " +
                        transcript;

                }

                else {

                    interimText +=
                        " " +
                        transcript;
                }
            }


            /*
               FINAL CAPTION
            */

            if (
                finalText.trim()
            ) {

                showFinalSpeech(
                    finalText.trim()
                );


                startSilenceTimer();
            }


            /*
               LIVE INTERIM CAPTION
            */

            if (

                interimText.trim()

                &&

                !waitingForSpellingWord

            ) {

                const processed =
                    processSpeech(
                        interimText.trim()
                    );


                displayCaption(
                    processed,
                    true
                );
            }
        };


    /* =====================================================
       ERROR
    ===================================================== */

    r.onerror =
        function(event) {

            if (

                event.error ===
                    "not-allowed"

                ||

                event.error ===
                    "service-not-allowed"

            ) {

                listening = false;

                manuallyStopped = true;

                startBtn.disabled = false;

                stopBtn.disabled = true;

                setStatus(
                    "Microphone permission denied."
                );

                return;
            }


            if (
                event.error ===
                "audio-capture"
            ) {

                setStatus(
                    "Microphone not available."
                );

                return;
            }


            if (
                event.error ===
                "network"
            ) {

                setStatus(
                    "Speech recognition network error."
                );

                return;
            }


            if (
                event.error ===
                "no-speech"
            ) {

                return;
            }


            if (
                event.error ===
                "aborted"
            ) {

                return;
            }


            setStatus(
                "Speech error: " +
                event.error
            );
        };


    /* =====================================================
       END
    ===================================================== */

    r.onend =
        function() {

            restarting = false;


            if (

                listening

                &&

                !manuallyStopped

            ) {

                restartRecognition();

                return;
            }


            listening = false;

            startBtn.disabled = false;

            stopBtn.disabled = true;

            setStatus(
                "Stopped"
            );
        };


    return r;
}


/* =========================================================
   RESTART
========================================================= */

function restartRecognition() {

    if (

        !recognition

        ||

        !listening

        ||

        manuallyStopped

        ||

        restarting

    ) {

        return;
    }


    restarting = true;


    setTimeout(
        function() {

            if (

                !listening

                ||

                manuallyStopped

            ) {

                restarting = false;

                return;
            }


            try {

                recognition.lang =
                    languageSelect.value;


                recognition.start();

            }

            catch (error) {

                restarting = false;


                setTimeout(
                    restartRecognition,
                    500
                );
            }

        },

        350
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

recognition =
    createRecognition();


/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener(
    "click",
    function() {

        if (
            !recognition
        ) {

            setStatus(
                "Speech recognition unavailable."
            );

            return;
        }


        if (
            listening
        ) {

            return;
        }


        manuallyStopped = false;

        restarting = false;


        clearCaption();


        recognition.lang =
            languageSelect.value;


        try {

            recognition.start();

        }

        catch (error) {

            setStatus(
                "Could not start microphone."
            );
        }
    }
);


/* =========================================================
   STOP BUTTON
========================================================= */

stopBtn.addEventListener(
    "click",
    function() {

        manuallyStopped = true;

        listening = false;

        restarting = false;


        cancelSilenceTimer();


        if (
            recognition
        ) {

            try {

                recognition.stop();

            }

            catch (error) {}
        }


        startBtn.disabled = false;

        stopBtn.disabled = true;

        setStatus(
            "Stopped"
        );
    }
);


/* =========================================================
   CLEAR BUTTON
========================================================= */

clearBtn.addEventListener(
    "click",
    function() {

        clearCaption();


        setStatus(
            listening
                ? "Listening..."
                : "Ready"
        );
    }
);


/* =========================================================
   SIZE
========================================================= */

sizeSelect.addEventListener(
    "change",
    function() {

        fitCaption();
    }
);


/* =========================================================
   LANGUAGE
========================================================= */

languageSelect.addEventListener(
    "change",
    function() {

        if (
            !recognition
        ) {

            return;
        }


        const wasListening =
            listening;


        if (
            wasListening
        ) {

            manuallyStopped = true;

            listening = false;


            try {

                recognition.stop();

            }

            catch (error) {}
        }


        recognition.lang =
            languageSelect.value;


        if (
            wasListening
        ) {

            setTimeout(
                function() {

                    manuallyStopped = false;

                    listening = false;


                    try {

                        recognition.start();

                    }

                    catch (error) {

                        restartRecognition();
                    }

                },

                500
            );
        }
    }
);


/* =========================================================
   FULL SCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();
            }

        }

        catch (error) {

            setStatus(
                "Full screen unavailable."
            );
        }
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        fitCaption();
    }
);


/* =========================================================
   INITIAL DISPLAY
========================================================= */

captionText.style.fontSize =
    sizeSelect.value + "px";


hideCaption();


if (
    SpeechRecognition
) {

    setStatus(
        "Ready"
    );

}

else {

    setStatus(
        "Use Google Chrome for speech recognition."
    );
}

</script>

</body>
</html>
