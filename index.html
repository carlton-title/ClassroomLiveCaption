<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Classroom Live Caption</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

#controls{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:#151515;
  border-bottom:1px solid #333;
  flex-wrap:wrap;
}

button,select{
  font:inherit;
  font-size:15px;
  padding:9px 13px;
  border-radius:7px;
  border:1px solid #555;
  background:#252525;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

#status{
  margin-left:auto;
  color:#aaa;
  font-size:14px;
}

#captionArea{
  flex:1;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4vh 6vw;
  overflow:hidden;
}

#caption{
  width:100%;
  max-width:1900px;
  text-align:center;
  font-size:90px;
  line-height:1.12;
  font-weight:700;
  overflow:hidden;
}

#captionText{
  width:100%;
  max-height:4.48em;
  overflow:hidden;
  overflow-wrap:anywhere;
  word-break:normal;
  transition:opacity .2s ease,font-size .12s ease;
}

#captionText.interim{
  opacity:.82;
}

#captionText.hidden{
  opacity:0;
}

#controls.hidden{
  display:none;
}
</style>
</head>

<body>

<div id="controls">

<button id="startBtn">▶ Start Listening</button>
<button id="stopBtn" disabled>■ Stop</button>
<button id="clearBtn">Clear</button>
<button id="fullscreenBtn">⛶ Full Screen</button>

<label>
Size:
<select id="sizeSelect">
<option value="60">60</option>
<option value="72">72</option>
<option value="80">80</option>
<option value="90" selected>90</option>
<option value="100">100</option>
<option value="110">110</option>
<option value="120">120</option>
</select>
</label>

<label>
Language:
<select id="languageMode">
<option value="en-US">English</option>
<option value="th-TH">ไทย</option>
</select>
</label>

<span id="status">Ready</span>

</div>

<main id="captionArea">
<div id="caption">
<div id="captionText"></div>
</div>
</main>

<script>

/* =========================================================
   CLASSROOM LIVE CAPTION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const caption =
  document.getElementById("caption");

const captionText =
  document.getElementById("captionText");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const sizeSelect =
  document.getElementById("sizeSelect");

const languageMode =
  document.getElementById("languageMode");

const status =
  document.getElementById("status");


let recognition=null;
let listening=false;

let finalText="";
let interimText="";

let silenceTimer=null;

const SILENCE_DELAY=3000;
const MIN_FONT_SIZE=40;


/* =========================================================
   LETTER NAMES
   ========================================================= */

const LETTERS={

a:"A",ay:"A",
b:"B",bee:"B",
c:"C",see:"C",
d:"D",dee:"D",
e:"E",
f:"F",ef:"F",
g:"G",gee:"G",
h:"H",aitch:"H",
i:"I",eye:"I",
j:"J",jay:"J",
k:"K",kay:"K",
l:"L",el:"L",
m:"M",em:"M",
n:"N",en:"N",
o:"O",
p:"P",pee:"P",
q:"Q",cue:"Q",
r:"R",are:"R",
s:"S",ess:"S",
t:"T",tea:"T",
u:"U",you:"U",
v:"V",vee:"V",
w:"W",doubleyou:"W",
x:"X",ex:"X",
y:"Y",why:"Y",
z:"Z",zee:"Z",zed:"Z"

};


/* =========================================================
   NUMBERS
   ========================================================= */

const NUMBER_WORDS={

zero:"0",
one:"1",
two:"2",
three:"3",
four:"4",
five:"5",
six:"6",
seven:"7",
eight:"8",
nine:"9",
ten:"10",
eleven:"11",
twelve:"12",
thirteen:"13",
fourteen:"14",
fifteen:"15",
sixteen:"16",
seventeen:"17",
eighteen:"18",
nineteen:"19",
twenty:"20",
thirty:"30",
forty:"40",
fifty:"50",
sixty:"60",
seventy:"70",
eighty:"80",
ninety:"90"

};


/* =========================================================
   PUNCTUATION
   ========================================================= */

const PUNCTUATION=[

[/\bquestion mark\b/gi,"?"],
[/\bquestionmark\b/gi,"?"],

[/\bexclamation mark\b/gi,"!"],
[/\bexclamation point\b/gi,"!"],

[/\bcomma\b/gi,", "],

[/\bperiod\b/gi,"."],
[/\bfull stop\b/gi,"."],

[/\bcolon\b/gi,":"],
[/\bsemicolon\b/gi,";"],

[/\bopen parenthesis\b/gi,"("],
[/\bopen parentheses\b/gi,"("],

[/\bclose parenthesis\b/gi,")"],
[/\bclose parentheses\b/gi,")"],

[/\bquotation mark\b/gi,'"'],
[/\bquote\b/gi,'"'],

[/\bhyphen\b/gi,"-"],
[/\bdash\b/gi,"—"],

[/\bnew paragraph\b/gi,"\n\n"],
[/\bnew line\b/gi,"\n"]

];


function punctuation(text){

  let t=text;

  for(const [pattern,replacement] of PUNCTUATION){
    t=t.replace(pattern,replacement);
  }

  return t;
}


/* =========================================================
   FILLERS
   ========================================================= */

function removeFillers(text){

  return text
    .replace(/\b(um+|uh+|erm+|hmm+)\b/gi,"")
    .replace(/\s{2,}/g," ")
    .trim();

}


/* =========================================================
   REMOVE ACCIDENTAL REPETITIONS
   ========================================================= */

function removeRepeats(text){

  const words=text.split(/\s+/);
  const output=[];

  for(const word of words){

    const previous=
      output[output.length-1];

    if(
      previous &&
      word
        .toLowerCase()
        .replace(/[.,!?;:]/g,"")
      ===
      previous
        .toLowerCase()
        .replace(/[.,!?;:]/g,"")
    ){
      continue;
    }

    output.push(word);
  }

  return output.join(" ");

}


/* =========================================================
   LETTER SEQUENCE DETECTION
   ========================================================= */

function detectLetters(text){

  const words=
    text
      .toLowerCase()
      .replace(/[.,!?;:]/g,"")
      .split(/\s+/)
      .filter(Boolean);

  if(words.length<2) return null;

  const letters=[];

  for(const word of words){

    const cleaned=
      word.replace(/[^a-z]/g,"");

    if(!LETTERS[cleaned]){
      return null;
    }

    letters.push(LETTERS[cleaned]);
  }

  return letters.join(", ");

}


/* =========================================================
   INDIVIDUAL LETTERS
   ========================================================= */

function detectIndividualLetters(text){

  const words=
    text
      .trim()
      .split(/\s+/);

  if(words.length<2) return null;

  if(
    words.every(
      w=>/^[A-Za-z]$/.test(w)
    )
  ){

    return words
      .map(w=>w.toUpperCase())
      .join("-");

  }

  return null;

}


/* =========================================================
   EXPLICIT SPELLING
   ========================================================= */

function spelling(text){

  let t=text.trim();


  /*
     Already spelled with hyphens.
  */

  if(
    /^[A-Za-z](?:-[A-Za-z])+$/i.test(t)
  ){

    return t.toUpperCase();

  }


  /*
     "spell cat"
     "spell the word cat"
  */

  let match=
    t.match(
      /^(?:please\s+)?spell(?:\s+the\s+word)?\s+(.+)$/i
    );

  if(match){

    const word=
      match[1]
        .trim()
        .replace(/[.,!?]+$/,"");

    return word
      .split("")
      .join("-")
      .toUpperCase();

  }


  /*
     Explicit "spelling mode".
  */

  if(
    /^spelling\s+mode$/i.test(t)
  ){

    return "";

  }


  return null;

}


/* =========================================================
   NUMBER CONVERSION
   ========================================================= */

function numbers(text){

  return text.replace(
    /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b/gi,
    word=>NUMBER_WORDS[word.toLowerCase()]
  );

}


/* =========================================================
   NUMBER + WORD FORMAT
   =========================================================

   Example:

   "12" stays "12"

   "twelve" becomes "12"

   We do NOT write "12 twelve"
   because that would clutter classroom
   captions.
   ========================================================= */


/* =========================================================
   SIMPLE SYLLABLE ENGINE
   ========================================================= */

function syllabifyWord(word){

  const clean=
    word
      .toLowerCase()
      .replace(/[^a-z]/g,"");

  if(clean.length<4)
    return word.toUpperCase();


  /*
     Known classroom examples.
  */

  const known={

    mitigating:"mit-i-gat-ing",
    education:"ed-u-ca-tion",
    computer:"com-pu-ter",
    student:"stu-dent",
    teacher:"teach-er",
    classroom:"class-room",
    English:"Eng-lish",
    science:"sci-ence",
    mathematics:"math-e-mat-ics",
    vocabulary:"vo-cab-u-lar-y",
    pronunciation:"pro-nun-ci-a-tion",
    transcription:"tran-scrip-tion",
    communication:"com-mu-ni-ca-tion",
    photosynthesis:"pho-to-syn-the-sis",
    alphabet:"al-pha-bet",
    themselves:"them-selves"

  };


  if(known[clean]){
    return known[clean];
  }


  /*
     General vowel-group approximation.
  */

  const vowels="aeiouy";

  let result="";
  let previousVowel=false;

  for(let i=0;i<clean.length;i++){

    const ch=clean[i];
    const isVowel=vowels.includes(ch);

    if(
      i>0 &&
      isVowel &&
      !previousVowel &&
      result.length>2
    ){

      result+="-";

    }

    result+=ch;

    previousVowel=isVowel;

  }

  return result;

}


/* =========================================================
   SYLLABLE COMMAND
   ========================================================= */

function syllables(text){

  let match=
    text.match(
      /^(?:please\s+)?(?:syllabicate|syllabify|break\s+into\s+syllables)\s+(.+)$/i
    );

  if(!match) return null;

  const phrase=
    match[1]
      .trim()
      .replace(/[.!?]+$/,"");

  return phrase
    .split(/\s+/)
    .map(word=>syllabifyWord(word))
    .join(" ");

}


/* =========================================================
   MAIN SPEECH PROCESSOR
   ========================================================= */

function processSpeech(text){

  if(!text) return "";

  let t=text.trim();


  /*
     SPELLING COMMAND
  */

  const spelled=
    spelling(t);

  if(spelled!==null){
    return spelled;
  }


  /*
     SYLLABLE COMMAND
  */

  const syllableResult=
    syllables(t);

  if(syllableResult!==null){
    return syllableResult;
  }


  /*
     Letter sequence:

     A E I O U
  */

  const letterResult=
    detectLetters(t);

  if(letterResult){
    return letterResult;
  }


  /*
     Individual letters:

     C A T
  */

  const individual=
    detectIndividualLetters(t);

  if(individual){
    return individual;
  }


  /*
     Normal speech.
  */

  t=removeFillers(t);

  t=removeRepeats(t);

  t=punctuation(t);

  t=numbers(t);


  /*
     Fix punctuation spacing.
  */

  t=t
    .replace(/\s+([,.!?;:])/g,"$1")
    .replace(/([(\[])\s+/g,"$1")
    .replace(/\s+([)\]])/g,"$1")
    .replace(/[ \t]{2,}/g," ")
    .trim();


  return t;

}


/* =========================================================
   DISPLAY
   ========================================================= */

function hideCaption(){

  captionText.classList.add("hidden");

}


function showCaption(){

  captionText.classList.remove("hidden");

}


function fitCaption(){

  if(!captionText.textContent.trim())
    return;


  let size=
    Number(sizeSelect.value);


  caption.style.fontSize=
    size+"px";


  /*
     Keep the entire current sentence
     visible whenever possible.
  */

  while(
    captionText.scrollHeight >
    captionText.clientHeight &&
    size>MIN_FONT_SIZE
  ){

    size-=2;

    caption.style.fontSize=
      size+"px";

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const combined=
    [finalText,interimText]
      .filter(Boolean)
      .join(" ");


  if(!combined){

    captionText.textContent="";
    hideCaption();

    return;

  }


  captionText.textContent=
    combined;

  showCaption();

  captionText.classList.toggle(
    "interim",
    Boolean(interimText)
  );

  fitCaption();

}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilence(){

  if(silenceTimer){

    clearTimeout(silenceTimer);

    silenceTimer=null;

  }

}


function startSilence(){

  cancelSilence();

  silenceTimer=
    setTimeout(()=>{

      finalText="";
      interimText="";

      captionText.textContent="";

      hideCaption();

      silenceTimer=null;

    },SILENCE_DELAY);

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){

  status.textContent=text;

}


/* =========================================================
   FONT SIZE
   ========================================================= */

sizeSelect.addEventListener(
  "change",
  ()=>{

    caption.style.fontSize=
      sizeSelect.value+"px";

    fitCaption();

  }
);


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
  "click",
  ()=>{

    finalText="";
    interimText="";

    cancelSilence();

    captionText.textContent="";

    hideCaption();

    setStatus(
      listening
      ? "Listening…"
      : "Ready"
    );

  }
);


/* =========================================================
   FULL SCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement
          .requestFullscreen();

        document
          .getElementById("controls")
          .classList.add("hidden");

      }else{

        await document.exitFullscreen();

      }

    }catch(e){

      setStatus("Full screen unavailable");

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  ()=>{

    if(!document.fullscreenElement){

      document
        .getElementById("controls")
        .classList.remove("hidden");

    }

  }
);


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

if(!SpeechRecognition){

  setStatus(
    "Speech recognition is not supported."
  );

  startBtn.disabled=true;

}else{

  recognition=
    new SpeechRecognition();

  recognition.continuous=true;

  recognition.interimResults=true;

  recognition.maxAlternatives=5;

  recognition.lang=
    languageMode.value;


  languageMode.addEventListener(
    "change",
    ()=>{

      recognition.lang=
        languageMode.value;

      if(listening){

        try{
          recognition.stop();
        }catch(e){}

      }

    }
  );


  /* =====================================================
     START
     ===================================================== */

  recognition.onstart=()=>{

    listening=true;

    startBtn.disabled=true;

    stopBtn.disabled=false;

    setStatus("Listening…");

  };


  /* =====================================================
     RESULTS
     ===================================================== */

  recognition.onresult=(event)=>{

    cancelSilence();

    interimText="";

    let newFinal="";

    let newInterim="";


    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      const result=
        event.results[i];

      /*
         Use the best available
         recognition alternative.
      */

      let transcript=
        result[0].transcript.trim();


      if(result.isFinal){

        newFinal+=
          " "+transcript;

      }else{

        newInterim+=
          " "+transcript;

      }

    }


    /*
       FINAL SPEECH
    */

    if(newFinal.trim()){

      const processed=
        processSpeech(newFinal);


      if(processed){

        /*
           If the result is punctuation
           or spelling, don't duplicate it.
        */

        if(
          finalText &&
          /^[,.!?;:)\]}]/.test(processed)
        ){

          finalText=
            finalText.trim()+
            processed;

        }else{

          finalText=
            (
              finalText+
              " "+
              processed
            )
            .replace(/\s+/g," ")
            .trim();

        }

      }

    }


    /*
       LIVE / INTERIM SPEECH
    */

    if(newInterim.trim()){

      interimText=
        processSpeech(newInterim);

    }


    render();


    /*
       If speech stops after finalized
       text, begin the 3-second timer.
    */

    if(
      newFinal.trim() &&
      !newInterim.trim()
    ){

      startSilence();

    }

  };


  /* =====================================================
     ERRORS
     ===================================================== */

  recognition.onerror=(event)=>{

    if(
      event.error==="not-allowed" ||
      event.error==="service-not-allowed"
    ){

      listening=false;

      startBtn.disabled=false;

      stopBtn.disabled=true;

      setStatus(
        "Microphone permission denied"
      );

    }else{

      setStatus(
        "Recognition: "+event.error
      );

    }

  };


  /* =====================================================
     AUTOMATIC RESTART
     ===================================================== */

  recognition.onend=()=>{

    if(listening){

      setTimeout(()=>{

        try{
          recognition.start();
        }catch(e){}

      },250);

    }else{

      startBtn.disabled=false;

      stopBtn.disabled=true;

      setStatus("Stopped");

    }

  };


  /* =====================================================
     START BUTTON
     ===================================================== */

  startBtn.addEventListener(
    "click",
    ()=>{

      if(!listening){

        cancelSilence();

        finalText="";
        interimText="";

        recognition.lang=
          languageMode.value;

        try{

          recognition.start();

        }catch(e){

          setStatus(
            "Could not start listening"
          );

        }

      }

    }
  );


  /* =====================================================
     STOP BUTTON
     ===================================================== */

  stopBtn.addEventListener(
    "click",
    ()=>{

      listening=false;

      cancelSilence();

      interimText="";

      try{
        recognition.stop();
      }catch(e){}

      setStatus("Stopped");

    }
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

caption.style.fontSize=
  sizeSelect.value+"px";

</script>

</body>
</html>
