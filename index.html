<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Classroom Live Transcription</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    max-height: 3.6em;
    overflow: hidden;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.12;
    overflow-wrap: break-word;
    word-break: normal;
    opacity: 0;
    transition: opacity 0.12s ease;
    pointer-events: none;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25, 25, 25, 0.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

#teacherMenu button:hover,
#teacherMenu select:hover {
    background: #333;
}

:fullscreen #teacherMenu {
    display: none;
}

:-webkit-full-screen #teacherMenu {
    display: none;
}

</style>

</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">

        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>

    </select>

    <label for="language">Language</label>

    <select id="language">

        <option value="en" selected>English</option>
        <option value="th">Thai</option>

    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ============================================================
   SETTINGS
   ============================================================ */

const CLEAR_DELAY = 2000;

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";

let clearTimer = null;

let recognition = null;

let restarting = false;

let currentLanguage = "en";

let translationNumber = 0;


/* ============================================================
   FONT SIZE
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        translationNumber++;

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   SHOW CAPTION
   ============================================================ */

function showCaption(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return;

    }

    clearTimeout(clearTimer);

    caption.textContent =
        text.trim();

    caption.classList.add(
        "visible"
    );

}


/* ============================================================
   CLEAR CAPTION
   ============================================================ */

function clearCaption() {

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove(
        "visible"
    );

}


/* ============================================================
   PUNCTUATION
   ============================================================ */

function cleanPunctuation(text) {

    return text
        .replace(
            /\s+([,.!?;:])/g,
            "$1"
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* ============================================================
   ENGLISH DISPLAY
   ============================================================ */

function displayEnglish(text) {

    const cleaned =
        cleanPunctuation(text);

    if (cleaned) {

        showCaption(
            cleaned
        );

    }

}


/* ============================================================
   ENGLISH → THAI
   ============================================================ */

async function translateToThai(text) {

    try {

        console.log(
            "Sending to Thai translator:",
            text
        );

        const response =
            await fetch(
                TRANSLATION_SERVER,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Translation server HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Translation response:",
            data
        );


        if (
            data.translation
        ) {

            return data.translation;

        }


        return null;

    }

    catch (error) {

        console.error(
            "Thai translation failed:",
            error
        );

        return null;

    }

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    console.error(
        "Speech Recognition is not supported."
    );

} else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        recognition.lang =
            "en-US";


        recognition.onresult =
            async function(event) {

                let interimText = "";

                let finalText = "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const result =
                        event.results[i];


                    const transcript =
                        result[0].transcript;


                    if (
                        result.isFinal
                    ) {

                        finalText +=
                            transcript;

                    } else {

                        interimText +=
                            transcript;

                    }

                }


                /* ===============================================
                   ENGLISH LIVE TRANSCRIPTION
                   =============================================== */

                if (
                    interimText.trim() &&
                    currentLanguage === "en"
                ) {

                    displayEnglish(
                        interimText
                    );

                }


                /* ===============================================
                   FINAL SENTENCE
                   =============================================== */

                if (
                    finalText.trim()
                ) {

                    const english =
                        cleanPunctuation(
                            finalText
                        );


                    /* ===========================================
                       ENGLISH
                       =========================================== */

                    if (
                        currentLanguage === "en"
                    ) {

                        displayEnglish(
                            english
                        );

                    }


                    /* ===========================================
                       THAI
                       =========================================== */

                    if (
                        currentLanguage === "th"
                    ) {

                        const requestNumber =
                            ++translationNumber;


                        /*
                         * Show English while
                         * Thai translation is being obtained.
                         */

                        showCaption(
                            english
                        );


                        const thai =
                            await translateToThai(
                                english
                            );


                        /*
                         * Display Thai only if
                         * Thai mode is still active.
                         */

                        if (
                            thai &&
                            currentLanguage === "th" &&
                            requestNumber ===
                                translationNumber
                        ) {

                            showCaption(
                                thai
                            );

                        }

                    }


                    /* ===========================================
                       CLEAR AFTER TWO SECONDS
                       =========================================== */

                    clearTimeout(
                        clearTimer
                    );


                    clearTimer =
                        setTimeout(
                            function () {

                                clearCaption();

                            },
                            CLEAR_DELAY
                        );

                }

            };


        /* ========================================================
           SPEECH START
           ======================================================== */

        recognition.onspeechstart =
            function () {

                clearCaption();

            };


        /* ========================================================
           SPEECH END
           ======================================================== */

        recognition.onspeechend =
            function () {

                clearTimeout(
                    clearTimer
                );


                clearTimer =
                    setTimeout(
                        function () {

                            clearCaption();

                        },
                        CLEAR_DELAY
                    );

            };


        /* ========================================================
           RECOGNITION ENDED
           ======================================================== */

        recognition.onend =
            function () {

                if (
                    !restarting
                ) {

                    restarting =
                        true;


                    setTimeout(
                        function () {

                            restarting =
                                false;


                            try {

                                startRecognition();

                            } catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ========================================================
           ERROR
           ======================================================== */

        recognition.onerror =
            function (event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ========================================================
           START
           ======================================================== */

        try {

            recognition.start();

        } catch (error) {

            console.log(
                "Recognition could not start yet."
            );

        }

    }


    /* ============================================================
       START WHEN PAGE LOADS
       ============================================================ */

    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>

</html>
