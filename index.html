<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Transcription</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    max-height: 4em;
    overflow: hidden;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.15;
    overflow-wrap: break-word;
    word-break: normal;
    opacity: 0;
    transition: opacity 0.1s ease;
    pointer-events: none;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25,25,25,0.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

:fullscreen #teacherMenu {
    display: none;
}

</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en">English</option>
        <option value="th" selected>Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ============================================================
   SETTINGS
   ============================================================ */

const CLEAR_DELAY = 2000;

const TRANSLATION_DELAY = 700;

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";


let currentLanguage = "th";

let recognition = null;

let restarting = false;

let clearTimer = null;

let translationTimer = null;

let translationController = null;

let translationID = 0;


/*
 * Text accumulated during the current
 * speech-recognition session.
 */

let confirmedText = "";

let currentInterimText = "";


/* ============================================================
   FONT SIZE
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        clearTimeout(
            translationTimer
        );

        if (translationController) {

            translationController.abort();

        }

        confirmedText = "";

        currentInterimText = "";

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   SHOW CAPTION
   ============================================================ */

function showCaption(text) {

    if (
        !text ||
        !text.trim()
    ) {

        return;

    }

    clearTimeout(
        clearTimer
    );

    caption.textContent =
        text.trim();

    caption.classList.add(
        "visible"
    );

}


/* ============================================================
   CLEAR CAPTION
   ============================================================ */

function clearCaption() {

    clearTimeout(
        clearTimer
    );

    caption.textContent = "";

    caption.classList.remove(
        "visible"
    );

}


/* ============================================================
   CLEAN TEXT
   ============================================================ */

function cleanText(text) {

    return text
        .replace(/\s+/g, " ")
        .replace(/\s+([,.!?;:])/g, "$1")
        .trim();

}


/* ============================================================
   GET CURRENT SPEECH
   ============================================================ */

function getCurrentSpeech() {

    return cleanText(
        confirmedText +
        " " +
        currentInterimText
    );

}


/* ============================================================
   TRANSLATE TO THAI
   ============================================================ */

async function translateToThai(text) {

    if (!text) {
        return null;
    }


    /*
     * Cancel the previous translation request.
     */

    if (translationController) {

        translationController.abort();

    }


    translationController =
        new AbortController();


    const thisID =
        ++translationID;


    try {

        const url =
            TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    signal:
                        translationController.signal
                }
            );


        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Ignore an old translation if
         * newer speech has already arrived.
         */

        if (
            thisID !== translationID
        ) {

            return null;

        }


        if (
            currentLanguage !== "th"
        ) {

            return null;

        }


        return data.translation || null;

    }

    catch (error) {

        /*
         * Abort errors are normal because
         * we intentionally cancel old requests.
         */

        if (
            error.name !== "AbortError"
        ) {

            console.error(
                "Thai translation error:",
                error
            );

        }

        return null;

    }

}


/* ============================================================
   SCHEDULE TRANSLATION
   ============================================================ */

function scheduleTranslation() {

    if (
        currentLanguage !== "th"
    ) {

        return;

    }


    clearTimeout(
        translationTimer
    );


    translationTimer =
        setTimeout(
            async function () {

                const speech =
                    getCurrentSpeech();


                if (!speech) {

                    return;

                }


                const thai =
                    await translateToThai(
                        speech
                    );


                if (
                    thai &&
                    currentLanguage === "th"
                ) {

                    showCaption(
                        thai
                    );

                }

            },
            TRANSLATION_DELAY
        );

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

} else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        /*
         * IMPORTANT:
         *
         * You speak English.
         * Chrome listens in English.
         */

        recognition.lang =
            "en-US";


        /* ====================================================
           RESULT
           ==================================================== */

        recognition.onresult =
            function(event) {

                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    const result =
                        event.results[i];


                    const transcript =
                        result[0].transcript;


                    /* =========================================
                       FINAL SPEECH
                       ========================================= */

                    if (
                        result.isFinal
                    ) {

                        confirmedText +=
                            " " +
                            transcript;


                        confirmedText =
                            cleanText(
                                confirmedText
                            );


                        currentInterimText =
                            "";


                    }

                    /* =========================================
                       INTERIM SPEECH
                       ========================================= */

                    else {

                        currentInterimText =
                            transcript;

                    }

                }


                const speech =
                    getCurrentSpeech();


                if (!speech) {

                    return;

                }


                /* =============================================
                   ENGLISH
                   ============================================= */

                if (
                    currentLanguage === "en"
                ) {

                    showCaption(
                        speech
                    );

                    return;

                }


                /* =============================================
                   THAI
                   ============================================= */

                if (
                    currentLanguage === "th"
                ) {

                    /*
                     * English stays completely hidden.
                     *
                     * We translate the accumulated speech.
                     */

                    scheduleTranslation();

                }

            };


        /* ====================================================
           SPEECH START
           ==================================================== */

        recognition.onspeechstart =
            function () {

                clearTimeout(
                    clearTimer
                );

            };


        /* ====================================================
           SPEECH END
           ==================================================== */

        recognition.onspeechend =
            function () {

                /*
                 * Translate the latest complete phrase.
                 */

                if (
                    currentLanguage === "th"
                ) {

                    scheduleTranslation();

                }


                clearTimeout(
                    clearTimer
                );


                clearTimer =
                    setTimeout(
                        function () {

                            clearCaption();

                            /*
                             * Start a fresh sentence
                             * after the speaker stops.
                             */

                            confirmedText = "";

                            currentInterimText = "";

                        },
                        CLEAR_DELAY
                    );

            };


        /* ====================================================
           RECOGNITION ENDED
           ==================================================== */

        recognition.onend =
            function () {

                if (
                    !restarting
                ) {

                    restarting =
                        true;


                    setTimeout(
                        function () {

                            restarting =
                                false;


                            try {

                                startRecognition();

                            } catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ====================================================
           ERROR
           ==================================================== */

        recognition.onerror =
            function (event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ====================================================
           START
           ==================================================== */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition restarting..."
            );

        }

    }


    /* ============================================================
       START
       ============================================================ */

    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>
</html>
