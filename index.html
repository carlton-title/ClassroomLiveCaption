<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Caption</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =========================
   CONTROL BAR
   ========================= */

#controls {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #181818;
    border-bottom: 1px solid #444;
    flex-wrap: wrap;
}

button,
select {
    appearance: none;
    -webkit-appearance: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    color: #fff;
    background: #292929;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 9px 12px;
    cursor: pointer;
}

button:hover,
select:hover {
    background: #383838;
}

button:active {
    background: #444;
}

button:disabled {
    opacity: 0.45;
    cursor: default;
}

label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    color: #ddd;
}

#status {
    margin-left: auto;
    color: #aaa;
    font-size: 14px;
    white-space: nowrap;
}

/* =========================
   CAPTION AREA
   ========================= */

#captionArea {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4vh 5vw;
    overflow: hidden;
}

#caption {
    width: 100%;
    max-width: 1900px;
    text-align: center;
    font-size: 90px;
    font-weight: 700;
    line-height: 1.12;
}

#captionText {
    width: 100%;
    max-height: 4.5em;
    overflow: hidden;
    overflow-wrap: break-word;
    word-break: normal;
    white-space: pre-wrap;
}

#captionText.interim {
    opacity: 0.72;
}

#captionText.spelling {
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.hidden {
    visibility: hidden;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    #controls {
        padding: 8px;
    }

    button,
    select {
        font-size: 14px;
        padding: 8px 10px;
    }

    #status {
        width: 100%;
        margin-left: 0;
        padding-top: 2px;
    }

    #captionArea {
        padding: 3vh 4vw;
    }

    #caption {
        font-size: 55px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     CONTROLS
     ===================================================== -->

<div id="controls">

    <button id="startBtn" type="button">
        ▶ Start Listening
    </button>

    <button id="stopBtn" type="button" disabled>
        ■ Stop
    </button>

    <button id="clearBtn" type="button">
        Clear
    </button>

    <button id="fullscreenBtn" type="button">
        ⛶ Full Screen
    </button>

    <label>
        Size:
        <select id="sizeSelect">
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="80">80</option>
            <option value="90" selected>90</option>
            <option value="100">100</option>
            <option value="110">110</option>
            <option value="120">120</option>
        </select>
    </label>

    <label>
        Language:
        <select id="languageSelect">
            <option value="en-US">English</option>
            <option value="th-TH">Thai</option>
        </select>
    </label>

    <span id="status">Ready</span>

</div>


<!-- =====================================================
     CAPTION
     ===================================================== -->

<main id="captionArea">

    <div id="caption">

        <div id="captionText" class="hidden"></div>

    </div>

</main>


<script>
"use strict";

/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================================================
   ELEMENTS
   ========================================================= */

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const clearBtn =
    document.getElementById("clearBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const sizeSelect =
    document.getElementById("sizeSelect");

const languageSelect =
    document.getElementById("languageSelect");

const status =
    document.getElementById("status");

const caption =
    document.getElementById("caption");

const captionText =
    document.getElementById("captionText");


/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let listening = false;
let manuallyStopped = false;
let restarting = false;

let finalCaption = "";
let interimCaption = "";

let silenceTimer = null;

let spellingMode = false;
let waitingForSpellingWord = false;

let lastFinalSentence = "";

const SILENCE_DELAY = 1500;
const MIN_FONT_SIZE = 35;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {
    status.textContent = message;
}


/* =========================================================
   CAPTION VISIBILITY
   ========================================================= */

function showCaption() {
    captionText.classList.remove("hidden");
}

function hideCaption() {
    captionText.classList.add("hidden");
}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilenceTimer() {

    if (silenceTimer !== null) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
    }
}


function startSilenceTimer() {

    cancelSilenceTimer();

    silenceTimer = setTimeout(function () {

        finalCaption = "";
        interimCaption = "";

        spellingMode = false;
        waitingForSpellingWord = false;

        lastFinalSentence = "";

        captionText.textContent = "";

        captionText.classList.remove("interim");
        captionText.classList.remove("spelling");

        hideCaption();

        silenceTimer = null;

    }, SILENCE_DELAY);
}


/* =========================================================
   CLEAR CAPTION
   ========================================================= */

function clearCaption() {

    cancelSilenceTimer();

    finalCaption = "";
    interimCaption = "";

    spellingMode = false;
    waitingForSpellingWord = false;

    lastFinalSentence = "";

    captionText.textContent = "";

    captionText.classList.remove("interim");
    captionText.classList.remove("spelling");

    hideCaption();
}


/* =========================================================
   FILLER WORDS
   ========================================================= */

function removeFillers(text) {

    return text
        .replace(
            /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
            ""
        )
        .replace(/\s{2,}/g, " ")
        .trim();
}


/* =========================================================
   REPEATED WORDS
   ========================================================= */

function removeImmediateRepeats(text) {

    const words = text.split(/\s+/);
    const result = [];

    for (const word of words) {

        const current =
            word
                .toLowerCase()
                .replace(/[.,!?;:"'()[\]{}-]/g, "");

        const previous =
            result.length
                ? result[result.length - 1]
                    .toLowerCase()
                    .replace(/[.,!?;:"'()[\]{}-]/g, "")
                : "";

        if (
            current &&
            current === previous
        ) {
            continue;
        }

        result.push(word);
    }

    return result.join(" ");
}


/* =========================================================
   SPOKEN PUNCTUATION
   ========================================================= */

function convertSpokenPunctuation(text) {

    let t = text;

    const replacements = [

        [/\bnew paragraph\b/gi, "\n\n"],
        [/\bnew line\b/gi, "\n"],

        [/\bquestion mark\b/gi, "?"],
        [/\bquestionmark\b/gi, "?"],

        [/\bexclamation mark\b/gi, "!"],
        [/\bexclamation point\b/gi, "!"],

        [/\bcomma\b/gi, ","],

        [/\bfull stop\b/gi, "."],
        [/\bperiod\b/gi, "."],

        [/\bcolon\b/gi, ":"],
        [/\bsemicolon\b/gi, ";"],

        [/\bopen parenthesis\b/gi, "("],
        [/\bclose parenthesis\b/gi, ")"],

        [/\bquotation mark\b/gi, "\""],

        [/\bhyphen\b/gi, "-"],
        [/\bdash\b/gi, "—"]
    ];

    for (const [pattern, replacement] of replacements) {
        t = t.replace(pattern, replacement);
    }

    return t;
}


/* =========================================================
   QUESTION MARKS
   ========================================================= */

function addQuestionMark(text) {

    const t = text.trim();

    if (!t) {
        return "";
    }

    if (/[.!?]$/.test(t)) {
        return t;
    }

    const questionWords =
        /^(who|what|when|where|why|how|which|whose|whom)\b/i;

    const auxiliaryWords =
        /^(am|is|are|was|were|do|does|did|can|could|will|would|should|shall|may|might|have|has|had)\b/i;

    if (
        questionWords.test(t) ||
        auxiliaryWords.test(t)
    ) {
        return t + "?";
    }

    return t;
}


/* =========================================================
   NUMBER CONVERSION
   ========================================================= */

const numberUnits = {
    zero: 0,
    one: 1,
    two: 2,
    three: 3,
    four: 4,
    five: 5,
    six: 6,
    seven: 7,
    eight: 8,
    nine: 9,
    ten: 10,
    eleven: 11,
    twelve: 12,
    thirteen: 13,
    fourteen: 14,
    fifteen: 15,
    sixteen: 16,
    seventeen: 17,
    eighteen: 18,
    nineteen: 19
};

const numberTens = {
    twenty: 20,
    thirty: 30,
    forty: 40,
    fifty: 50,
    sixty: 60,
    seventy: 70,
    eighty: 80,
    ninety: 90
};


function wordsToNumber(words) {

    let total = 0;
    let current = 0;
    let found = false;

    for (const word of words) {

        if (numberUnits[word] !== undefined) {

            current += numberUnits[word];
            found = true;

        } else if (numberTens[word] !== undefined) {

            current += numberTens[word];
            found = true;

        } else if (word === "hundred") {

            if (current === 0) {
                current = 1;
            }

            current *= 100;
            found = true;

        } else if (word === "thousand") {

            if (current === 0) {
                current = 1;
            }

            total += current * 1000;
            current = 0;
            found = true;

        } else {

            return null;
        }
    }

    return found
        ? total + current
        : null;
}


function convertNumbers(text) {

    const tokens = text.split(/\s+/);
    const result = [];

    let i = 0;

    while (i < tokens.length) {

        let numberValue = null;
        let numberLength = 0;

        const maximum =
            Math.min(6, tokens.length - i);

        for (
            let length = maximum;
            length >= 1;
            length--
        ) {

            const candidate =
                tokens
                    .slice(i, i + length)
                    .map(function (word) {

                        return word
                            .toLowerCase()
                            .replace(/[^a-z]/g, "");

                    });

            const value =
                wordsToNumber(candidate);

            if (value !== null) {

                numberValue = value;
                numberLength = length;

                break;
            }
        }

        if (numberLength > 0) {

            result.push(String(numberValue));
            i += numberLength;

        } else {

            result.push(tokens[i]);
            i++;
        }
    }

    return result.join(" ");
}


/* =========================================================
   SPELLING
   ========================================================= */

function spellWord(word) {

    const clean =
        word
            .replace(/[^A-Za-z]/g, "")
            .toUpperCase();

    if (!clean) {
        return "";
    }

    return clean.split("").join("-");
}


function extractSpellCommand(text) {

    const cleaned =
        text
            .trim()
            .replace(/[.!?]+$/g, "")
            .trim();

    const match =
        cleaned.match(
            /^(?:please\s+)?spell(?:\s+the\s+word)?\s+([A-Za-z]+)$/i
        );

    if (!match) {
        return null;
    }

    return match[1];
}


function isSpellCommand(text) {

    const cleaned =
        text
            .trim()
            .replace(/[.!?]+$/g, "")
            .trim()
            .toLowerCase();

    return (
        cleaned === "spell" ||
        cleaned === "please spell"
    );
}


function processSpelling(text) {

    const cleaned =
        text
            .trim()
            .replace(/[.!?]+$/g, "")
            .trim();


    /* Example:
       "spell apple"
    */

    const directWord =
        extractSpellCommand(cleaned);

    if (directWord) {

        spellingMode = false;
        waitingForSpellingWord = false;

        return spellWord(directWord);
    }


    /* Example:
       "spell"
    */

    if (isSpellCommand(cleaned)) {

        spellingMode = true;
        waitingForSpellingWord = true;

        return "";
    }


    /* Word after "spell" */

    if (
        spellingMode &&
        waitingForSpellingWord
    ) {

        const words =
            cleaned.split(/\s+/);

        if (words.length === 1) {

            const word = words[0];

            if (/^[A-Za-z]+$/.test(word)) {

                spellingMode = false;
                waitingForSpellingWord = false;

                return spellWord(word);
            }
        }

        spellingMode = false;
        waitingForSpellingWord = false;
    }

    return null;
}


/* =========================================================
   NORMAL SPEECH
   ========================================================= */

function processNormalSpeech(text) {

    if (!text) {
        return "";
    }

    let t = text.trim();

    t = removeFillers(t);

    t = removeImmediateRepeats(t);

    t = convertSpokenPunctuation(t);

    t = convertNumbers(t);

    t =
        t
            .replace(/\s+([,.!?;:)\]}])/g, "$1")
            .replace(/([(\[])\s+/g, "$1")
            .replace(/[ \t]{2,}/g, " ")
            .trim();

    /*
       Only automatically add ? to likely questions.
    */

    t = addQuestionMark(t);

    return t;
}


/* =========================================================
   FONT FITTING
   ========================================================= */

function fitCaption() {

    if (!captionText.textContent.trim()) {
        return;
    }

    let fontSize =
        Number(sizeSelect.value);

    caption.style.fontSize =
        fontSize + "px";

    /*
       Reduce the font until the caption
       fits inside the available height.
    */

    while (
        captionText.scrollHeight >
        captionText.clientHeight &&
        fontSize > MIN_FONT_SIZE
    ) {

        fontSize -= 2;

        caption.style.fontSize =
            fontSize + "px";
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderCaption() {

    const display =
        [finalCaption, interimCaption]
            .filter(Boolean)
            .join(" ")
            .trim();

    if (!display) {

        captionText.textContent = "";

        hideCaption();

        return;
    }

    captionText.textContent = display;

    captionText.classList.toggle(
        "interim",
        Boolean(interimCaption)
    );

    showCaption();

    requestAnimationFrame(function () {
        fitCaption();
    });
}


/* =========================================================
   ADD FINAL SPEECH
   ========================================================= */

function addFinalSpeech(text) {

    if (!text.trim()) {
        return;
    }


    /*
       SPELLING COMMANDS
    */

    const spellingResult =
        processSpelling(text);

    if (spellingResult !== null) {

        finalCaption = spellingResult;
        interimCaption = "";

        captionText.classList.toggle(
            "spelling",
            Boolean(spellingResult)
        );

        renderCaption();

        return;
    }


    /*
       "spell" is waiting for a word.
    */

    if (
        spellingMode &&
        waitingForSpellingWord
    ) {
        return;
    }


    /*
       NORMAL SPEECH
    */

    const processed =
        processNormalSpeech(text);

    if (!processed.trim()) {
        return;
    }


    /*
       Prevent exact duplicate recognition.
    */

    if (
        processed.toLowerCase() ===
        lastFinalSentence.toLowerCase()
    ) {
        return;
    }


    /*
       Punctuation handling.
    */

    if (
        /^[,.!?;:)\]}]/.test(processed)
    ) {

        finalCaption =
            finalCaption.trim() +
            processed;

    } else {

        finalCaption =
            (
                finalCaption +
                " " +
                processed
            )
                .replace(/[ \t]+/g, " ")
                .trim();
    }


    lastFinalSentence = processed;

    captionText.classList.remove("spelling");

    renderCaption();
}


/* =========================================================
   CREATE SPEECH RECOGNITION
   ========================================================= */

function createRecognition() {

    if (!SpeechRecognition) {

        startBtn.disabled = true;
        stopBtn.disabled = true;

        setStatus(
            "Speech recognition is not supported. Use Google Chrome."
        );

        return null;
    }


    const r =
        new SpeechRecognition();


    r.continuous = true;

    r.interimResults = true;

    r.maxAlternatives = 1;

    r.lang = languageSelect.value;


    /* =====================================================
       START
       ===================================================== */

    r.onstart = function () {

        restarting = false;
        listening = true;

        startBtn.disabled = true;
        stopBtn.disabled = false;

        setStatus("Listening...");
    };


    /* =====================================================
       RESULT
       ===================================================== */

    r.onresult = function (event) {

        cancelSilenceTimer();

        let finalText = "";
        let interimText = "";


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const result =
                event.results[i];

            const transcript =
                result[0].transcript.trim();

            if (!transcript) {
                continue;
            }


            if (result.isFinal) {

                finalText +=
                    " " + transcript;

            } else {

                interimText +=
                    " " + transcript;
            }
        }


        /*
           FINAL SPEECH
        */

        if (finalText.trim()) {

            addFinalSpeech(
                finalText.trim()
            );

            startSilenceTimer();
        }


        /*
           INTERIM SPEECH
        */

        if (
            interimText.trim() &&
            !waitingForSpellingWord
        ) {

            interimCaption =
                processNormalSpeech(
                    interimText.trim()
                );

        } else {

            interimCaption = "";
        }


        renderCaption();
    };


    /* =====================================================
       ERROR
       ===================================================== */

    r.onerror = function (event) {

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            listening = false;
            manuallyStopped = true;

            startBtn.disabled = false;
            stopBtn.disabled = true;

            setStatus(
                "Microphone permission denied."
            );

            return;
        }


        if (event.error === "audio-capture") {

            setStatus(
                "Microphone not available."
            );

            return;
        }


        if (event.error === "network") {

            setStatus(
                "Speech recognition network error."
            );

            return;
        }


        if (event.error === "no-speech") {

            if (listening) {
                setStatus("Listening...");
            }

            return;
        }


        if (event.error === "aborted") {
            return;
        }


        setStatus(
            "Speech error: " + event.error
        );
    };


    /* =====================================================
       END
       ===================================================== */

    r.onend = function () {

        restarting = false;


        /*
           Chrome frequently ends continuous
           recognition by itself.

           If the user did NOT press Stop,
           automatically start it again.
        */

        if (
            listening &&
            !manuallyStopped
        ) {

            setStatus("Reconnecting microphone...");

            restartRecognition();

            return;
        }


        listening = false;

        startBtn.disabled = false;
        stopBtn.disabled = true;

        setStatus("Stopped");
    };


    return r;
}


/* =========================================================
   RESTART RECOGNITION
   ========================================================= */

function restartRecognition() {

    if (
        !recognition ||
        !listening ||
        manuallyStopped ||
        restarting
    ) {
        return;
    }

    restarting = true;

    setTimeout(function () {

        if (
            !recognition ||
            !listening ||
            manuallyStopped
        ) {

            restarting = false;
            return;
        }


        try {

            recognition.lang =
                languageSelect.value;

            recognition.start();

        } catch (error) {

            /*
               Chrome can throw InvalidStateError
               when start() is called too quickly.

               Try again.
            */

            restarting = false;

            setTimeout(function () {

                if (
                    listening &&
                    !manuallyStopped
                ) {
                    restartRecognition();
                }

            }, 500);
        }

    }, 350);
}


/* =========================================================
   INITIALIZE RECOGNITION
   ========================================================= */

recognition =
    createRecognition();


/* =========================================================
   START BUTTON
   ========================================================= */

startBtn.addEventListener(
    "click",
    function () {

        if (!recognition) {

            setStatus(
                "Speech recognition is unavailable."
            );

            return;
        }


        if (listening) {
            return;
        }


        manuallyStopped = false;

        restarting = false;

        clearCaption();


        recognition.lang =
            languageSelect.value;


        try {

            recognition.start();

        } catch (error) {

            /*
               If Chrome says recognition is already
               running, allow the existing session.
            */

            if (
                error.name ===
                "InvalidStateError"
            ) {

                listening = true;

                startBtn.disabled = true;
                stopBtn.disabled = false;

                setStatus("Listening...");

                return;
            }


            setStatus(
                "Could not start microphone."
            );
        }
    }
);


/* =========================================================
   STOP BUTTON
   ========================================================= */

stopBtn.addEventListener(
    "click",
    function () {

        manuallyStopped = true;

        listening = false;

        restarting = false;

        cancelSilenceTimer();

        interimCaption = "";

        spellingMode = false;

        waitingForSpellingWord = false;


        if (recognition) {

            try {
                recognition.stop();
            } catch (error) {}
        }


        renderCaption();


        startBtn.disabled = false;
        stopBtn.disabled = true;

        setStatus("Stopped");
    }
);


/* =========================================================
   CLEAR BUTTON
   ========================================================= */

clearBtn.addEventListener(
    "click",
    function () {

        clearCaption();

        setStatus(
            listening
                ? "Listening..."
                : "Ready"
        );
    }
);


/* =========================================================
   FONT SIZE
   ========================================================= */

sizeSelect.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            sizeSelect.value + "px";

        requestAnimationFrame(function () {
            fitCaption();
        });
    }
);


/* =========================================================
   LANGUAGE
   ========================================================= */

languageSelect.addEventListener(
    "change",
    function () {

        if (!recognition) {
            return;
        }


        const wasListening =
            listening;


        if (wasListening) {

            /*
               Stop the old language session.
            */

            manuallyStopped = true;

            listening = false;

            restarting = false;

            try {
                recognition.stop();
            } catch (error) {}

        }


        recognition.lang =
            languageSelect.value;


        if (wasListening) {

            /*
               Start again using the new language.
            */

            setTimeout(function () {

                manuallyStopped = false;
                listening = false;
                restarting = false;

                try {

                    recognition.start();

                } catch (error) {

                    restartRecognition();
                }

            }, 500);

        } else {

            setStatus("Ready");
        }
    }
);


/* =========================================================
   FULL SCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();
            }

        } catch (error) {

            setStatus(
                "Full screen unavailable."
            );
        }
    }
);


/* =========================================================
   FULLSCREEN CHANGE
   ========================================================= */

document.addEventListener(
    "fullscreenchange",
    function () {

        const controls =
            document.getElementById("controls");


        if (document.fullscreenElement) {

            controls.style.display = "none";

        } else {

            controls.style.display = "flex";
        }


        requestAnimationFrame(function () {
            fitCaption();
        });
    }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function () {

        requestAnimationFrame(function () {
            fitCaption();
        });
    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

caption.style.fontSize =
    sizeSelect.value + "px";

hideCaption();

setStatus(
    SpeechRecognition
        ? "Ready"
        : "Use Google Chrome for speech recognition."
);

</script>

</body>
</html>
