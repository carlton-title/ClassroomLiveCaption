<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classroom Live Caption</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

/* =========================
   CONTROLS
   ========================= */

#controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  padding: 8px 11px;
  border: 1px solid #555;
  border-radius: 6px;
  background: #252525;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

#status {
  margin-left: auto;
  color: #aaa;
  font-size: 13px;
}

/* =========================
   CAPTION AREA
   ========================= */

#captionArea {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 3vh 5vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1900px;
  text-align: center;

  /*
     Large, bold classroom text
  */
  font-weight: 700;
  line-height: 1.12;
  font-size: 90px;
}

#captionText {
  width: 100%;
  max-height: 4.48em;

  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: normal;

  transition:
    opacity .15s ease,
    font-size .1s ease;
}

#captionText.interim {
  opacity: .82;
}

#captionText.hidden {
  opacity: 0;
}

#controls.hidden {
  display: none;
}

</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">
    ▶ Start Listening
  </button>

  <button id="stopBtn" disabled>
    ■ Stop
  </button>

  <button id="clearBtn">
    Clear
  </button>

  <button id="fullscreenBtn">
    ⛶ Full Screen
  </button>

  <label>
    Size:
    <select id="sizeSelect">
      <option value="60">60</option>
      <option value="72">72</option>
      <option value="80">80</option>
      <option value="90" selected>90</option>
      <option value="100">100</option>
      <option value="110">110</option>
      <option value="120">120</option>
    </select>
  </label>

  <label>
    Language:
    <select id="languageMode">
      <option value="en-US">
        English
      </option>

      <option value="th-TH">
        Thai
      </option>
    </select>
  </label>

  <span id="status">
    Ready
  </span>

</div>


<main id="captionArea">

  <div id="caption">

    <div id="captionText"></div>

  </div>

</main>


<script>

/* =========================================================
   CLASSROOM LIVE CAPTION
   NEW VERSION
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const sizeSelect =
  document.getElementById("sizeSelect");

const languageMode =
  document.getElementById("languageMode");

const status =
  document.getElementById("status");

const caption =
  document.getElementById("caption");

const captionText =
  document.getElementById("captionText");


/* =========================================================
   STATE
   ========================================================= */

let recognition = null;

let listening = false;

let currentCaption = "";

let currentInterim = "";

let silenceTimer = null;


/*
   SPELLING STATE

   false = ordinary transcription

   true = the word after "spell"
          will be spelled
*/

let spellingWaiting = false;


/*
   Used to prevent duplicate final results.
*/

let lastFinalTranscript = "";


/*
   Your current silence delay.
*/

const SILENCE_DELAY = 500;


/*
   Smallest caption size.
*/

const MIN_FONT_SIZE = 40;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {

  status.textContent = text;

}


/* =========================================================
   CAPTION CLEAR
   ========================================================= */

function clearCaption() {

  currentCaption = "";

  currentInterim = "";

  captionText.textContent = "";

  captionText.classList.remove("interim");

  captionText.classList.add("hidden");

  spellingWaiting = false;

}


/* =========================================================
   SILENCE TIMER
   ========================================================= */

function cancelSilenceTimer() {

  if (silenceTimer !== null) {

    clearTimeout(silenceTimer);

    silenceTimer = null;

  }

}


function restartSilenceTimer() {

  cancelSilenceTimer();

  silenceTimer = setTimeout(() => {

    currentCaption = "";

    currentInterim = "";

    captionText.textContent = "";

    captionText.classList.remove("interim");

    captionText.classList.add("hidden");

    lastFinalTranscript = "";

    spellingWaiting = false;

    silenceTimer = null;

  }, SILENCE_DELAY);

}


/* =========================================================
   FILLER CLEANUP
   ========================================================= */

function removeFillers(text) {

  return text

    .replace(
      /\b(um+|uh+|erm+|er+|hmm+|mm+)\b/gi,
      ""
    )

    .replace(
      /\s{2,}/g,
      " "
    )

    .trim();

}


/* =========================================================
   REPEATED WORD CLEANUP
   ========================================================= */

function removeImmediateRepeats(text) {

  const words =
    text.split(/\s+/);

  const result = [];

  for (const word of words) {

    const previous =
      result[result.length - 1];

    if (

      previous &&

      word
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "") ===

      previous
        .toLowerCase()
        .replace(/[.,!?;:"'()-]/g, "")

    ) {

      continue;

    }

    result.push(word);

  }

  return result.join(" ");

}


/* =========================================================
   SPOKEN PUNCTUATION
   ========================================================= */

function convertPunctuation(text) {

  let result = text;

  const rules = [

    [
      /\bquestion mark\b/gi,
      "?"
    ],

    [
      /\bquestionmark\b/gi,
      "?"
    ],

    [
      /\bexclamation mark\b/gi,
      "!"
    ],

    [
      /\bexclamation point\b/gi,
      "!"
    ],

    [
      /\bcomma\b/gi,
      ","
    ],

    [
      /\bperiod\b/gi,
      "."
    ],

    [
      /\bfull stop\b/gi,
      "."
    ],

    [
      /\bcolon\b/gi,
      ":"
    ],

    [
      /\bsemicolon\b/gi,
      ";"
    ],

    [
      /\bopen parenthesis\b/gi,
      "("
    ],

    [
      /\bclose parenthesis\b/gi,
      ")"
    ],

    [
      /\bquotation mark\b/gi,
      "\""
    ],

    [
      /\bquote\b/gi,
      "\""
    ],

    [
      /\bhyphen\b/gi,
      "-"
    ],

    [
      /\bdash\b/gi,
      "—"
    ],

    [
      /\bnew line\b/gi,
      "\n"
    ],

    [
      /\bnew paragraph\b/gi,
      "\n\n"
    ]

  ];


  for (const [pattern, replacement] of rules) {

    result =
      result.replace(
        pattern,
        replacement
      );

  }


  return result;

}


/* =========================================================
   NUMBER CONVERSION
   ========================================================= */

const numberUnits = {

  zero: 0,
  one: 1,
  two: 2,
  three: 3,
  four: 4,
  five: 5,
  six: 6,
  seven: 7,
  eight: 8,
  nine: 9,
  ten: 10,
  eleven: 11,
  twelve: 12,
  thirteen: 13,
  fourteen: 14,
  fifteen: 15,
  sixteen: 16,
  seventeen: 17,
  eighteen: 18,
  nineteen: 19

};


const numberTens = {

  twenty: 20,
  thirty: 30,
  forty: 40,
  fifty: 50,
  sixty: 60,
  seventy: 70,
  eighty: 80,
  ninety: 90

};


function wordsToNumber(words) {

  let total = 0;

  let current = 0;

  let found = false;


  for (const word of words) {

    if (
      numberUnits[word] !== undefined
    ) {

      current +=
        numberUnits[word];

      found = true;

    }

    else if (
      numberTens[word] !== undefined
    ) {

      current +=
        numberTens[word];

      found = true;

    }

    else if (
      word === "hundred"
    ) {

      if (current === 0) {

        current = 1;

      }

      current *= 100;

      found = true;

    }

    else if (
      word === "thousand"
    ) {

      if (current === 0) {

        current = 1;

      }

      total +=
        current * 1000;

      current = 0;

      found = true;

    }

    else {

      return null;

    }

  }


  if (!found) {

    return null;

  }


  return total + current;

}


function convertNumbers(text) {

  const words =
    text.split(/\s+/);

  const result = [];

  let index = 0;


  while (
    index < words.length
  ) {

    let foundNumber = null;

    let foundLength = 0;


    for (
      let length =
        Math.min(
          6,
          words.length - index
        );

      length >= 1;

      length--
    ) {

      const candidate =
        words
          .slice(
            index,
            index + length
          )
          .map(word =>
            word
              .toLowerCase()
              .replace(
                /[^a-z]/g,
                ""
              )
          );


      const number =
        wordsToNumber(
          candidate
        );


      if (number !== null) {

        foundNumber = number;

        foundLength = length;

        break;

      }

    }


    if (foundLength > 0) {

      result.push(
        String(foundNumber)
      );

      index += foundLength;

    }

    else {

      result.push(
        words[index]
      );

      index++;

    }

  }


  return result.join(" ");

}


/* =========================================================
   SPELLING
   ========================================================= */

function spellWord(word) {

  const clean =
    word
      .replace(
        /[^A-Za-z]/g,
        ""
      )
      .toUpperCase();


  if (!clean) {

    return "";

  }


  return clean
    .split("")
    .join("-");

}
