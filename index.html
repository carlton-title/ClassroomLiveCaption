<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Captions</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #151515;
  border-bottom: 1px solid #333;
  flex-wrap: wrap;
}

button,
select {
  font: inherit;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid #555;
  background: #252525;
  color: #fff;
  cursor: pointer;
}

button:hover,
select:hover {
  background: #333;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

#status {
  color: #bbb;
  font-size: 14px;
  margin-left: auto;
}

#captionArea {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5vh 6vw;
  overflow: hidden;
}

#caption {
  width: 100%;
  max-width: 1800px;
  text-align: center;

  font-size: 72px;
  line-height: 1.18;
  font-weight: 800;

  overflow: hidden;
}

#captionText {
  width: 100%;
  max-height: calc(2 * 1.18em);

  overflow: hidden;

  word-break: normal;
  overflow-wrap: anywhere;

  transition: opacity 0.12s ease;
}

.interim {
  opacity: 0.72;
}

#controls.hidden {
  display: none;
}

.error {
  color: #ff8a8a !important;
}
</style>
</head>

<body>

<div id="controls">

  <button id="startBtn">
    ▶ Start Listening
  </button>

  <button id="stopBtn" disabled>
    ■ Stop
  </button>

  <button id="clearBtn">
    Clear
  </button>

  <button id="fullscreenBtn">
    ⛶ Full Screen
  </button>

  <label>
    Size

    <select id="sizeSelect">
      <option value="48">48</option>
      <option value="60">60</option>
      <option value="72" selected>72</option>
      <option value="90">90</option>
      <option value="110">110</option>
      <option value="140">140</option>
      <option value="170">170</option>
    </select>

    px
  </label>

  <span id="status">Ready</span>

</div>


<main id="captionArea">

  <div id="caption">
    <div id="captionText"></div>
  </div>

</main>


<script>

(() => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  const caption =
    document.getElementById("caption");

  const captionText =
    document.getElementById("captionText");

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const fullscreenBtn =
    document.getElementById("fullscreenBtn");

  const sizeSelect =
    document.getElementById("sizeSelect");

  const status =
    document.getElementById("status");


  let recognition = null;

  let listening = false;

  /*
    This contains ONLY the words
    currently eligible to appear.

    It is NOT a transcript.
  */
  let words = [];


  /*
    Set this to true when Chrome gives
    us speech that is still being spoken.
  */
  let interimWords = [];


  function setStatus(text, error = false) {

    status.textContent = text;

    status.className =
      error ? "error" : "";

  }


  /*
    Put text into individual words.
  */
  function splitWords(text) {

    return text
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  }


  /*
    The important function.

    We physically measure the caption
    on screen.

    If it becomes more than TWO lines,
    the oldest word is immediately
    removed.

    This continues until only two lines
    remain.
  */
  function fitToTwoLines() {

    const combined =
      [...words, ...interimWords];


    captionText.textContent =
      combined.join(" ");


    /*
      Remove oldest words until the
      rendered caption fits inside
      exactly two lines.
    */

    while (
      words.length > 0 &&
      captionText.scrollHeight >
      captionText.clientHeight
    ) {

      words.shift();

      captionText.textContent =
        [
          ...words,
          ...interimWords
        ].join(" ");

    }

  }


  /*
    Render current speech.
  */
  function render() {

    captionText.textContent =
      [
        ...words,
        ...interimWords
      ].join(" ");


    fitToTwoLines();


    captionText.classList.toggle(
      "interim",
      interimWords.length > 0
    );

  }


  /*
    Add FINAL speech.

    Once Chrome confirms the words,
    they enter the rolling caption.
  */
  function addFinalText(text) {

    const newWords =
      splitWords(text);


    if (!newWords.length) {
      return;
    }


    words.push(...newWords);


    /*
      Immediately fit the caption.
    */
    fitToTwoLines();

  }


  /*
    Font size.
  */
  sizeSelect.addEventListener(
    "change",
    () => {

      caption.style.fontSize =
        sizeSelect.value + "px";


      /*
        Recalculate immediately after
        changing font size.
      */
      fitToTwoLines();

    }
  );


  /*
    Clear.
  */
  clearBtn.addEventListener(
    "click",
    () => {

      words = [];

      interimWords = [];

      captionText.textContent = "";

      setStatus(
        listening
          ? "Listening…"
          : "Ready"
      );

    }
  );


  /*
    Full screen.
  */
  fullscreenBtn.addEventListener(
    "click",
    async () => {

      try {

        if (!document.fullscreenElement) {

          await document.documentElement
            .requestFullscreen();


          document
            .getElementById("controls")
            .classList
            .add("hidden");

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        setStatus(
          "Full screen unavailable",
          true
        );

      }

    }
  );


  document.addEventListener(
    "fullscreenchange",
    () => {

      if (!document.fullscreenElement) {

        document
          .getElementById("controls")
          .classList
          .remove("hidden");

      }

    }
  );


  /*
    Check browser support.
  */
  if (!SpeechRecognition) {

    setStatus(
      "Use Chrome or Edge for speech recognition",
      true
    );

    startBtn.disabled = true;

    return;

  }


  /*
    Speech recognition.
  */
  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  /*
    Listening started.
  */
  recognition.onstart =
    () => {

      listening = true;

      startBtn.disabled = true;

      stopBtn.disabled = false;

      setStatus(
        "Listening…"
      );

    };


  /*
    Speech results.
  */
  recognition.onresult =
    (event) => {

      interimWords = [];


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (
          event.results[i].isFinal
        ) {

          addFinalText(text);

        } else {

          interimWords =
            splitWords(text);

        }

      }


      /*
        Display immediately.
      */
      render();

    };


  /*
    Errors.
  */
  recognition.onerror =
    (event) => {

      if (
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ) {

        listening = false;

        startBtn.disabled = false;

        stopBtn.disabled = true;

        setStatus(
          "Microphone permission denied",
          true
        );

      } else {

        setStatus(
          "Recognition: " +
          event.error,
          true
        );

      }

    };


  /*
    Automatically restart Chrome's
    speech recognition when necessary.
  */
  recognition.onend =
    () => {

      if (listening) {

        try {

          recognition.start();

        } catch (error) {}

      } else {

        startBtn.disabled =
          false;

        stopBtn.disabled =
          true;

        setStatus(
          "Stopped"
        );

      }

    };


  /*
    Start button.
  */
  startBtn.addEventListener(
    "click",
    () => {

      if (!listening) {

        try {

          recognition.start();

        } catch (error) {

          setStatus(
            "Could not start listening",
            true
          );

        }

      }

    }
  );


  /*
    Stop button.
  */
  stopBtn.addEventListener(
    "click",
    () => {

      listening = false;

      interimWords = [];

      recognition.stop();

      render();

    }
  );


  /*
    Initial font size.
  */
  caption.style.fontSize =
    sizeSelect.value + "px";


})();

</script>

</body>
</html>
