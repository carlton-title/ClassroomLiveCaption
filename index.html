<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Transcription</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.15;
    opacity: 0;
    transition: opacity 0.08s linear;
    overflow-wrap: break-word;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25,25,25,.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

:fullscreen #teacherMenu {
    display: none;
}
</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en" selected>English</option>
        <option value="th">Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ============================================================
   SETTINGS
   ============================================================ */

const TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";

/*
 * Short phrases must disappear quickly.
 * Ordinary 2–4 word units use the same short display window.
 */
const DISPLAY_TIME = 450;

/*
 * Small delay only when Chrome has stopped speaking,
 * allowing the final recognition result to arrive.
 */
const SPEECH_FINAL_DELAY = 100;


/* ============================================================
   STATE
   ============================================================ */

let currentLanguage = "en";

let recognition = null;

let restarting = false;

let displayTimer = null;

let translationController = null;

let translationID = 0;


/*
 * Number of words already released to the screen
 * from the current recognition stream.
 */
let emittedWordCount = 0;


/*
 * Prevents the same text from being displayed repeatedly.
 */
let lastDisplayedText = "";


/*
 * Used when the speaker pauses.
 */
let speechEndTimer = null;


/*
 * Prevent overlapping Thai translation requests.
 */
let translationQueue = Promise.resolve();


/* ============================================================
   FONT
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        emittedWordCount = 0;

        lastDisplayedText = "";

        translationID++;

        if (translationController) {
            translationController.abort();
        }

        translationQueue =
            Promise.resolve();

        clearTimeout(speechEndTimer);

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(error);

        }

    }
);


/* ============================================================
   DISPLAY
   ============================================================ */

function showSpeechUnit(text, displayTime = DISPLAY_TIME) {

    text =
        cleanText(text);

    if (!text) {
        return;
    }

    /*
     * Never display the exact same unit twice.
     */
    if (text === lastDisplayedText) {
        return;
    }

    lastDisplayedText =
        text;

    clearTimeout(displayTimer);

    caption.textContent =
        text;

    caption.classList.add("visible");

    displayTimer =
        setTimeout(
            function () {

                caption.textContent = "";

                caption.classList.remove("visible");

            },
            displayTime
        );
}


/* ============================================================
   CLEAR
   ============================================================ */

function clearCaption() {

    clearTimeout(displayTimer);

    caption.textContent = "";

    caption.classList.remove("visible");

}


/* ============================================================
   CLEAN TEXT
   ============================================================ */

function cleanText(text) {

    return text
        .replace(/\s+/g, " ")
        .replace(/\s+([,.!?;:])/g, "$1")
        .trim();

}


/* ============================================================
   WORDS
   ============================================================ */

function getWords(text) {

    text =
        cleanText(text);

    if (!text) {
        return [];
    }

    return text
        .split(/\s+/)
        .filter(Boolean);

}


/* ============================================================
   FIND SPEECH UNITS
   ============================================================ */

/*
 * The screen receives only 2–4 words at a time.
 *
 * Nothing is allowed to accumulate into a paragraph.
 */

function getSpeechUnit(words) {

    if (words.length < 2) {
        return null;
    }

    /*
     * Prefer 4 words for normal real-time flow.
     */
    const count =
        Math.min(4, words.length);

    return words
        .slice(0, count)
        .join(" ");

}


/* ============================================================
   ENGLISH REAL-TIME DISPLAY
   ============================================================ */

function processEnglishTranscript(fullText) {

    const words =
        getWords(fullText);

    /*
     * Release complete 2–4 word units immediately.
     */
    while (
        words.length -
        emittedWordCount >= 4
    ) {

        const unit =
            words
                .slice(
                    emittedWordCount,
                    emittedWordCount + 4
                )
                .join(" ");

        emittedWordCount += 4;

        showSpeechUnit(unit);
    }

}


/* ============================================================
   THAI TRANSLATION
   ============================================================ */

async function translateToThai(text) {

    if (!text) {
        return null;
    }

    if (translationController) {
        translationController.abort();
    }

    translationController =
        new AbortController();

    const controller =
        translationController;

    const requestID =
        ++translationID;

    try {

        const url =
            TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);

        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    signal: controller.signal
                }
            );

        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if (
            requestID !== translationID ||
            currentLanguage !== "th"
        ) {

            return null;
        }

        return (
            data.translation ||
            data.translatedText ||
            null
        );

    }

    catch (error) {

        if (
            error.name !== "AbortError"
        ) {

            console.error(
                "Translation error:",
                error
            );

        }

        return null;
    }
}


/* ============================================================
   THAI REAL-TIME UNIT
   ============================================================ */

function processThaiUnit(unit) {

    translationQueue =
        translationQueue.then(
            async function () {

                if (
                    currentLanguage !== "th"
                ) {
                    return;
                }

                const thai =
                    await translateToThai(unit);

                if (
                    thai &&
                    currentLanguage === "th"
                ) {

                    showSpeechUnit(
                        thai
                    );

                }

            }
        );
}


/* ============================================================
   PROCESS SPEECH
   ============================================================ */

function processSpeechText(fullText) {

    const words =
        getWords(fullText);

    /*
     * Release one 4-word unit at a time.
     *
     * This prevents accumulation.
     */
    while (
        words.length -
        emittedWordCount >= 4
    ) {

        const unit =
            words
                .slice(
                    emittedWordCount,
                    emittedWordCount + 4
                )
                .join(" ");

        emittedWordCount += 4;

        if (
            currentLanguage === "en"
        ) {

            showSpeechUnit(unit);

        }

        else if (
            currentLanguage === "th"
        ) {

            processThaiUnit(unit);

        }

    }

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

} else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();

        recognition.continuous =
            true;

        /*
         * Interim results are essential for
         * low-latency live transcription.
         */
        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;

        recognition.lang =
            "en-US";


        /* ====================================================
           RESULT
           ==================================================== */

        recognition.onresult =
            function(event) {

                clearTimeout(
                    speechEndTimer
                );


                /*
                 * Build the CURRENT recognition text.
                 *
                 * Chrome provides both final and
                 * changing interim results.
                 */
                let fullText = "";

                for (
                    let i = 0;
                    i < event.results.length;
                    i++
                ) {

                    fullText +=
                        " " +
                        event.results[i][0].transcript;

                }


                fullText =
                    cleanText(fullText);


                if (!fullText) {
                    return;
                }


                processSpeechText(
                    fullText
                );


                /*
                 * When Chrome has final results,
                 * allow the last 1–3 words to be
                 * displayed when the speaker pauses.
                 */
                let finalText = "";

                for (
                    let i = 0;
                    i < event.results.length;
                    i++
                ) {

                    if (
                        event.results[i].isFinal
                    ) {

                        finalText +=
                            " " +
                            event.results[i][0].transcript;

                    }

                }


                finalText =
                    cleanText(finalText);


                if (finalText) {

                    /*
                     * Process the remaining words
                     * after the 4-word units.
                     */
                    const finalWords =
                        getWords(finalText);

                    const remaining =
                        finalWords.slice(
                            emittedWordCount
                        );

                    if (
                        remaining.length >= 2 &&
                        remaining.length <= 3
                    ) {

                        const unit =
                            remaining.join(" ");

                        emittedWordCount +=
                            remaining.length;

                        if (
                            currentLanguage === "en"
                        ) {

                            showSpeechUnit(
                                unit
                            );

                        }

                        else {

                            processThaiUnit(
                                unit
                            );

                        }

                    }

                }

            };


        /* ====================================================
           SPEECH END
           ==================================================== */

        recognition.onspeechend =
            function() {

                /*
                 * Give Chrome a very small amount
                 * of time to deliver its final result.
                 *
                 * This is NOT a long transcription delay.
                 */
                clearTimeout(
                    speechEndTimer
                );

                speechEndTimer =
                    setTimeout(
                        function() {

                            /*
                             * Reset the word counter
                             * for the NEXT speech unit.
                             */
                            emittedWordCount = 0;

                        },
                        SPEECH_FINAL_DELAY
                    );

            };


        /* ====================================================
           ERROR
           ==================================================== */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ====================================================
           RESTART
           ==================================================== */

        recognition.onend =
            function() {

                if (!restarting) {

                    restarting =
                        true;

                    setTimeout(
                        function() {

                            restarting =
                                false;

                            try {

                                startRecognition();

                            }

                            catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ====================================================
           START
           ==================================================== */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition already running."
            );

        }

    }


    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>
</html>
