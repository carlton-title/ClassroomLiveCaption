<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Speech Caption</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Arial, Helvetica, sans-serif;
    }

    /*
    ============================================================
    CAPTION
    ============================================================
    */

    #caption {
        position: fixed;

        /* EXACT CENTER OF THE SCREEN */
        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        width: 90vw;
        max-width: 1400px;

        text-align: center;

        color: white;

        /*
        Large enough for students to read,
        but can shrink automatically for
        longer sentences.
        */
        font-size: clamp(28px, 5vw, 72px);

        font-weight: 600;

        line-height: 1.15;

        /*
        Maximum of approximately 3 lines.
        */
        max-height: 3.45em;

        overflow: hidden;

        overflow-wrap: break-word;
        word-break: normal;

        opacity: 0;

        transition: opacity 0.12s ease;

        pointer-events: none;

        user-select: none;
    }

    #caption.visible {
        opacity: 1;
    }
</style>
</head>

<body>

<!-- THE ONLY VISIBLE ELEMENT -->
<div id="caption"></div>


<script>

/*
================================================================
SPEECH RECOGNITION
================================================================
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const caption =
    document.getElementById("caption");


/*
================================================================
SETTINGS
================================================================
*/

/*
Caption remains visible for approximately
2.5 seconds after the final speech.
*/
const DISPLAY_TIME = 2500;

let clearTimer = null;

let manuallyStopped = false;


/*
================================================================
WORDS THAT MUST NEVER BE TREATED AS NUMBERS
================================================================

These words contain number words inside them.

For example:

anyone
    contains "one"

but "anyone" is NOT the number 1.

Therefore these words are protected.
================================================================
*/

const protectedWords = new Set([
    "anyone",
    "someone",
    "everyone",
    "nobody",
    "anybody",
    "everybody",
    "nothing",
    "something",
    "everything",
    "someone's",
    "anyone's",
    "everyone's"
]);


/*
================================================================
STANDALONE NUMBER WORDS
================================================================
*/

const numberWords = {

    zero: "0",

    one: "1",
    two: "2",
    three: "3",
    four: "4",
    five: "5",
    six: "6",
    seven: "7",
    eight: "8",
    nine: "9",
    ten: "10",

    eleven: "11",
    twelve: "12",
    thirteen: "13",
    fourteen: "14",
    fifteen: "15",
    sixteen: "16",
    seventeen: "17",
    eighteen: "18",
    nineteen: "19",

    twenty: "20",
    thirty: "30",
    forty: "40",
    fifty: "50",
    sixty: "60",
    seventy: "70",
    eighty: "80",
    ninety: "90",

    hundred: "100",
    thousand: "1000"
};


/*
================================================================
PROTECT WORDS SUCH AS "ANYONE"
================================================================
*/

function protectWords(text) {

    return text.replace(
        /\b[a-zA-Z]+(?:'[a-zA-Z]+)?\b/g,
        function(word) {

            const lower =
                word.toLowerCase();

            if (protectedWords.has(lower)) {

                return "__PROTECTED_" +
                    btoa(lower) +
                    "__";
            }

            return word;
        }
    );
}


/*
================================================================
RESTORE PROTECTED WORDS
================================================================
*/

function restoreProtectedWords(text) {

    return text.replace(
        /__PROTECTED_([^_]+)__/g,
        function(match, encoded) {

            try {
                return atob(encoded);
            }

            catch {
                return match;
            }
        }
    );
}


/*
================================================================
CONVERT ONLY STANDALONE NUMBER WORDS
================================================================
*/

function convertStandaloneNumbers(text) {

    /*
    Protect words first.

    "anyone" becomes temporarily protected.
    */

    let result =
        protectWords(text);


    /*
    Convert ONLY complete standalone words.

    "one" -> "1"

    But "anyone" cannot be touched because
    it has already been protected.
    */

    result = result.replace(
        /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand)\b/gi,

        function(match) {

            const lower =
                match.toLowerCase();

            return numberWords[lower] || match;
        }
    );


    /*
    Restore normal words.
    */

    return restoreProtectedWords(result);
}


/*
================================================================
SHOW CAPTION
================================================================
*/

function showCaption(text) {

    if (!text || !text.trim()) {
        return;
    }


    /*
    Cancel the previous disappearing timer.
    */

    clearTimeout(clearTimer);


    /*
    IMPORTANT:

    Replace the existing caption.

    DO NOT accumulate previous sentences.
    */

    caption.textContent =
        convertStandaloneNumbers(
            text.trim()
        );


    caption.classList.add("visible");
}


/*
================================================================
CLEAR CAPTION
================================================================
*/

function clearCaption() {

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove("visible");
}


/*
================================================================
START SPEECH RECOGNITION
================================================================
*/

if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();


    /*
    Keep listening continuously.
    */

    recognition.continuous = true;


    /*
    Show live/interim speech.
    */

    recognition.interimResults = true;


    /*
    English.
    */

    recognition.lang = "en-US";


    /*
    ============================================================
    SPEECH RESULTS
    ============================================================
    */

    recognition.onresult = function(event) {

        let currentText = "";


        /*
        Get the current recognition text.

        We replace the caption rather than
        adding every previous result.
        */

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            currentText +=
                event.results[i][0].transcript;
        }


        if (!currentText.trim()) {
            return;
        }


        /*
        Display the current speech.
        */

        showCaption(currentText);


        /*
        If this is a final result,
        start the automatic clearing timer.
        */

        const lastResult =
            event.results[
                event.results.length - 1
            ];


        if (
            lastResult &&
            lastResult.isFinal
        ) {

            clearTimeout(clearTimer);

            clearTimer = setTimeout(
                function() {

                    clearCaption();

                },
                DISPLAY_TIME
            );
        }
    };


    /*
    ============================================================
    WHEN NEW SPEECH STARTS
    ============================================================

    Clear the previous finished caption immediately.
    */

    recognition.onspeechstart = function() {

        clearTimeout(clearTimer);

        clearCaption();
    };


    /*
    ============================================================
    AUTOMATIC RESTART
    ============================================================
    */

    recognition.onend = function() {

        if (!manuallyStopped) {

            setTimeout(
                function() {

                    try {

                        recognition.start();

                    }

                    catch (error) {

                        /*
                        Recognition may already
                        be running. Ignore that.
                        */

                    }

                },
                100
            );
        }
    };


    /*
    ============================================================
    ERROR HANDLING
    ============================================================
    */

    recognition.onerror = function(event) {

        console.log(
            "Speech recognition error:",
            event.error
        );


        /*
        Automatically continue listening
        for recoverable errors.
        */

        if (
            event.error === "no-speech" ||
            event.error === "aborted"
        ) {

            return;
        }
    };


    /*
    ============================================================
    START AUTOMATICALLY
    ============================================================
    */

    window.addEventListener(
        "load",
        function() {

            manuallyStopped = false;

            try {

                recognition.start();

            }

            catch (error) {

                console.log(
                    "Recognition could not start automatically."
                );

            }

        }
    );

}

else {

    /*
    No visible error message is displayed
    because you requested that the screen contain
    only the caption.
    */

    console.error(
        "Speech recognition is not supported."
    );
}

</script>

</body>
</html>
