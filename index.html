<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automatic Live Transcription</title>

<style>
    /*
    ============================================================
    COMPLETELY BLACK SCREEN
    ============================================================
    */

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;

        font-family:
            Arial,
            Helvetica,
            sans-serif;
    }


    /*
    ============================================================
    ONLY VISIBLE ELEMENT: CAPTION
    ============================================================
    */

    #caption {

        position: fixed;

        /*
        EXACT CENTER OF THE SCREEN
        */

        top: 50%;
        left: 50%;

        transform:
            translate(-50%, -50%);

        width: 88vw;

        max-width: 1400px;

        /*
        Keep the caption compact.
        */

        max-height: 3.6em;

        overflow: hidden;

        text-align: center;

        color: white;

        /*
        Automatically scales according
        to screen size.
        */

        font-size:
            clamp(28px, 5vw, 72px);

        font-weight: 600;

        line-height: 1.18;

        overflow-wrap: break-word;

        word-break: normal;

        opacity: 0;

        transition:
            opacity 0.12s ease;

        /*
        Absolutely nothing can be clicked.
        */

        pointer-events: none;

        user-select: none;
    }


    #caption.visible {
        opacity: 1;
    }
</style>
</head>


<body>

<!--
============================================================
THERE IS ONLY ONE ELEMENT ON THE SCREEN.
NO BUTTONS.
NO TIMER.
NO NUMBER.
NO STATUS.
============================================================
-->

<div id="caption"></div>


<script>

/*
================================================================
AUTOMATIC SPEECH RECOGNITION
================================================================
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const caption =
    document.getElementById("caption");


/*
================================================================
SETTINGS
================================================================
*/

/*
The caption disappears after TWO SECONDS.

This is deliberately short.
*/

const CLEAR_DELAY = 2000;

let clearTimer = null;

let recognition = null;

let restarting = false;


/*
================================================================
WORDS THAT MUST ALWAYS REMAIN WORDS
================================================================
*/

const neverNumeric = new Set([

    "anyone",
    "someone",
    "everyone",

    "anybody",
    "somebody",
    "everybody",

    "nobody",
    "nothing",

    "something",
    "everything",

    "someone's",
    "anyone's",
    "everyone's",

    "somewhere",
    "anywhere",
    "everywhere",

    "sometimes"

]);


/*
================================================================
NUMBER WORDS
================================================================
*/

const numberWords = {

    zero: "zero",
    one: "one",
    two: "two",
    three: "three",
    four: "four",
    five: "five",
    six: "six",
    seven: "seven",
    eight: "eight",
    nine: "nine",

    ten: "ten",
    eleven: "eleven",
    twelve: "twelve",
    thirteen: "thirteen",
    fourteen: "fourteen",
    fifteen: "fifteen",
    sixteen: "sixteen",
    seventeen: "seventeen",
    eighteen: "eighteen",
    nineteen: "nineteen",

    twenty: "twenty",
    thirty: "thirty",
    forty: "forty",
    fifty: "fifty",
    sixty: "sixty",
    seventy: "seventy",
    eighty: "eighty",
    ninety: "ninety",

    hundred: "hundred",
    thousand: "thousand",
    million: "million",
    billion: "billion"
};


/*
================================================================
ORDINARY DIGITS → WORDS
================================================================

This prevents ordinary numeric transcription such as:

"I have 5 books"

from appearing as:

"I have 5 books"

Instead:

"I have five books"

However, years and money are protected.
================================================================
*/

function digitsToWords(text) {

    /*
    Protect money.

    Examples:

    $25
    $1,500
    25 dollars
    100 baht

    These remain numeric.
    */

    const protectedMoney = [];

    text = text.replace(
        /(?:[$€£¥]\s?\d[\d,]*(?:\.\d+)?|\b\d[\d,]*(?:\.\d+)?\s?(?:dollars?|baht|euros?|pounds?|yen))/gi,

        function(match) {

            const token =
                `__MONEY_${protectedMoney.length}__`;

            protectedMoney.push(match);

            return token;
        }
    );


    /*
    Protect years.

    Four-digit years such as:

    1990
    2026
    1985

    remain numeric.
    */

    const protectedYears = [];

    text = text.replace(
        /\b(?:1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/g,

        function(match) {

            const token =
                `__YEAR_${protectedYears.length}__`;

            protectedYears.push(match);

            return token;
        }
    );


    /*
    Convert ordinary standalone digits
    into English words.
    */

    text = text.replace(
        /\b\d+\b/g,

        function(number) {

            return integerToWords(
                parseInt(number, 10)
            );
        }
    );


    /*
    Restore years.
    */

    text = text.replace(
        /__YEAR_(\d+)__/g,

        function(match, index) {

            return protectedYears[
                parseInt(index, 10)
            ];
        }
    );


    /*
    Restore money.
    */

    text = text.replace(
        /__MONEY_(\d+)__/g,

        function(match, index) {

            return protectedMoney[
                parseInt(index, 10)
            ];
        }
    );


    return text;
}


/*
================================================================
INTEGER → ENGLISH WORDS
================================================================
*/

function integerToWords(number) {

    if (!Number.isFinite(number)) {
        return "";
    }

    if (number === 0) {
        return "zero";
    }


    const ones = [

        "",
        "one",
        "two",
        "three",
        "four",
        "five",
        "six",
        "seven",
        "eight",
        "nine",
        "ten",
        "eleven",
        "twelve",
        "thirteen",
        "fourteen",
        "fifteen",
        "sixteen",
        "seventeen",
        "eighteen",
        "nineteen"

    ];


    const tens = [

        "",
        "",
        "twenty",
        "thirty",
        "forty",
        "fifty",
        "sixty",
        "seventy",
        "eighty",
        "ninety"

    ];


    function under1000(n) {

        let result = "";


        if (n >= 100) {

            result +=
                ones[Math.floor(n / 100)] +
                " hundred";

            n %= 100;

            if (n > 0) {
                result += " ";
            }
        }


        if (n >= 20) {

            result +=
                tens[Math.floor(n / 10)];

            n %= 10;

            if (n > 0) {

                result +=
                    "-" + ones[n];
            }

        }

        else if (n > 0) {

            result += ones[n];
        }


        return result;
    }


    let result = "";


    if (number >= 1000000000) {

        result +=
            under1000(
                Math.floor(number / 1000000000)
            ) +
            " billion";

        number %= 1000000000;

        if (number > 0) {
            result += " ";
        }
    }


    if (number >= 1000000) {

        result +=
            under1000(
                Math.floor(number / 1000000)
            ) +
            " million";

        number %= 1000000;

        if (number > 0) {
            result += " ";
        }
    }


    if (number >= 1000) {

        result +=
            under1000(
                Math.floor(number / 1000)
            ) +
            " thousand";

        number %= 1000;

        if (number > 0) {
            result += " ";
        }
    }


    if (number > 0) {

        result +=
            under1000(number);
    }


    return result;
}


/*
================================================================
PROTECT WORDS SUCH AS:

anyone
someone
everyone
================================================================
*/

function protectSpecialWords(text) {

    const protectedWords = [];

    text = text.replace(
        /\b[a-zA-Z]+(?:'[a-zA-Z]+)?\b/g,

        function(word) {

            const lower =
                word.toLowerCase();

            if (neverNumeric.has(lower)) {

                const token =
                    `__WORD_${protectedWords.length}__`;

                protectedWords.push(word);

                return token;
            }

            return word;
        }
    );


    return {
        text,
        protectedWords
    };
}


/*
================================================================
RESTORE SPECIAL WORDS
================================================================
*/

function restoreSpecialWords(
    text,
    protectedWords
) {

    return text.replace(
        /__WORD_(\d+)__/g,

        function(match, index) {

            return protectedWords[
                parseInt(index, 10)
            ];
        }
    );
}


/*
================================================================
FINAL TEXT PROCESSING
================================================================
*/

function processTranscript(text) {

    /*
    Protect words such as "anyone".
    */

    const protectedResult =
        protectSpecialWords(text);


    /*
    Convert only actual numeric digits.

    Spoken words such as "one", "two",
    "three" remain WORDS.

    This is intentional.

    Therefore:

    "I have two books"

    stays:

    "I have two books"

    instead of:

    "I have 2 books"
    */

    let result =
        digitsToWords(
            protectedResult.text
        );


    /*
    Restore words such as "anyone".
    */

    result =
        restoreSpecialWords(
            result,
            protectedResult.protectedWords
        );


    return result;
}


/*
================================================================
PUNCTUATION
================================================================

The browser supplies punctuation when supported.

We preserve it.

We do NOT strip:

?
!
.
,
:
;
================================================================
*/

function cleanPunctuation(text) {

    return text
        .replace(/\s+([,.!?;:])/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
}


/*
================================================================
DISPLAY CAPTION
================================================================
*/

function displayCaption(text) {

    if (!text || !text.trim()) {
        return;
    }


    clearTimeout(clearTimer);


    let finalText =
        processTranscript(text);


    finalText =
        cleanPunctuation(finalText);


    if (!finalText) {
        return;
    }


    /*
    REPLACE the caption.

    Never append old text.
    */

    caption.textContent =
        finalText;


    caption.classList.add("visible");


    /*
    Automatically disappear after
    TWO SECONDS.
    */

    clearTimer =
        setTimeout(
            function() {

                caption.textContent = "";

                caption.classList.remove(
                    "visible"
                );

            },
            CLEAR_DELAY
        );
}


/*
================================================================
CLEAR CAPTION
================================================================
*/

function clearCaption() {

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove(
        "visible"
    );
}


/*
================================================================
CREATE RECOGNITION
================================================================
*/

function createRecognition() {

    if (!SpeechRecognition) {

        console.error(
            "Speech recognition is not supported by this browser."
        );

        return;
    }


    recognition =
        new SpeechRecognition();


    /*
    ============================================================
    AUTOMATIC CONTINUOUS LISTENING
    ============================================================
    */

    recognition.continuous = true;


    /*
    We want live speech while the person
    is speaking.
    */

    recognition.interimResults = true;


    /*
    English speech.
    */

    recognition.lang = "en-US";


    /*
    ============================================================
    SPEECH RESULTS
    ============================================================
    */

    recognition.onresult =
        function(event) {

            let transcript = "";


            /*
            Only process the current recognition
            results.

            Do NOT build a giant transcript.
            */

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;
            }


            if (!transcript.trim()) {
                return;
            }


            /*
            Display current speech.
            */

            displayCaption(
                transcript
            );


            /*
            Determine whether this is
            a completed sentence.
            */

            const lastResult =
                event.results[
                    event.results.length - 1
                ];


            if (
                lastResult &&
                lastResult.isFinal
            ) {

                clearTimeout(
                    clearTimer
                );


                /*
                Final text disappears
                after exactly two seconds.
                */

                clearTimer =
                    setTimeout(
                        clearCaption,
                        CLEAR_DELAY
                    );
            }
        };


    /*
    ============================================================
    NEW SPEECH
    ============================================================

    As soon as somebody starts talking again,
    the previous caption is cleared.
    */

    recognition.onspeechstart =
        function() {

            clearCaption();
        };


    /*
    ============================================================
    RECOGNITION ENDED
    ============================================================

    Chrome sometimes stops recognition
    automatically.

    Restart it automatically.

    There is NO button.
    */

    recognition.onend =
        function() {

            setTimeout(
                function() {

                    try {

                        recognition.start();

                    }

                    catch (error) {

                        /*
                        Ignore "already started"
                        errors.
                        */

                    }

                },
                100
            );
        };


    /*
    ============================================================
    ERROR
    ============================================================
    */

    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition:",
                event.error
            );

        };


    /*
    ============================================================
    AUTOMATIC START
    ============================================================
    */

    try {

        recognition.start();

    }

    catch (error) {

        console.log(
            "Waiting for microphone permission."
        );

    }
}


/*
================================================================
START EVERYTHING AUTOMATICALLY
================================================================
*/

if (SpeechRecognition) {

    window.addEventListener(
        "load",
        function() {

            createRecognition();

        }
    );

}

else {

    console.error(
        "This browser does not support Speech Recognition."
    );
}

</script>

</body>
</html>
