<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Transcription</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#caption{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:1500px;
    max-height:3.6em;
    overflow:hidden;
    text-align:center;
    color:white;
    font-size:96px;
    font-weight:600;
    line-height:1.12;
    overflow-wrap:break-word;
    word-break:normal;
    opacity:0;
    transition:opacity .12s ease;
    pointer-events:none;
    user-select:none;
}

#caption.visible{
    opacity:1;
}

#teacherMenu{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(25,25,25,.96);
    z-index:1000;
}

#teacherMenu label{
    color:white;
    font-size:14px;
    font-weight:600;
}

#teacherMenu select,
#teacherMenu button{
    height:32px;
    border:1px solid #666;
    border-radius:5px;
    background:#222;
    color:white;
    padding:0 10px;
    font-size:14px;
    cursor:pointer;
}

#teacherMenu button:hover,
#teacherMenu select:hover{
    background:#333;
}

:fullscreen #teacherMenu,
:-webkit-full-screen #teacherMenu{
    display:none;
}
</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en" selected>English</option>
        <option value="th">Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


const CLEAR_DELAY = 2000;

let clearTimer = null;
let recognition = null;
let restarting = false;
let currentLanguage = "en";
let translationNumber = 0;


/* ============================================================
   FONT
   ============================================================ */

fontSize.addEventListener("change",function(){

    caption.style.fontSize =
        fontSize.value + "px";

});


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener("change",function(){

    currentLanguage =
        language.value;

    translationNumber++;

    clearCaption();

});


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function(){

        try{

            if(!document.fullscreenElement){

                await document.documentElement.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   CAPTION
   ============================================================ */

function showCaption(text){

    if(!text || !text.trim())
        return;

    clearTimeout(clearTimer);

    caption.textContent =
        text.trim();

    caption.classList.add("visible");

}


function clearCaption(){

    clearTimeout(clearTimer);

    caption.textContent = "";

    caption.classList.remove("visible");

}


/* ============================================================
   PROTECTED WORDS
   ============================================================ */

const protectedWords = new Set([

    "anyone",
    "someone",
    "everyone",
    "anybody",
    "somebody",
    "everybody",
    "nobody",
    "nothing",
    "something",
    "everything",
    "anywhere",
    "somewhere",
    "everywhere",
    "sometimes"

]);


/* ============================================================
   PROTECT SPECIAL WORDS
   ============================================================ */

function protectSpecialWords(text){

    const saved = [];

    text = text.replace(
        /\b[a-zA-Z]+(?:'[a-zA-Z]+)?\b/g,
        function(word){

            const lower =
                word.toLowerCase();

            if(protectedWords.has(lower)){

                const token =
                    "___SPECIAL_" +
                    saved.length +
                    "___";

                saved.push(word);

                return token;

            }

            return word;

        }
    );

    return {
        text:text,
        saved:saved
    };

}


function restoreSpecialWords(text,saved){

    return text.replace(
        /___SPECIAL_(\d+)___/g,
        function(match,index){

            return saved[
                parseInt(index,10)
            ];

        }
    );

}


/* ============================================================
   NUMBERS
   ============================================================ */

function numberToWords(number){

    const ones = [
        "zero","one","two","three","four",
        "five","six","seven","eight","nine",
        "ten","eleven","twelve","thirteen",
        "fourteen","fifteen","sixteen",
        "seventeen","eighteen","nineteen"
    ];

    const tens = [
        "","","twenty","thirty","forty",
        "fifty","sixty","seventy","eighty",
        "ninety"
    ];

    if(number < 20)
        return ones[number];

    if(number < 100){

        return tens[Math.floor(number/10)] +
        (
            number % 10
                ? "-" + ones[number % 10]
                : ""
        );

    }

    if(number < 1000){

        return ones[Math.floor(number/100)] +
        " hundred" +
        (
            number % 100
                ? " " + numberToWords(number % 100)
                : ""
        );

    }

    if(number < 1000000){

        return numberToWords(
            Math.floor(number/1000)
        ) +
        " thousand" +
        (
            number % 1000
                ? " " + numberToWords(number % 1000)
                : ""
        );

    }

    return String(number);

}


/* ============================================================
   FORMAT NUMBERS
   ============================================================ */

function formatNumbers(text){

    const protectedResult =
        protectSpecialWords(text);

    let result =
        protectedResult.text;

    const money = [];

    result = result.replace(
        /(?:[$€£¥]\s?\d[\d,]*(?:\.\d+)?|\b\d[\d,]*(?:\.\d+)?\s?(?:dollars?|baht|euros?|pounds?|yen))/gi,
        function(match){

            const token =
                "___MONEY_" +
                money.length +
                "___";

            money.push(match);

            return token;

        }
    );

    const years = [];

    result = result.replace(
        /\b(?:1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/g,
        function(match){

            const token =
                "___YEAR_" +
                years.length +
                "___";

            years.push(match);

            return token;

        }
    );

    result = result.replace(
        /\b\d+\b/g,
        function(match){

            const number =
                parseInt(match,10);

            if(
                !Number.isSafeInteger(number) ||
                number > 999999
            ){

                return match;

            }

            return numberToWords(number);

        }
    );

    result = result.replace(
        /___YEAR_(\d+)___/g,
        function(match,index){

            return years[
                parseInt(index,10)
            ];

        }
    );

    result = result.replace(
        /___MONEY_(\d+)___/g,
        function(match,index){

            return money[
                parseInt(index,10)
            ];

        }
    );

    return restoreSpecialWords(
        result,
        protectedResult.saved
    );

}


/* ============================================================
   PUNCTUATION
   ============================================================ */

function cleanPunctuation(text){

    return text
        .replace(/\s+([,.!?;:])/g,"$1")
        .replace(/\s+/g," ")
        .trim();

}


function displayEnglish(text){

    const processed =
        formatNumbers(text);

    const cleaned =
        cleanPunctuation(processed);

    if(cleaned)
        showCaption(cleaned);

}


/* ============================================================
   ENGLISH → THAI
   ============================================================

   Uses a public LibreTranslate mirror.
   ============================================================ */

async function translateToThai(text){

    const servers = [

        "https://translate.cutie.dating/translate",

        "https://translate.fedilab.app/translate"

    ];


    for(const server of servers){

        try{

            const response =
                await fetch(
                    server,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            q:text,
                            source:"en",
                            target:"th",
                            format:"text"

                        })
                    }
                );


            if(!response.ok)
                continue;


            const data =
                await response.json();


            if(data.translatedText){

                return data.translatedText;

            }

        }catch(error){

            console.log(
                "Translation server failed:",
                server
            );

        }

    }


    return null;

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(!SpeechRecognition){

    console.error(
        "Speech Recognition is not supported."
    );

}else{

    function startRecognition(){

        recognition =
            new SpeechRecognition();

        recognition.continuous =
            true;

        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;

        recognition.lang =
            "en-US";


        recognition.onresult =
            async function(event){

                let interimText = "";
                let finalText = "";


                for(
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ){

                    const result =
                        event.results[i];

                    const transcript =
                        result[0].transcript;


                    if(result.isFinal){

                        finalText +=
                            transcript;

                    }else{

                        interimText +=
                            transcript;

                    }

                }


                /* LIVE ENGLISH */

                if(
                    interimText.trim() &&
                    currentLanguage === "en"
                ){

                    displayEnglish(
                        interimText
                    );

                }


                /* FINAL SPEECH */

                if(finalText.trim()){

                    const english =
                        cleanPunctuation(
                            formatNumbers(
                                finalText
                            )
                        );


                    /* ENGLISH */

                    if(currentLanguage === "en"){

                        showCaption(
                            english
                        );

                    }


                    /* THAI */

                    if(currentLanguage === "th"){

                        const request =
                            ++translationNumber;


                        const thai =
                            await translateToThai(
                                english
                            );


                        if(
                            thai &&
                            currentLanguage === "th" &&
                            request === translationNumber
                        ){

                            showCaption(
                                thai
                            );

                        }

                    }


                    clearTimeout(
                        clearTimer
                    );


                    clearTimer =
                        setTimeout(
                            function(){

                                clearCaption();

                            },
                            CLEAR_DELAY
                        );

                }

            };


        recognition.onspeechstart =
            function(){

                clearCaption();

            };


        recognition.onspeechend =
            function(){

                clearTimeout(
                    clearTimer
                );

                clearTimer =
                    setTimeout(
                        function(){

                            clearCaption();

                        },
                        CLEAR_DELAY
                    );

            };


        recognition.onend =
            function(){

                if(!restarting){

                    restarting = true;

                    setTimeout(
                        function(){

                            restarting = false;

                            try{

                                startRecognition();

                            }catch(error){

                                console.error(error);

                            }

                        },
                        300
                    );

                }

            };


        recognition.onerror =
            function(event){

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        try{

            recognition.start();

        }catch(error){

            console.log(
                "Recognition could not start yet."
            );

        }

    }


    window.addEventListener(
        "load",
        function(){

            startRecognition();

        }
    );

}

</script>

</body>
</html>
