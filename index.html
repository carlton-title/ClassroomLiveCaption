<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Live Transcription</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#caption {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1500px;
    text-align: center;
    color: white;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.15;
    opacity: 0;
    transition: opacity 0.08s ease;
    overflow-wrap: break-word;
    user-select: none;
}

#caption.visible {
    opacity: 1;
}

#teacherMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(25,25,25,.96);
    z-index: 1000;
}

#teacherMenu label {
    color: white;
    font-size: 14px;
    font-weight: 600;
}

#teacherMenu select,
#teacherMenu button {
    height: 32px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #222;
    color: white;
    padding: 0 10px;
    font-size: 14px;
    cursor: pointer;
}

:fullscreen #teacherMenu {
    display: none;
}
</style>
</head>

<body>

<div id="teacherMenu">

    <label for="fontSize">Font</label>

    <select id="fontSize">
        <option value="48">48 px</option>
        <option value="64">64 px</option>
        <option value="80">80 px</option>
        <option value="96" selected>96 px</option>
        <option value="120">120 px</option>
        <option value="144">144 px</option>
    </select>

    <label for="language">Language</label>

    <select id="language">
        <option value="en">English</option>
        <option value="th" selected>Thai</option>
    </select>

    <button id="fullscreenButton">
        Fullscreen
    </button>

</div>

<div id="caption"></div>

<script>

const caption =
    document.getElementById("caption");

const fontSize =
    document.getElementById("fontSize");

const language =
    document.getElementById("language");

const fullscreenButton =
    document.getElementById("fullscreenButton");


const CLOUD_TRANSLATION_SERVER =
    "https://carlton-classroom.carltonescandor.workers.dev/";


/*
 * Very short visual display time.
 *
 * This is NOT a silence timer.
 * It is only how long a completed
 * speech unit remains visible.
 */
const DISPLAY_TIME = 450;


let currentLanguage = "th";

let recognition = null;

let restarting = false;

let displayTimer = null;

let translationNumber = 0;

let translationController = null;


/* ============================================================
   FONT
   ============================================================ */

fontSize.addEventListener(
    "change",
    function () {

        caption.style.fontSize =
            fontSize.value + "px";

    }
);


/* ============================================================
   LANGUAGE
   ============================================================ */

language.addEventListener(
    "change",
    function () {

        currentLanguage =
            language.value;

        translationNumber++;

        if (translationController) {
            translationController.abort();
        }

        clearCaption();

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ============================================================
   DISPLAY
   ============================================================ */

function showCaption(text) {

    if (!text || !text.trim()) {
        return;
    }

    /*
     * ALWAYS clear whatever was previously
     * displayed before showing new speech.
     */

    clearTimeout(displayTimer);

    caption.textContent = "";

    caption.classList.remove("visible");


    /*
     * Small delay lets the previous caption
     * actually disappear before the new one.
     */

    requestAnimationFrame(function () {

        caption.textContent =
            text.trim();

        caption.classList.add("visible");


        /*
         * Automatically remove this speech unit.
         *
         * It does NOT wait for silence.
         */

        displayTimer =
            setTimeout(
                clearCaption,
                DISPLAY_TIME
            );

    });

}


function clearCaption() {

    clearTimeout(displayTimer);

    caption.textContent = "";

    caption.classList.remove("visible");

}


/* ============================================================
   CLEAN TEXT
   ============================================================ */

function cleanText(text) {

    return text
        .replace(/\s+/g, " ")
        .replace(/\s+([,.!?;:])/g, "$1")
        .trim();

}


/* ============================================================
   TRANSLATE ENGLISH → THAI
   ============================================================ */

async function translateToThai(text) {

    if (!text) {
        return null;
    }


    if (translationController) {
        translationController.abort();
    }


    translationController =
        new AbortController();


    const requestID =
        ++translationNumber;


    try {

        const url =
            CLOUD_TRANSLATION_SERVER +
            "?text=" +
            encodeURIComponent(text);


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    signal:
                        translationController.signal
                }
            );


        if (!response.ok) {

            throw new Error(
                "Translation HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Ignore an old translation.
         */

        if (
            requestID !== translationNumber ||
            currentLanguage !== "th"
        ) {

            return null;

        }


        return (
            data.translation ||
            data.translatedText ||
            null
        );

    }

    catch (error) {

        if (
            error.name !== "AbortError"
        ) {

            console.error(
                "Thai translation error:",
                error
            );

        }

        return null;

    }

}


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    alert(
        "Speech recognition is not supported. Please use Google Chrome."
    );

} else {


    function startRecognition() {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            true;


        /*
         * We need interim results so speech
         * can be recognized while speaking.
         */

        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        /*
         * SPEAKER SPEAKS ENGLISH.
         */

        recognition.lang =
            "en-US";


        /* ====================================================
           RESULT
           ==================================================== */

        recognition.onresult =
            async function(event) {


                /*
                 * We ONLY process the newest
                 * speech result.
                 *
                 * We do NOT accumulate old text.
                 */

                let latestText = "";


                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    const result =
                        event.results[i];


                    latestText +=
                        " " +
                        result[0].transcript;

                }


                latestText =
                    cleanText(
                        latestText
                    );


                if (!latestText) {
                    return;
                }


                /* =============================================
                   ENGLISH
                   ============================================= */

                if (
                    currentLanguage === "en"
                ) {

                    /*
                     * Only the current speech unit.
                     */

                    showCaption(
                        latestText
                    );

                    return;

                }


                /* =============================================
                   THAI
                   ============================================= */

                if (
                    currentLanguage === "th"
                ) {

                    /*
                     * English is NEVER displayed
                     * while Thai mode is selected.
                     */

                    const thai =
                        await translateToThai(
                            latestText
                        );


                    if (
                        thai &&
                        currentLanguage === "th"
                    ) {

                        showCaption(
                            thai
                        );

                    }

                }

            };


        /* ====================================================
           ERROR
           ==================================================== */

        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        /* ====================================================
           END
           ==================================================== */

        recognition.onend =
            function() {

                if (!restarting) {

                    restarting =
                        true;


                    setTimeout(
                        function() {

                            restarting =
                                false;


                            try {

                                startRecognition();

                            } catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },
                        300
                    );

                }

            };


        /* ====================================================
           START
           ==================================================== */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition restarting..."
            );

        }

    }


    window.addEventListener(
        "load",
        function () {

            startRecognition();

        }
    );

}

</script>

</body>
</html>
